<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Judy's Math Trail — Shareefah's Grade 5 Iowa Math Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JUDY'S MATH TRAIL -- design tokens & component styles
   Palette: warm cream / deep pine / burnt coral / golden mustard
   Type: Baloo 2 (display, playful) + Inter (body, readable)
   ============================================================ */
:root {
  --cream: #FBF6EC;
  --cream-card: #F3EEE0;
  --pine: #2F5D46;
  --pine-dark: #1F4433;
  --coral: #E8703A;
  --coral-dark: #C85A2A;
  --mustard: #E8B23D;
  --sage: #DCE6D2;
  --ink: #3A2A22;
  --ink-soft: #6B5D52;
  --line: #E2D9C6;
  --white: #FFFFFF;
  --danger: #C24545;
  --ok: #3E8E5C;

  --bg: var(--cream);
  --card: var(--white);
  --text: var(--ink);
  --text-soft: var(--ink-soft);
  --border: var(--line);
  --shadow: 0 2px 10px rgba(58,42,34,0.08), 0 1px 2px rgba(58,42,34,0.06);
  --radius: 18px;
  --radius-sm: 12px;
  --touch: 48px;
}
[data-theme="dark"] {
  --bg: #23201B;
  --card: #2E2A23;
  --cream-card: #35312A;
  --text: #F3EEE0;
  --text-soft: #C9BEB0;
  --border: #464035;
  --sage: #2E3B2F;
  --shadow: 0 2px 12px rgba(0,0,0,0.35);
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
#judy-app {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}
#judy-app h1, #judy-app h2, #judy-app h3, #judy-app .display {
  font-family: 'Baloo 2', system-ui, sans-serif;
  font-weight: 700;
  color: var(--pine);
  margin: 0 0 8px;
}
[data-theme="dark"] #judy-app h1, [data-theme="dark"] #judy-app h2,
[data-theme="dark"] #judy-app h3, [data-theme="dark"] #judy-app .display { color: var(--mustard); }

#judy-app button, #judy-app input, #judy-app select { font-family: inherit; }
#judy-app .visually-hidden {
  position: absolute; width:1px; height:1px; overflow:hidden; clip: rect(0,0,0,0);
}
#judy-app :focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  #judy-app * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

.jt-container { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
.jt-topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 16px; background: var(--pine); color: var(--white);
  position: sticky; top:0; z-index: 20;
}
.jt-topbar .brand { display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.15rem; color:var(--white); }
.jt-topbar button.icon-btn {
  background: rgba(255,255,255,0.15); border:none; color:var(--white);
  border-radius: 999px; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:1.1rem;
}
.jt-topbar button.icon-btn:hover { background: rgba(255,255,255,0.28); }
.jt-topbar-actions { display:flex; gap:8px; }

/* ---------- Trail dashboard (signature element) ---------- */
.trail-wrap { position:relative; padding: 28px 6px 10px; }
.trail-svg { width:100%; height:auto; display:block; }
.trail-node-btn {
  position:absolute; transform: translate(-50%,-50%);
  width: 84px; text-align:center; background:none; border:none; cursor:pointer;
  color: var(--text); padding:0;
}
.trail-node-circle {
  width:64px; height:64px; border-radius:50%; margin:0 auto 4px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.7rem; box-shadow: var(--shadow); border: 3px solid var(--card);
  transition: transform .15s;
}
.trail-node-btn:hover .trail-node-circle { transform: scale(1.06); }
.trail-node-label { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.78rem; line-height:1.15; }
.trail-node-pct { font-size:0.7rem; color: var(--text-soft); }

.judy-marker { position:absolute; width:46px; height:46px; transform: translate(-50%,-100%); pointer-events:none; }

/* ---------- Cards / generic components ---------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border);
}
.card-row { display:flex; gap:14px; align-items:center; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
  border-radius: 999px; padding: 12px 22px; min-height: var(--touch);
  border: none; cursor:pointer; transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--coral); color:white; box-shadow: 0 3px 0 var(--coral-dark); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-secondary { background: var(--sage); color: var(--pine-dark); }
.btn-ghost { background: transparent; color: var(--pine); border:2px solid var(--pine); }
[data-theme="dark"] .btn-ghost { color: var(--mustard); border-color: var(--mustard); }
.btn-sm { padding: 8px 16px; min-height:40px; font-size:0.9rem; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn-block { width:100%; }

.pill { display:inline-block; padding: 3px 11px; border-radius:999px; font-size:0.78rem; font-weight:700; }
.pill-sense { background:#DCEBE3; color:#1F5C3E; }
.pill-comp { background:#F6DFCB; color:#8C4A1E; }
.pill-alg { background:#E5DBF3; color:#5B3894; }
.pill-geo { background:#D9E8F2; color:#245A80; }
.pill-meas { background:#FCE7C8; color:#8A5A0D; }
.pill-data { background:#F3D9E0; color:#8E2F4C; }
[data-theme="dark"] .pill { filter: brightness(1.15) saturate(0.9); }

.progress-track { background: var(--sage); border-radius:999px; height:12px; overflow:hidden; }
.progress-fill { background: linear-gradient(90deg, var(--coral), var(--mustard)); height:100%; border-radius:999px; transition: width .4s; }

.badge-start { background: var(--coral); color:white; font-size:0.7rem; font-weight:700; padding:2px 9px; border-radius:999px; }

/* ---------- Judy mascot & speech bubble ---------- */
.judy-panel { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.judy-svg-wrap { flex:0 0 auto; width:64px; height:64px; }
.speech-bubble {
  position:relative; background: var(--cream-card); border:2px solid var(--border);
  border-radius: 16px; padding: 12px 16px; flex:1; font-size:0.98rem; line-height:1.45;
}
.speech-bubble:before {
  content:""; position:absolute; left:-9px; top:18px; width:0; height:0;
  border-top:8px solid transparent; border-bottom:8px solid transparent;
  border-right:9px solid var(--border);
}
.speech-bubble:after {
  content:""; position:absolute; left:-7px; top:18px; width:0; height:0;
  border-top:8px solid transparent; border-bottom:8px solid transparent;
  border-right:9px solid var(--cream-card);
}

/* ---------- Quiz / question card ---------- */
.q-stem { font-size:1.12rem; line-height:1.5; margin-bottom:16px; white-space:pre-line; }
.choice-list { display:flex; flex-direction:column; gap:10px; }
.choice-btn {
  text-align:left; background: var(--cream-card); border:2px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 16px; font-size:1rem; cursor:pointer;
  min-height: var(--touch); display:flex; align-items:center; gap:10px; color:var(--text);
}
.choice-btn:hover { border-color: var(--coral); }
.choice-btn.selected { border-color: var(--pine); background: var(--sage); }
.choice-btn.correct { border-color: var(--ok); background:#DFF3E4; color:#1F5C3E; }
.choice-btn.incorrect { border-color: var(--danger); background:#FBE4E4; color:#7A2626; }
[data-theme="dark"] .choice-btn.correct { background:#204632; color:#B7E8C6; }
[data-theme="dark"] .choice-btn.incorrect { background:#4A2323; color:#F3B8B8; }
.choice-letter {
  flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem;
}
.confidence-row { display:flex; gap:10px; margin: 14px 0; }
.explanation-box { margin-top:14px; padding:12px 14px; border-radius: var(--radius-sm); background: var(--cream-card); border-left:5px solid var(--pine); font-size:0.95rem; }

/* ---------- Exam mode (focused, no global nav) ---------- */
.exam-header { position:sticky; top:0; background: var(--pine-dark); color:white; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; z-index:30; }
.exam-timer { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.1rem; }
.exam-timer.low { color: #FFD3D3; }

/* ---------- Glossary popup ---------- */
.glossary-term { text-decoration: underline dotted; text-decoration-color: var(--coral); cursor:pointer; color: inherit; font-weight:600; }
.glossary-popup {
  position: fixed; inset:0; background: rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.glossary-popup-card { background: var(--card); border-radius: var(--radius); padding:20px; max-width:340px; width:100%; box-shadow: var(--shadow); }

/* ---------- Note bullets ---------- */
.note-bullet { background: var(--cream-card); border-radius: var(--radius-sm); padding:12px 14px; margin-bottom:10px; line-height:1.5; }
.note-bold { color: var(--coral-dark); font-weight:700; }
[data-theme="dark"] .note-bold { color: var(--mustard); }
.note-highlight { background: #FCE9C9; padding:1px 5px; border-radius:5px; }
[data-theme="dark"] .note-highlight { background:#5A4321; color:#FCE9C9; }
.watch-out { background: #FCEFE6; border:2px dashed var(--coral); border-radius: var(--radius-sm); padding: 12px 14px; margin-top:14px; }
[data-theme="dark"] .watch-out { background:#3B2A1E; }

/* ---------- Streak heatmap ---------- */
.heatmap-grid { display:grid; grid-template-columns: repeat(14, 1fr); gap:3px; }
.heatmap-cell { aspect-ratio:1; border-radius:3px; background: var(--sage); }

/* ---------- Misc ---------- */
.review-group-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:10px 0; }
.tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.hidden { display:none !important; }
.two-col { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
@media (max-width:560px) { .two-col { grid-template-columns: 1fr; } }
.center-text { text-align:center; }
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mb0{margin-bottom:0;}
.small-text { font-size:0.86rem; color: var(--text-soft); }

@media print {
  .jt-topbar, .no-print, .btn { display: none !important; }
  #judy-app { background: white; color: black; }
  .card { box-shadow: none; border: 1px solid #ccc; }
}

</style>
</head>

racticePool": [{"id": "Q0486", "stem": "6 + 5 × 8 = ?", "choices": ["46", "88", "19", "38"], "correctIndex": 0, "explanations": ["Correct — multiply first, then add (no parentheses needed here).", "This adds first as if there were parentheses around the first two numbers.", "This adds all three numbers instead of multiplying first.", "Off by one multiplication group."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0487", "stem": "(7 + 8) × 6 = ?", "choices": ["90", "55", "98", "96"], "correctIndex": 0, "explanations": ["Correct — do the operation inside the parentheses first, then multiply.", "This multiplies before adding, skipping the parentheses.", "This groups the wrong two numbers together.", "Close, but off by one step."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0488", "stem": "(9 − 3) ÷ 3 = ?", "choices": ["2", "8", "3", "1"], "correctIndex": 0, "explanations": ["Correct — subtract inside the parentheses first, then divide.", "This divides first and subtracts after, skipping the parentheses.", "Off by one in the final step.", "This subtracts an extra amount that isn't part of the expression."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0489", "stem": "(16 − 6) ÷ 2 = ?", "choices": ["5", "13", "6", "8"], "correctIndex": 0, "explanations": ["Correct — subtract inside the parentheses first, then divide.", "This divides first and subtracts after, skipping the parentheses.", "Off by one in the final step.", "This subtracts an extra amount that isn't part of the expression."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false "Q0494", "stem": "(7 + 8) × 2 = ?", "choices": ["30", "23", "70", "32"], "correctIndex": 0, "explanations": ["Correct — do the operation inside the parentheses first, then multiply.", "This multiplies before adding, skipping the parentheses.", "This groups the wrong two numbers together.", "Close, but off by one step."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0495", "stem": "9 + 8 × 7 = ?", "choices": ["65", "119", "24", "58"], "correctIndex": 0, "explanations": ["Correct — multiply first, then add (no parentheses needed here).", "This adds first as if there were parentheses around the first two numbers.", "This adds all three numbers instead of multiplying first.", "Off by one multiplication group."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0496", "stem": "(9 − 3) ÷ 2 = ?", "choices": ["3", "8", "4", "2"], "correctIndex": 0, "explanations": ["Correct — subtract inside the parentheses first, then divide.", "This divides first and subtracts after, skipping the parentheses.", "Off by one in the final step.", "This subtracts an extra amount that isn't part of the expression."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0497", "stem": "(15 − 7) ÷ 2 = ?", "choices": ["4", "12", "5", "6"], "correctIndex": 0, "explanations": ["Correct — subtract inside the parentheses first, then divide.", "This divides first and subtracts after, skipping the parentheses.", "Off by one in the final step.", "This subtracts an extra amount that isn't part of the expression."], "unit": "oa", "sub": "oa1", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "oa2", "name": "Numerical Patterns & Relationships", "notes": {"title": "Numerical Patterns & Relationships", "hook": "Judy holds up two paw-print trails side by side: \"Watch this — one trail hops by 3s, the other hops by 6s. They don't line up randomly... there's a secret relationship between every matching footprint!\"", "bullets": ["Two sequences generated from related rules (like 'add 3' and 'add 6') will have a {b}consistent relationship{/b} between their matching terms — check a few pairs to find it (double? triple? +2?).", "To find the next term in a single sequence, figure out the rule from the first few terms, then apply it one more time.", "{w}The relationship between two sequences is usually multiplicative (like 'double'), not additive{w/}, when both rules are 'add the same kind of amount' scaled up or down.", "An ordered pair (x, y) can be built by pairing the matching term number from two different sequences — this is exactly how points for graphing get made."], "glossary": {"sequence": {"def": "A list of numbers that follows a rule, like 2, 4, 6, 8, ...", "mnemonic": null}, "term": {"def": "One single number in a sequence.", "mnemonic": null}, "rule": {"def": "The pattern that tells you how to get from one term to the next.", "mnemonic": null}}, "watchOut": "Don't assume the relationship between two sequences is 'add the same extra amount' — test it on at least two pairs of terms, because it's very often 'multiply by' instead."}, "practicePool": [{"id": "Q0506", "stem": "Sequence X: multiples of 1 starting at 0 (0, 1, 2, 3, 4).\nSequence Y: multiples of 2 starting at 0 (0, 2, 4, 6, 8).\nWhat ordered pair (x, y) matches term number 2 from each sequence?", "choices": ["(1, 2)", "(0, 2)", "(1, 0)", "(2, 1)"], "correctIndex": 0, "explanations": ["Correct — pair the matching terms from each sequence in order.", "This uses the x-value from the wrong term.", "This uses the y-value from the wrong term.", "This swaps which sequence gives x and which gives y."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0509", "stem": "What is the next number in the pattern: 4, 11, 18, 25, 32, ___ ?", "choices": ["39", "38", "40", "64"], "correctIndex": 0, "explanations": ["Correct — the rule is 'add 7' each time.", "Off by one from the correct next term.", "Off by one from the correct next term.", "This doubles the last term instead of applying the actual rule."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0510", "stem": "What is the next number in the pattern: 8, 15, 22, 29, 36, ___ ?", "choices": ["43", "42", "44", "72"], "correctIndex": 0, "explanations": ["Correct — the rule is 'add 7' each time.", "Off by one from the correct next term.", "Off by one from the correct next term.", "This doubles the last term instead of applying the actual rule."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0511", "stem": "What is the next number in the pattern: 8, 11, 14, 17, 20, ___ ?", "choices": ["23", "22", "24", "40"], "correctIndex": 0, "explanations": ["Correct — the rule is 'add 3' each time.", "Off by one from the correct next term.", "Off by one from the correct next term.", "This doubles the last term instead of applying the actual rule."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0512", "stem": "Sequence X: multiples of 3 starting at 0 (0, 3, 6, 9, 12).\nSequence Y: multiples of 5 starting at 0 (0, 5, 10, 15, 20).\nWhat ordered pair (x, y) matches term number 3 from each sequence?", "choices": ["(6, 10)", "(3, 10)", "(6, 5)", "(10, 6)"], "correctIndex": 0, "explanations": ["Correct — pair the matching terms from each sequence in order.", "This uses the x-value from the wrong term.", "This uses the y-value from the wrong term.", "This swaps which sequence gives x and which gives y."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0513", "stem": "What is the next number in the pattern: 8, 14, 20, 26, 32, ___ ?", "choices": ["38", "37", "39", "64"], "correctIndex": 0, "explanations": ["Correct — the rule is 'add 6' each time.", "Off by one from the correct next term.", "Off by one from the correct next term.", "This doubles the last term instead of applying the actual rule."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0516", "stem": "What is the next number in the pattern: 5, 12, 19, 26, 33, ___ ?", "choices": ["40", "39", "41", "66"], "correctIndex": 0, "explanations": ["Correct — the rule is 'add 7' each time.", "Off by one from the correct next term.", "Off by one from the correct next term.", "This doubles the last term instead of applying the actual rule."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0517", "stem": "Term A starts at 2 and adds 4 each time: 2, 6, 10, 14, 18, ...\nTerm B starts at 0 and adds 8 each time: 0, 8, 16, 24, 32, ...\nWhat is true about each term in Term B compared to the corresponding term in Term A (after the first)?", "choices": ["Each term in Term B is twice the corresponding term in Term A.", "Each term in Term B is half the corresponding term in Term A.", "Each term in Term B is 2 more than the corresponding term in Term A.", "The two sequences have no consistent relationship."], "correctIndex": 0, "explanations": ["Correct — since Term B's rule adds twice as much each step, every term in B is double the matching term in A.", "This has the relationship backwards.", "This describes a constant difference, but the actual relationship is multiplicative.", "There is a consistent relationship — check the ratio between matching terms."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0520", "stem": "What is the next number in the pattern: 5, 8, 11, 14, 17, ___ ?", "choices": ["20", "19", "21", "34"], "correctIndex": 0, "explanations": ["Correct — the rule is 'add 3' each time.", "Off by one from the correct next term.", "Off by one from the correct next term.", "This doubles the last term instead of applying the actual rule."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0521", "stem": "Term A starts at 4 and adds 3 each time: 4, 7, 10, 13, 16, ...\nTerm B starts at 0 and adds 6 each time: 0, 6, 12, 18, 24, ...\nWhat is true about each term in Term B compared to the corresponding term in Term A (after the first)?", "choices": ["Each term in Term B is twice the corresponding term in Term A.", "Each term in Term B is half the corresponding term in Term A.", "Each term in Term B is 2 more than the corresponding term in Term A.", "The two sequences have no consistent relationship."], "correctIndex": 0, "explanations": ["Correct — since Term B's rule adds twice as much each step, every term in B is double the matching term in A.", "This has the relationship backwards.", "This describes a constant difference, but the actual relationship is multiplicative.", "There is a consistent relationship — check the ratio between matching terms."], "unit": "oa", "sub": "oa2", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.3", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0522", "stem": "Sequence X: multiples original amount by 3, don't add 3.", "{w}You can compare the size of two expressions without calculating them{w/} — multiplying an expression by a number bigger than 1 always makes it that many times larger."], "glossary": {"multiplicative comparison": {"def": "A comparison like '4 times as many,' which means multiply rather than add.", "mnemonic": "'Times as many' = times (multiply), not plus!"}, "translate": {"def": "To turn a word problem's sentences into a math expression.", "mnemonic": null}}, "watchOut": "\"3 more than\" means add 3 (addition), but \"3 times as many\" means multiply by 3 — these sound similar but are completely different operations. The real test checks this constantly."}, "practicePool": [{"id": "Q0530", "stem": "Hamza read 6 books this month. Yusuf read 4 times as many books as Hamza. How many books did Yusuf read?", "choices": ["24", "10", "25", "4"], "correctIndex": 0, "explanations": ["Correct — '4 times as many' means multiply 6 by 4.", "This adds instead of multiplying.", "Off by one from the correct product.", "This gives just the factor, not the actual number of books."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0531", "stem": "Layla says: \"Take 11 and 9, add them together, then multiply the result by 5.\" Which expression matches what Layla said?", "choices": ["(11 + 9) × 5", "11 + 9 × 5", "11 × 5 + 9", "(11 × 9) + 5"], "correctIndex": 0, "explanations": ["Correct — the parentheses show the addition happens first, as described.", "This would multiply before adding, which changes the meaning.", "This doesn't add the two numbers together first.", "This multiplies instead of adding inside the parentheses."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0532", "stem": "Without calculating, which statement about 5 × (3 + 5) is true?", "choices": ["It is 5 times as large as (3 + 5).", "It is 3 times as large as (3 + 5).", "It is the same as 5 × 3 + 5.", "It is smaller than 3 + 5."], "correctIndex": 0, "explanations": ["Correct — multiplying an expression by a number scales the whole expression by that number.", "This uses the wrong factor from the expression.", "This misses that the parentheses group the addition together.", "Multiplying by a whole number greater than 1 makes it larger, not smaller (for positive values)."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0533", "stem": "Zainab read 6 books this month. Idris read 5 times as many books as Zainab. How many books did Idris read?", "choices": ["30", "11", "31", "5"], "correctIndex": 0, "explanations": ["Correct — '5 times as many' means multiply 6 by 5.", "This adds instead of multiplying.", "Off by one from the correct product.", "This gives just the factor, not the actual number of books."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0534", "stem": "Amina says: \"Take 4 and 5, add them together, then multiply the result by 5.\" Which expression matches what Amina said?", "choices": ["(4 + 5) × 5", "4 + 5 × 5", "4 × 5 + 5", "(4 × 5) + 5"], "correctIndex": 0, "explanations": ["Correct — the parentheses show the addition happens first, as described.", "This would multiply before adding, which changes the meaning.", "This doesn't add the two numbers together first.", "This multiplies instead of adding inside the parentheses."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0535", "stem": "Amina read 5 books this month. Tariq read 4 times as many books as Amina. How many books did Tariq read?", "choices": ["20", "9", "21", "4"], "correctIndex": 0, "explanations": ["Correct — '4 times as many' means multiply 5 by 4.", "This adds instead of multiplying.", "Off by one from the correct product.", "This gives just the factor, not the actual number of books."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0536", "stem": "Without calculating, which statement about 3 × (4 + 3) is true?", "choices": ["It is 3 times as large as (4 + 3).", "It is 4 times as large as (4 + 3).", "It is the same as 3 × 4 + 3.", "It is smaller than 4 + 3."], "correctIndex": 0, "explanations": ["Correct — multiplying an expression by a number scales the whole expression by that number.", "This uses the wrong factor from the expression.", "This misses that the parentheses group the addition together.", "Multiplying by a whole number greater than 1 makes it larger, not smaller (for positive values)."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0537", "stem": "Sumayyah read 9 books this month. Omar read 4 times as many books as Sumayyah. How many books did Omar read?", "choices": ["36", "13", "37", "4"], "correctIndex": 0, "explanations": ["Correct — '4 times as many' means multiply 9 by 4.", "This adds instead of multiplying.", "Off by one from the correct product.", "This gives just the factor, not the actual number of books."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0538", "stem": "Khalid read 6 books this month. Hamza read 2 times as many books as Khalid. How many books did Hamza read?", "choices": ["12", "8", "13", "2"], "correctIndex": 0, "explanations": ["Correct — '2 times as many' means multiply 6 by 2.", "This adds instead of multiplying.", "Off by one from the correct product.", "This gives just the factor, not the actual number of books."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0539", "stem": "Without calculating, which statement about 5 × (7 + 5) is true?", "choices": ["It is 5 times as large as (7 + 5).", "It is 7 times as large as (7 + 5).", "It is the same as 5 × 7 + 5.", "It is smaller than 7 + 5."], "correctIndex": 0, "explanations": ["Correct — multiplying an expression by a number scales the whole expression by that number.", "This uses the wrong factor from the expression.", "This misses that the parentheses group the addition together.", "Multiplying by a whole number greater than 1 makes it larger, not smaller (for positive values)."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0540", "stem": "Safiyyah read 8 books this month. Layla read 2 times as many books as Safiyyah. How many books did Layla read?", "choices": ["16", "10", "17", "2"], "correctIndex": 0, "explanations": ["Correct — '2 times as many' means multiply 8 by 2.", "This adds instead of multiplying.", "Off by one from the correct product.", "This gives just the factor, not the actual number of books."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0541", "stem": "Zainab says: \"Take 4 and 7, add them together, then multiply the result by 4.\" Which expression matches what Zainab said?", "choices": ["(4 + 7) × 4", "4 + 7 × 4", "4 × 4 + 7", "(4 × 7) + 4"], "correctIndex": 0, "explanations": ["Correct — the parentheses show the addition happens first, as described.", "This would multiply before adding, which changes the meaning.", "This doesn't add the two numbers together first.", "This multiplies instead of adding inside the parentheses."], "unit": "oa", "sub": "oa3", "iowaCat": "AlgebraicPatterns", "standard": "5.OA.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}]}, {"id": "nbt", "name": "Place Value, Multi-Digit Arithmetic & Decimals", "subunits": [{"id": "nbt1", "name": "Place Value, Rounding & Powers of Ten", "notes": {"title": "Place Value, Rounding & Powers of Ten", "hook": "Judy stacks ten tiny carrots into one giant carrot, then ten giant carrots into one mega-carrot: \"Every time you move one spot to the left, everything gets exactly 10 times bigger. That's the whole secret of place value!\"", "bullets": ["Moving a digit {b}one place to the left{b/} multiplies its value by 10; moving one place to the right divides its value by 10.", "In expanded form, every digit is written as (digit) × (its place value), and the parts are added together.", "To round a number, look at the digit {w}one place to the right{w/} of where you're rounding — 5 or more rounds up, less than 5 keeps it the same — then every digit after that becomes 0 (for whole numbers) or drops off (for decimals).", "Place value works exactly the same way for decimals as whole numbers — tenths, hundredths, and thousandths just keep dividing by 10 to the right of the decimal point."], "glossary": {"place value": {"def": "The value a digit has because of its position in a number, like the 5 in 5,000 being worth five thousand.", "mnemonic": null}, "expanded form": {"def": "Writing a number as the sum of each digit times its place value, e.g. 452 = 400 + 50 + 2.", "mnemonic": null}, "round": {"def": "To replace a number with a simpler approximate value.", "mnemonic": null}}, "watchOut": "\"Ten times\" and \"one tenth\" questions are opposites — always double check which direction you're moving before picking an answer; it's easy to move the wrong way under time pressure."}, "practicePool": [{"id": "Q0550", "stem": "What is 631,621 rounded to the nearest ten thousand?", "choices": ["630,000", "620,000", "640,000", "650,000"], "correctIndex": 0, "explanations": ["Correct rounding to that place value.", "Rounds to a neighboring value instead.", "Rounds to a neighboring value instead.", "Rounds to a neighboring value instead."], "unit": "nbt", "sub": "nbt1", "iowaCat": "NumberSense", "standard": "5.NBT.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0551", "stem": "In which number does the digit 7 represent a value that is ten times the value represented by the digit 7 in 324,776?", "choices": ["324,776", "456,756", "310,880", "327,776"], "correctIndex": 0, "explanations": ["Correct — moving the digit one place to the left multiplies its value by 10.", "This shifts the 7 to the wrong place value column.", "This shifts the 7 to the wrong place value column.", "This shifts the 7 to the wrong place value column."], "unit": "nbt", "sub": "nbt1", "iowaCat": "NumberSense", "standard": "5.NBT.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0552", "stem": "What is 385,038 rounded to the nearest hundred?", "choices": ["385,000", "385,200", "384,900", "385,100"], "correctIndex": 0, "explanations": ["Correct rounding to that place value.", "Rounds to a neighboring value instead.", "Rounds to a neighboring value instead.", "Rounds to a neighboring value instead."], "unit": "nbt", "sub": "nbt1", "iowaCat": "NumberSense", "standard": "5.NBT.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0553", "stem": "In which number does the digit 3 represent a value that is one tenth the value represented by the digit 3 in 613,737?", "choices": ["613,337", "401,856", "208,307", "633,737"], "correctIndex": 0, "explanations": ["Correct — moving one place to the right divides the value by 10.", "This puts the digit in the wrong column relative to the original number.", "This puts the digit in the wrong column relative to the original n  digit and turn every zero in between into a 9 (the very last one becomes 10) before subtracting.", "Example: 5,000 − 1,634 → borrow across all three zeros: 5,000 becomes 4 thousands, 9 hundreds, 9 tens, 10 ones → subtract normally from there.", "When multiplying, if a partial product is 10 or more, {w}you must carry the tens digit and ADD it{w/} to the next column's product — forgetting this carry is the single most common multiplication mistake at this grade.", "Always estimate first (round both numbers) so you can sanity-check whether your exact answer is in the right ballpark."], "glossary": {"regroup": {"def": "Trading one unit from a bigger place value for ten units of a smaller place value (or vice versa) — the modern word for 'borrowing' or 'carrying.'", "mnemonic": null}, "carry": {"def": "Moving a regrouped ten from one column into the next column during addition or multiplication.", "mnemonic": null}, "difference": {"def": "The answer to a subtraction problem.", "mnemonic": null}}, "watchOut": "Before subtracting across zeros, rewrite the top number showing every regrouped digit — doing it in your head is exactly where the borrow-across-zero mistake sneaks in."}, "practicePool": [{"id": "Q0570", "stem": "1,390 + 1,352 = ?", "choices": ["2,742", "2,472", "2,642", "2,752"], "correctIndex": 0, "explanations": ["Correct sum with regrouping carried into the next column.", "Digits got swapped in the final answer.", "This is short by not carrying a regrouped ten into the next column.", "Off by a small carrying slip."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0571", "stem": "6,380 + 5,304 = ?", "choices": ["11,684", "11,685", "11,584", "11,694"], "correctIndex": 0, "explanations": ["Correct sum with regrouping carried into the next column.", "Digits got swapped in the final answer.", "This is short by not carrying a regrouped ten into the next column.", "Off by a small carrying slip."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0572", "stem": "2,274 − 2,211 = ?", "choices": ["63", "36", "73", "83"], "correctIndex": 0, "explanations": ["Correct subtraction with regrouping where needed.", "This subtracts each column separately without regrouping.", "Digits got swapped when writing the final answer.", "Off by a small regrouping slip."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0573", "stem": "5,372 + 7,029 = ?", "choices": ["12,401", "21,401", "12,301", "12,411"], "correctIndex": 0, "explanations": ["Correct sum with regrouping carried into the next column.", "Digits got swapped in the final answer.", "This is short by not carrying a regrouped ten into the next column.", "Off by a small carrying slip."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0574", "stem": "32 × 5 = ?", "choices": ["160", "150", "165", "141"], "correctIndex": 0, "explanations": ["Correct — remember to add the carried ten when you multiply the next place value.", "This multiplies the ones digit correctly but forgets to add the carry when multiplying the tens digit.", "This is 10 less than the correct product — a common carrying slip.", "This is one extra group of the multiplier too many."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0575", "stem": "3,431 − 2,645 = ?", "choices": ["786", "1,214", "876", "796"], "correctIndex": 0, "explanations": ["Correct subtraction with regrouping where needed.", "This subtracts each column separately without regrouping.", "Digits got swapped when writing the fi st digit."], "unit": "nbt", "sub": "nbt3", "iowaCat": "Computation", "standard": "5.NBT.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0592", "stem": "51.95 + 28.74 = ?", "choices": ["80.69", "24.76", "79.69", "80.79"], "correctIndex": 0, "explanations": ["Correct — line up the decimal points, then add.", "This lines up digits from the left instead of the decimal point.", "This is 1 too low — check for a missed carry.", "Off by a small amount — recheck the hundredths column."], "unit": "nbt", "sub": "nbt3", "iowaCat": "Computation", "standard": "5.NBT.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0593", "stem": "22.44 − 17.51 = ?", "choices": ["4.93", "38.59", "5.93", "5.44"], "correctIndex": 0, "explanations": ["Correct — line up the decimal points first, then subtract.", "This lines up the digits from the left instead of lining up the decimal points.", "This is off by 1 — check the whole-number part.", "This only subtracts the whole-number parts and ignores the decimals."], "unit": "nbt", "sub": "nbt3", "iowaCat": "Computation", "standard": "5.NBT.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0594", "stem": "90.2 − 37.67 = ?", "choices": ["52.53", "7.43", "53.53", "53.20"], "correctIndex": 0, "explanations": ["Correct — line up the decimal points first, then subtract.", "This lines up the digits from the left instead of lining up the decimal points.", "This is off by 1 — check the whole-number part.", "This only subtracts the whole-number parts and ignores the decimals."], "unit": "nbt", "sub": "nbt3", "iowaCat": "Computation", "standard": "5.NBT.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0595", "stem": "2 × 3 = ?", "choices": ["6.0", "7.0", "5.9", "7.1"], "correctIndex": 0, "explanations": ["Correct — multiply, then place the decimal point using the total decimal places.", "This multiplies correctly but forgets to place the hole number too, which isn't correct.", "This forgets to multiply at all.", "Off by a small slip in the numerator."], "unit": "nf", "sub": "nf2", "iowaCat": "Computation", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0636", "stem": "3 × 1/2 = ?", "choices": ["3/2", "1/2", "2", "1"], "correctIndex": 0, "explanations": ["Correct — multiply the whole number only by the numerator; the denominator stays the same.", "This multiplies the denominator by the whole number too, which isn't correct.", "This forgets to multiply at all.", "Off by a small slip in the numerator."], "unit": "nf", "sub": "nf2", "iowaCat": "Computation", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0637", "stem": "2/4 × 1/5 = ?", "choices": ["1/10", "5/2", "1/3", "1/5"], "correctIndex": 0, "explanations": ["Correct — multiply numerator × numerator and denominator × denominator.", "This cross-multiplies instead of multiplying straight across.", "This adds the fractions instead of multiplying.", "Off by a small slip in the numerator."], "unit": "nf", "sub": "nf2", "iowaCat": "Computation", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0638", "stem": "9 × 2/6 = ?", "choices": ["3", "1/3", "4", "2"], "correctIndex": 0, "explanations": ["Correct — multiply the whole number only by the numerator; the denominator stays the same.", "This multiplies the denominator by the whole number too, which isn't correct.", "This forgets to multiply at all.", "Off by a small slip in the numerator."], "unit": "nf", "sub": "nf2", "iowaCat": "Computation", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0639", "stem": "4/6 × 5/6 = ?", "choices": ["5/9", "4/5", "3/4", "2/3"], "correctIndex": 0, "explanations": ["Correct — multiply numerator × numerator and denominator × denominator.", "This cross-multiplies instead of t everything to the smallest unit first, then add."], "glossary": {"convert": {"def": "To change a measurement from one unit to an equivalent measurement in a different unit.", "mnemonic": null}, "conversion factor": {"def": "The number that tells you how many of a small unit fit into a big unit, like 12 (inches per foot).", "mnemonic": null}}, "watchOut": "Going small-to-big means the number should get SMALLER (fewer big units needed) — if your converted answer got bigger, you multiplied when you should have divided."}, "practicePool": [{"id": "Q0676", "stem": "8 gallons = how many quarts?", "choices": ["32", "12", "2", "28"], "correctIndex": 0, "explanations": ["Correct — multiply by 4 since there are 4 quarts in 1 gallons.", "This adds instead of multiplying.", "This divides instead of multiplying — that goes the wrong direction.", "Off by one group of 4."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0677", "stem": "12 feet = how many yards?", "choices": ["4", "12", "36", "7"], "correctIndex": 0, "explanations": ["Correct — divide by 3 since there are 3 feet in 1 yards.", "This restates the number of feet instead of converting.", "This multiplies instead of dividing — that goes the wrong direction.", "Off by one group of 3."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0678", "stem": "12 gallons = how many quarts?", "choices": ["48", "16", "3", "44"], "correctIndex": 0, "explanations": ["Correct — multiply by 4 since there are 4 quarts in 1 gallons.", "This adds instead of multiplying.", "This divides instead of multiplying — that goes the wrong direction.", "Off by one group of 4."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0679", "stem": "3 kilometers = how many meters?", "choices": ["3000", "1003", "3", "2000"], "correctIndex": 0, "explanations": ["Correct — multiply by 1000 since there are 1000 meters in 1 kilometers.", "This adds instead of multiplying.", "This divides instead of multiplying — that goes the wrong direction.", "Off by one group of 1000."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0680", "stem": "84 inches = how many feet?", "choices": ["7", "84", "1008", "19"], "correctIndex": 0, "explanations": ["Correct — divide by 12 since there are 12 inches in 1 feet.", "This restates the number of inches instead of converting.", "This multiplies instead of dividing — that goes the wrong direction.", "Off by one group of 12."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0681", "stem": "11 pints = how many cups?", "choices": ["22", "13", "5", "20"], "correctIndex": 0, "explanations": ["Correct — multiply by 2 since there are 2 cups in 1 pints.", "This adds instead of multiplying.", "This divides instead of multiplying — that goes the wrong direction.", "Off by one group of 2."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0682", "stem": "300 minutes = how many hours?", "choices": ["5", "300", "18000", "65"], "correctIndex": 0, "explanations": ["Correct — divide by 60 since there are 60 minutes in 1 hours.", "This restates the number of minutes instead of converting.", "This multiplies instead of dividing — that goes the wrong direction.", "Off by one group of 60."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0683", "stem": "10 cups = how many pints?", "choic x": 0, "explanations": ["Correct — divide by 16 since there are 16 ounces in 1 pounds.", "This restates the number of ounces instead of converting.", "This multiplies instead of dividing — that goes the wrong direction.", "Off by one group of 16."], "unit": "md", "sub": "md1", "iowaCat": "Measurement", "standard": "5.MD.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "md2", "name": "Volume of Rectangular Prisms", "notes": {"title": "Volume of Rectangular Prisms", "hook": "Judy stacks cube-shaped carrot treats into a box: \"Volume just means: how many little cubes fit inside? Length tells you one direction, width another, height the third — multiply all three and you're done.\"", "bullets": ["Volume of a rectangular prism = {b}length × width × height{b/}, measured in cubic units (like cubic feet or cubic inches).", "If you're told the volume and two of the three dimensions, find the missing dimension by dividing the volume by the product of the two known dimensions.", "{w}Don't confuse volume with surface area{w/} — surface area adds up the area of all the faces; volume multiplies the three dimensions together.", "For a figure made of two prisms stuck together, find each prism's volume separately, then add the two volumes together."], "glossary": {"volume": {"def": "The amount of space inside a 3-D figure, measured in cubic units.", "mnemonic": null}, "cubic unit": {"def": "A cube-shaped unit (like a cubic inch) used to measure volume.", "mnemonic": null}, "rectangular prism": {"def": "A 3-D box shape with six rectangular faces.", "mnemonic": null}}, "watchOut": "Always double-check your units — volume is always measured in CUBIC units (like cubic feet), never plain feet."}, "practicePool": [{"id": "Q0706", "stem": "A student builds a rectangular box out of 1-inch unit cubes: 4 cubes long, 3 cubes wide, and 4 cubes tall. What is the volume of the box, in cubic inches?", "choices": ["48", "16", "11", "52"], "correctIndex": 0, "explanations": ["Correct — count the total unit cubes: length × width × height.", "This only accounts for one layer, not the full height.", "This adds the dimensions instead of multiplying them.", "This overcounts by one row of cubes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0707", "stem": "A right rectangular prism has a length of 6 feet, a width of 7 feet, and a height of 4 feet. What is its volume, in cubic feet?", "choices": ["168", "46", "17", "188"], "correctIndex": 0, "explanations": ["Correct — Volume = length × width × height.", "This multiplies only two dimensions and adds the third.", "This adds all three dimensions instead of multiplying.", "This calculates surface area instead of volume."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0708", "stem": "A right rectangular prism has a length of 2 feet, a width of 4 feet, and a height of 3 feet. What is its volume, in cubic feet?", "choices": ["24", "11", "9", "52"], "correctIndex": 0, "explanations": ["Correct — Volume = length × width × height.", "This multiplies only two dimensions and adds the third.", "This adds all three dimensions instead of multiplying.", "This calculates surface area instead of volume."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0709", "stem": "A figure is made of two rectangular prisms stacked together. The first prism is 4 by 3 by 2 inches. The second prism is 4 by 3 by 4 inches. What is the total volume of the figure, in cubic inches?", "choices": ["72", "24", "48", "73"], "correctIndex": 0, "explanations": ["Correct — find each prism's volume separately, then add them together.", "This only counts the first prism.", "This only counts the second prism.", "This subtracts instead of adding the two volumes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0710", "stem": "A right rectangular prism has a length of 7 feet, a width of 4 feet, and a height of 9 feet. What is its volume, in cubic feet?", "choices": ["252", "37", "20", "254"], "correctIndex": 0, "explanations": ["Correct — Volume = length × width × height.", "This multiplies only two dimensions and adds the third.", "This adds all three dimensions instead of multiplying.", "This calculates surface area instead of volume."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0711", "stem": "A right rectangular prism has a length of 4 feet, a width of 6 feet, and a height of 5 feet. What is its volume, in cubic feet?", "choices": ["120", "29", "15", "148"], "correctIndex": 0, "explanations": ["Correct — Volume = length × width × height.", "This multiplies only two dimensions and adds the third.", "This adds all three dimensions instead of multiplying.", "This calculates surface area instead of volume."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0712", "stem": "A student builds a rectangular box out of 1-inch unit cubes: 2 cubes long, 5 cubes wide, and 3 cubes tall. What is the volume of the box, in cubic inches?", "choices": ["30", "13", "10", "32"], "correctIndex": 0, "explanations": ["Correct — count the total unit cubes: length × width × height.", "This only accounts for one layer, not the full height.", "This adds the dimensions instead of multiplying them.", "This overcounts by one row of cubes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0713", "stem": "A figure is made of two rectangular prisms stacked together. The first prism is 6 by 5 by 2 inches. The second prism is 3 by 5 by 3 inches. What is the total volume of the figure, in cubic inches?", "choices": ["105", "60", "45", "15"], "correctIndex": 0, "explanations": ["Correct — find each prism's volume separately, then add them together.", "This only counts the first prism.", "This only counts the second prism.", "This subtracts instead of adding the two volumes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0714", "stem": "A student builds a rectangular box out of 1-inch unit cubes: 3 cubes long, 3 cubes wide, and 4 cubes tall. What is the volume of the box, in cubic inches?", "choices": ["36", "13", "10", "39"], "correctIndex": 0, "explanations": ["Correct — count the total unit cubes: length × width × height.", "This only accounts for one layer, not the full height.", "This adds the dimensions instead of multiplying them.", "This overcounts by one row of cubes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0715", "stem": "A right rectangular prism has a length of 12 feet, a width of 9 feet, and a height of 7 feet. What is its volume, in cubic feet?", "choices": ["756", "115", "28", "510"], "correctIndex": 0, "explanations": ["Correct — Volume = length × width × height.", "This multiplies only two dimensions and adds the third.", "This adds all three dimensions instead of multiplying.", "This calculates surface area instead of volume."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0716", "stem": "A figure is made of two rectangular prisms stacked together. The first prism is 2 by 3 by 3 inches. The second prism is 6 by 5 by 2 inches. What is the total volume of the figure, in cubic inches?", "choices": ["78", "18", "60", "42"], "correctIndex": 0, "explanations": ["Correct — find each prism's volume separately, then add them together.", "This only counts the first prism.", "This only counts the second prism.", "This subtracts instead of adding the two volumes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0717", "stem": "A right rectangular prism has a volume of 245 cubic inches. Its length is 7 inches and its width is 7 inches. What is its height, in inches?", "choices": ["5", "196", "35", "12"], "correctIndex": 0, "explanations": ["Correct — divide the volume by (length × width) to find the missing height.", "This subtracts instead of dividing.", "This divides by only one dimension instead of both.", "This adds instead of dividing."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "md3", "name": "Line Plots & Data with Fractions", "notes": {"title": "Line Plots & Data with Fractions", "hook": "Judy points at a row of X's stacked above a number line: \"Each X on a line plot is one real measurement — like one bag of trail mix. Taller stacks mean more bags weighed that exact amount.\"", "bullets": ["A line plot shows data above a number line — the {b}number of X's{b/} stacked above a value tells how many data points had that exact value.", "To find a total from a line plot, add up every individual data point shown (not just the labels) — a value with 3 X's above it gets counted 3 times.", "The tallest stack of X's shows the {w}most common{w/} value — but don't confuse 'most common value' with 'largest value' on the number line.", "Fractional line plots (in halves, fourths, or eighths) work exactly the same way as whole-number line plots — just add the fractions using a common denominator."], "glossary": {"line plot": {"def": "A graph that shows data as marks (usually X's) above a number line.", "mnemonic": null}, "data point": {"def": "One single piece of collected information, like the weight of one bag.", "mnemonic": null}}, "watchOut": "When a value has more than one X above it, you must count it that many times when adding — it's easy to accidentally add it only once."}, "practicePool": [{"id": "Q0726", "stem": "A line plot shows the weights of several bags of trail mix: 2 bag(s) weighing 2/8 lb, 1 bag(s) weighing 6/8 lb, 1 bag(s) weighing 8/8 lb. What is the total weight, in pounds, of all the bags?", "choices": ["9/4", "19/8", "17/8", "1/2"], "correctIndex": 0, "explanations": ["Correct — add every bag's weight shown on the line plot.", "This is off by one bag's weight.", "This is off in the other direction by one bag's weight.", "This just counts the number of bags instead of adding their weights."], "unit": "md", "sub": "md3", "iowaCat": "DataAnalysis", "standard": "5.MD.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0727", "stem": "A line plot shows the weights of several bags of trail mix: 1 bag(s) weighing 2/8 lb, 1 bag(s) weighing 3/8 lb, 1 bag(s) weighing 6/8 lb, 1 bag(s) weighing 7/8 lb, 1 bag(s) weighing 8/8 lb. What is the total weight, in pounds, of all the bags?", "choices": ["13/4", "27/8", "25/8", "5/8"], "correctIndex": 0, "explanations": ["Correct — add every bag's weight shown on the line plot.", "This is off by one bag's weight.", "This is off in the other direction by one bag's weight.", "This just counts the number of bags instead of adding their weights."], "unit": "md", "sub": "md3", "iowaCat": "DataAnalysis", "standard": "5.MD.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "Q0728", "stem": "A line plot shows how long students read: 1 student read for 1/4 hour(s), 2 students read for 1/2 hour(s), 4 students read for 3/4 hour(s), 2 stud rd Problems", "notes": {"title": "Geometry & Coordinate Word Problems", "hook": "Judy grabs a tape measure and a tiny map: \"Now let's put it all together — shapes, grids, and real-world questions like fences and gardens, all in one place.\"", "bullets": ["{b}Area{b/} (length × width) tells you how much surface something covers, like grass inside a garden; {b}perimeter{b/} (2 × (length + width)) tells you the distance all the way around, like fencing.", "On a map or grid, treat each square as one unit — count grid squares (or subtract coordinates) to find distances between two points.", "{w}Area and perimeter use different formulas and different units{w/} (square units vs. plain units) — always check which one a word problem is actually asking for.", "Draw a quick sketch for any geometry word problem — labeling the given measurements on a picture makes the right formula much easier to spot."], "glossary": {"area": {"def": "The amount of flat surface inside a 2-D shape, measured in square units.", "mnemonic": null}, "perimeter": {"def": "The total distance around the outside of a shape.", "mnemonic": "PeRIMeter = the RIM (edge) all the way around."}}, "watchOut": "A word problem about a fence, border, or frame is almost always asking for PERIMETER; a word problem about covering, painting, or planting is almost always asking for AREA."}, "practicePool": [{"id": "Q0826", "stem": "Hamza's rectangular yard is 11 meters long and 18 meters wide. Hamza wants to put a fence around the entire yard. How many meters of fencing are needed?", "choices": ["58", "198", "29", "22"], "correctIndex": 0, "explanations": ["Correct — Perimeter = 2 × (length + width), the distance all the way around.", "This calculates area instead of perimeter.", "This only adds one length and one width instead of two of each.", "This only accounts for two of the four sides."], "unit": "g", "sub": "g3", "iowaCat": "Geometry", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem /* ============================================================
   STORAGE & STATE
   Namespaced under shareefah:math:* (personal, not shared).
   ============================================================ */
const STORE_KEY = "shareefah:math:state";

function defaultState() {
  const perQuestion = {};
  return {
    version: 3,
    settings: { theme: "light", muted: false },
    perQuestion: perQuestion,     // id -> {streak, durable, lastCorrectDay, history:[{ts,correct,confident,day}], wrongChoiceCounts:{idx:count}}
    learned: {},                  // subId -> true (notes screen viewed)
    dayStreak: { current: 0, best: 0, lastActiveDay: null },
    heatmap: {},                  // "YYYY-MM-DD" -> count of attempts that day
    examAttempts: { exam1: null, exam2: null, exam3: null }, // each: {date, scorePart1, scorePart2, total, missedIds:[], predicted, subScores:{subId:{correct,total}}}
    manualFlags: {},              // id -> true (student manually flagged "review this")
    knownWeakSpotsSeeded: false,
    lastRoute: null,
  };
}

let STATE = null;

async function loadState() {
  try {
    const res = await window.storage.get(STORE_KEY, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      STATE = Object.assign(defaultState(), parsed);
      STATE.perQuestion = Object.assign({}, parsed.perQuestion || {});
    } else {
      STATE = defaultState();
    }
  } catch (e) {
    STATE = defaultState();
  }
  seedKnownWeakSpots();
  return STATE;
}

let _saveTimer = null;
function saveState() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      await window.storage.set(STORE_KEY, JSON.stringify(STATE), false);
    } catch (e) {
      console.error("Save failed", e);
    }
  }, 300);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function seedKnownWeakSpots() {
  if (STATE.knownWeakSpotsSeeded) return;
  // Pre-seed her real diagnostic weak spots as manual flags so the Review
  // List / Misconception Clinic surface them from the very first session.
  (STUDY_DATA.knownWeakSpots || []).forEach(spot => {
    STATE.manualFlags["__weakspot__" + spot.tag] = { label: spot.label, sub: spot.sub, seeded: true };
  });
  STATE.knownWeakSpotsSeeded = true;
  saveState();
}

function touchDayStreak() {
  const today = todayStr();
  STATE.heatmap[today] = (STATE.heatmap[today] || 0) + 1;
  if (STATE.dayStreak.lastActiveDay === today) { saveState(); return; }
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
  if (STATE.dayStreak.lastActiveDay === yesterday) {
    STATE.dayStreak.current += 1;
  } else {
    STATE.dayStreak.current = 1;
  }
  STATE.dayStreak.best = Math.max(STATE.dayStreak.best, STATE.dayStreak.current);
  STATE.dayStreak.lastActiveDay = today;
  saveState();
}
/* ============================================================
   MASTERY ENGINE
   Clearing rule: 2 confident-correct in a row (any wrong, or any
   unsure-correct, resets the streak). Durable mastery additionally
   requires the two clearing answers to land on different calendar days.
   Mistake tiers checked in priority order: recurring -> slipped ->
   confident-miss -> new-gap (checking "previously solid" BEFORE
   confidence is the fix for the classic misclassification bug).
   ============================================================ */

function getRecord(id) {
  if (!STATE.perQuestion[id]) {
    STATE.perQuestion[id] = {
      history: [], streak: 0, clearDaysLog: [], cleared: false, durable: false,
      everCleared: false, everUnsure: false, wrongChoiceCounts: {}
    };
  }
  return STATE.perQuestion[id];
}

// Returns { tier, correct } where tier is one of
// 'recurring' | 'slipped' | 'confident-miss' | 'new-gap' | null (null if correct)
function recordAttempt(id, { correct, confident, chosenIndex }) {
  const rec = getRecord(id);
  const day = todayStr();
  const wasEverCleared = rec.everCleared;

  let tier = null;
  if (!correct) {
    rec.wrongChoiceCounts[chosenIndex] = (rec.wrongChoiceCounts[chosenIndex] || 0) + 1;
    if (rec.wrongChoiceCounts[chosenIndex] >= 2) tier = "recurring";
    else if (wasEverCleared) tier = "slipped";
    else if (confident) tier = "confident-miss";
    else tier = "new-gap";
  }

  if (!confident) rec.everUnsure = true;

  if (correct && confident) {
    rec.streak += 1;
    rec.clearDaysLog.push(day);
  } else {
    rec.streak = 0;
    rec.clearDaysLog = [];
  }

  rec.cleared = rec.streak >= 2;
  if (rec.cleared) {
    rec.everCleared = true;
    const lastTwo = rec.clearDaysLog.slice(-2);
    rec.durable = lastTwo.length === 2 && lastTwo[0] !== lastTwo[1];
  } else {
    rec.durable = false;
  }

  rec.history.push({ ts: Date.now(), day, correct, confident, chosenIndex });
  if (rec.history.length > 30) rec.history = rec.history.slice(-30); // cap growth

  touchDayStreak();
  saveState();
  return { tier, correct };
}

// Most-recent-attempt-only weight: confident-correct=1.0, unsure-correct=0.5, else 0
function questionWeight(id) {
  const rec = STATE.perQuestion[id];
  if (!rec || rec.history.length === 0) return 0;
  const last = rec.history[rec.history.length - 1];
  if (!last.correct) return 0;
  return last.confident ? 1.0 : 0.5;
}

function isAttempted(id) {
  const rec = STATE.perQuestion[id];
  return !!(rec && rec.history.length > 0);
}

// Weighted combined mastery across a set of item ids: sum(weights)/count
function masteryForIds(ids) {
  if (!ids.length) return 0;
  const sum = ids.reduce((s, id) => s + questionWeight(id), 0);
  return sum / ids.length;
}

function inReviewList(id) {
  const rec = STATE.perQuestion[id];
  if (!rec || rec.history.length === 0) return false; // unattempted items aren't "review" yet, they're just new
  if (!rec.cleared) return true;
  if (rec.everUnsure) return true;
  if (STATE.manualFlags[id]) return true;
  return false;
}

function dueScore(id) {
  const rec = STATE.perQuestion[id];
  if (!rec) return 0;
  const last = rec.history[rec.history.length - 1];
  const daysSince = last ? Math.floor((Date.now() - last.ts) / 86400000) : 99;
  let score = (2 - rec.streak) * 10 + Math.min(daysSince, 14);
  if (rec.everUnsure) score += 5;
  if (STATE.manualFlags[id]) score += 8;
  return score;
}

// All items in the whole bank, flattened, with sub-unit context attached.
function allBankItems() {
  const out = [];
  STUDY_DATA.units.forEach(u => {
    u.subunits.forEach(su => {
      su.practicePool.forEach(it => out.push(it));
    });
  });
  Object.values(STUDY_DATA.exams).forEach(exam => {
    exam.part1.concat(exam.part2).forEach(it => out.push(it));
  });
  return out;
}

let _itemIndex = null;
function itemById(id) {
  if (!_itemIndex) {
    _itemIndex = {};
    allBankItems().forEach(it => { _itemIndex[it.id] = it; });
  }
  return _itemIndex[id];
}

function subUnitMeta(subId) {
  for (const u of STUDY_DATA.units) {
    for (const su of u.subunits) {
      if (su.id === subId) return { unit: u, sub: su };
    }
  }
  return null;
}

// Misconception Clinic: questions with a recurring (2+) wrong choice,
// most-repeated first, capped to top 3.
function misconceptionClinicData() {
  const out = [];
  Object.keys(STATE.perQuestion).forEach(id => {
    const rec = STATE.perQuestion[id];
    const entries = Object.entries(rec.wrongChoiceCounts || {}).filter(([idx, c]) => c >= 2);
    if (entries.length === 0) return;
    entries.sort((a, b) => b[1] - a[1]);
    const [idxStr, count] = entries[0];
    const item = itemById(id);
    if (!item) return;
    out.push({ item, chosenIndex: parseInt(idxStr, 10), count });
  });
  out.sort((a, b) => b.count - a.count);
  return out.slice(0, 3);
}

function reviewListGrouped() {
  const groups = {};
  allBankItems().forEach(it => {
    if (inReviewList(it.id)) {
      groups[it.sub] = groups[it.sub] || [];
      groups[it.sub].push(it);
    }
  });
  return groups;
}

function subUnitMasteryPct(subId) {
  const su = subUnitMeta(subId).sub;
  const ids = su.practicePool.map(it => it.id);
  return masteryForIds(ids);
}

function unitMasteryPct(unitId) {
  const u = STUDY_DATA.units.find(x => x.id === unitId);
  let ids = [];
  u.subunits.forEach(su => { ids = ids.concat(su.practicePool.map(it => it.id)); });
  return masteryForIds(ids);
}

function weakestSubunit() {
  let weakest = null, weakestPct = 2;
  STUDY_DATA.units.forEach(u => u.subunits.forEach(su => {
    const pct = subUnitMasteryPct(su.id);
    if (pct < weakestPct) { weakestPct = pct; weakest = su.id; }
  }));
  return weakest;
}

/* ============================================================
   DIAGRAMS -- hand-authored inline SVG, parameterized, theme-aware
   ============================================================ */
function svgNumberLine(min, max, points) {
  // points: [{value, label, color}]
  const W = 320, H = 90, pad = 24;
  const scale = v => pad + ((v - min) / (max - min)) * (W - pad*2);
  let marks = "";
  for (let v = min; v <= max; v++) {
    const x = scale(v);
    marks += `<line x1="${x}" y1="40" x2="${x}" y2="48" stroke="var(--text-soft)" stroke-width="1.5"/>`;
    marks += `<text x="${x}" y="62" font-size="10" text-anchor="middle" fill="var(--text-soft)">${v}</text>`;
  }
  let dots = "";
  (points||[]).forEach(p => {
    const x = scale(p.value);
    dots += `<circle cx="${x}" cy="40" r="6" fill="${p.color||'var(--coral)'}" stroke="var(--card)" stroke-width="2"/>`;
    if (p.label) dots += `<text x="${x}" y="26" font-size="11" text-anchor="middle" fill="var(--text)" font-weight="700">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram"><line x1="${pad}" y1="40" x2="${W-pad}" y2="40" stroke="var(--text-soft)" stroke-width="2"/>${marks}${dots}</svg>`;
}

function svgFractionBar(numerator, denominator, colorFilled) {
  const W = 280, H = 60, x0 = 10, w = W - 20;
  const seg = w / denominator;
  let rects = "";
  for (let i = 0; i < denominator; i++) {
    const filled = i < numerator;
    rects += `<rect x="${x0 + i*seg}" y="10" width="${seg}" height="40" fill="${filled ? (colorFilled||'var(--coral)') : 'var(--cream-card)'}" stroke="var(--border)" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">${rects}</svg>`;
}

function svgRectangularPrism(l, w, h) {
  // simple isometric-style box, labeled -- schematic, not to scale
  const W = 260, H = 180;
  const ox = 60, oy = 130, sx = 10 + Math.min(l*6, 90), sy = 10 + Math.min(w*4, 50), sz = 10 + Math.min(h*7, 90);
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">
    <polygon points="${ox},${oy} ${ox+sx},${oy} ${ox+sx},${oy-sz} ${ox},${oy-sz}" fill="var(--cream-card)" stroke="var(--text)" stroke-width="2"/>
    <polygon points="${ox},${oy} ${ox+sy*0.6},${oy-sy*0.5} ${ox+sy*0.6},${oy-sy*0.5-sz} ${ox},${oy-sz}" fill="var(--sage)" stroke="var(--text)" stroke-width="2"/>
    <polygon points="${ox},${oy-sz} ${ox+sy*0.6},${oy-sy*0.5-sz} ${ox+sx+sy*0.6},${oy-sy*0.5-sz} ${ox+sx},${oy-sz}" fill="var(--border)" stroke="var(--text)" stroke-width="2"/>
    <text x="${ox+sx/2}" y="${oy+16}" font-size="11" text-anchor="middle" fill="var(--text-soft)">length ${l}</text>
    <text x="${ox-30}" y="${oy-sz/2}" font-size="11" text-anchor="middle" fill="var(--text-soft)">height ${h}</text>
    <text x="${ox+sx+sy*0.3}" y="${oy-sy*0.5-sz-8}" font-size="11" text-anchor="middle" fill="var(--text-soft)">width ${w}</text>
    <text x="${W/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--text-soft)" font-style="italic">schematic, not to scale</text>
  </svg>`;
}

function svgCoordinateGrid(points, maxAxis) {
  const W = 260, H = 260, pad = 20, n = maxAxis || 10;
  const step = (W - pad*2) / n;
  const toX = x => pad + x*step;
  const toY = y => H - pad - y*step;
  let grid = "";
  for (let i = 0; i <= n; i++) {
    grid += `<line x1="${toX(i)}" y1="${pad}" x2="${toX(i)}" y2="${H-pad}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<line x1="${pad}" y1="${toY(i)}" x2="${W-pad}" y2="${toY(i)}" stroke="var(--border)" stroke-width="1"/>`;
  }
  let dots = "";
  (points||[]).forEach(p => {
    dots += `<circle cx="${toX(p.x)}" cy="${toY(p.y)}" r="6" fill="var(--coral)" stroke="var(--card)" stroke-width="2"/>`;
    dots += `<text x="${toX(p.x)+9}" y="${toY(p.y)-6}" font-size="11" fill="var(--text)" font-weight="700">(${p.x}, ${p.y})</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--text)" stroke-width="2"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--text)" stroke-width="2"/>
    ${grid}${dots}
  </svg>`;
}

function svgBarChart(dataObj, unitLabel) {
  const entries = Object.entries(dataObj);
  const W = 300, H = 160, pad = 30;
  const maxV = Math.max(...entries.map(e => e[1]), 1);
  const barW = (W - pad*2) / entries.length - 8;
  let bars = "";
  entries.forEach(([label, val], i) => {
    const h = (val / maxV) * (H - pad*2);
    const x = pad + i*((W-pad*2)/entries.length) + 4;
    const y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="var(--coral)" rx="3"/>`;
    bars += `<text x="${x+barW/2}" y="${H-pad+14}" font-size="9" text-anchor="middle" fill="var(--text-soft)">${label}</text>`;
    bars += `<text x="${x+barW/2}" y="${y-4}" font-size="10" text-anchor="middle" fill="var(--text)" font-weight="700">${val}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--text)" stroke-width="2"/>
    ${bars}
  </svg>`;
}
/* ============================================================
   RENDER UTILITIES
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Parses {b}...{b/} / {b}...{/b} as bold-accent, {w}...{w/} / {w}...{/w} as
// highlighted trap/exception. Tolerant of either closing-tag spelling since
// the authored notes used both conventions.
function parseNoteMarkup(raw) {
  let s = escapeHtml(raw);
  s = s.replace(/\{b\}(.*?)\{\/?b\/?\}/gs, '<span class="note-bold">$1</span>');
  s = s.replace(/\{w\}(.*?)\{\/?w\/?\}/gs, '<span class="note-highlight">$1</span>');
  return s;
}

// Auto-link glossary terms (longest-first so multi-word terms match before
// their substrings) wherever they appear in bullet/hook text. Embeds the
// definition/mnemonic directly as data attributes so the popup needs no
// separate lookup step.
function autoLinkGlossary(html, glossary) {
  const terms = Object.keys(glossary || {}).sort((a,b) => b.length - a.length);
  terms.forEach(term => {
    const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?<![\\w-])(' + safe + ')(?![\\w-])', 'gi');
    const g = glossary[term];
    const defAttr = escapeHtml(g.def);
    const mnemonicAttr = escapeHtml(g.mnemonic || "");
    html = html.replace(re, (m) => `<span class="glossary-term" data-action="glossary" data-term="${escapeHtml(term)}" data-def="${defAttr}" data-mnemonic="${mnemonicAttr}">${m}</span>`);
  });
  return html;
}

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Renders a shuffled 4-choice list. `revealState` (optional): when set,
// shows correct/incorrect coloring for the given authoredSelectedIndex.
function renderChoices(item, opts) {
  opts = opts || {};
  const order = opts.displayOrder || fisherYates([0,1,2,3]);
  const letters = ["A","B","C","D"];
  let html = `<div class="choice-list" data-display-order="${order.join(',')}">`;
  order.forEach((authoredIdx, pos) => {
    let cls = "choice-btn";
    if (opts.revealed) {
      if (authoredIdx === item.correctIndex) cls += " correct";
      else if (authoredIdx === opts.selectedAuthoredIndex) cls += " incorrect";
    } else if (authoredIdx === opts.selectedAuthoredIndex) {
      cls += " selected";
    }
    const disabled = opts.revealed ? "disabled" : "";
    html += `<button class="${cls}" ${disabled} data-action="${opts.action||'choose'}" data-authored-index="${authoredIdx}">
      <span class="choice-letter">${letters[pos]}</span><span>${escapeHtml(item.choices[authoredIdx])}</span>
    </button>`;
  });
  html += `</div>`;
  return html;
}

function iowaCatPillClass(cat) {
  return { NumberSense: "pill-sense", Computation: "pill-comp", AlgebraicPatterns: "pill-alg",
            Geometry: "pill-geo", Measurement: "pill-meas", DataAnalysis: "pill-data" }[cat] || "pill-sense";
}
function iowaCatLabel(cat) {
  return { NumberSense: "Number Sense", Computation: "Computation", AlgebraicPatterns: "Algebraic Patterns",
            Geometry: "Geometry", Measurement: "Measurement", DataAnalysis: "Data Analysis" }[cat] || cat;
}

function fmtPct(x) { return Math.round(x * 100) + "%"; }

function fmtTime(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return m + ":" + String(s).padStart(2, "0");
}

// A light-touch diagram picker for items that clearly benefit from one,
// based on the sub-unit and a couple of stem keywords. Kept conservative --
// most items show no diagram at all.
function diagramForItem(item) {
  if (item.sub === "g2") {
    const m = item.stem.match(/\((\d+),\s*(\d+)\)/);
    if (m) return svgCoordinateGrid([{x: parseInt(m[1]), y: parseInt(m[2])}], 10);
  }
  if (item.sub === "md2" && /prism/i.test(item.stem)) {
    const m = item.stem.match(/length of (\d+).*width of (\d+).*height of (\d+)/is);
    if (m) return svgRectangularPrism(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
  }
  if (item.sub === "nf1" || item.sub === "nf2") {
    const m = item.stem.match(/^(\d+)\/(\d+)/);
    if (m && parseInt(m[2]) <= 12) return svgFractionBar(parseInt(m[1]), parseInt(m[2]));
  }
  return null;
}
