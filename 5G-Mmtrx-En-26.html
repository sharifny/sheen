<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Judy's Iowa ELA Test — Shareefah</title>
<style>
  :root{
    --bg:#FBF6EC;
    --panel:#FFFFFF;
    --ink:#2E2A25;
    --sub:#6b6255;
    --teal:#0d6e6e;
    --teal-dark:#095151;
    --gold:#c9972c;
    --maroon:#7a2e3a;
    --green:#2f7d4f;
    --red:#b23a3a;
    --border:#e7ddc9;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    padding-bottom:40px;
  }
  #app{max-width:760px;margin:0 auto;padding:16px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(60,50,20,0.06);
  }
  .bismillah{
    text-align:center;
    font-size:1.5em;
    color:var(--teal-dark);
    margin:6px 0 2px;
  }
  .bismillah-en{
    text-align:center;
    color:var(--sub);
    font-size:0.85em;
    margin-bottom:14px;
  }
  h1{font-size:1.4em;margin:0 0 6px;color:var(--teal-dark);}
  h2{font-size:1.15em;margin:0 0 10px;color:var(--teal-dark);}
  h3{font-size:1.05em;margin:0 0 8px;color:var(--maroon);}
  p{margin:0 0 12px;}
  .muted{color:var(--sub);font-size:0.92em;}
  .center{text-align:center;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  .btn{
    display:inline-block;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:12px 22px;
    font-size:1em;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
  }
  .btn:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal-dark);border:2px solid var(--teal);}
  .btn.secondary:hover{background:#eef7f7;}
  .btn.gold{background:var(--gold);color:#3a2a06;}
  .btn.gold:hover{background:#b3861f;}
  .btn.danger{background:#fff;color:var(--red);border:2px solid var(--red);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn.block{display:block;width:100%;}
  .judy-wrap{display:flex;justify-content:center;margin:6px 0 10px;}
  .judy{width:96px;height:110px;}
  .judy-earL,.judy-earR{transform-box:fill-box;transform-origin:50% 100%;}
  .judy-earL{animation:earL 4.2s ease-in-out infinite;}
  .judy-earR{animation:earR 4.2s ease-in-out infinite 0.4s;}
  @keyframes earL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-6deg);}}
  @keyframes earR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(6deg);}}
  .judy-body{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  .progress-outer{background:#eee3c9;border-radius:999px;height:12px;overflow:hidden;margin:8px 0;}
  .progress-inner{background:var(--teal);height:100%;border-radius:999px;transition:width 0.3s ease;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .stat-box{background:#f7f1e0;border-radius:12px;padding:10px 14px;text-align:center;}
  .stat-box .num{font-size:1.4em;font-weight:700;color:var(--teal-dark);}
  .stat-box .lbl{font-size:0.8em;color:var(--sub);}
  header.testbar{
    position:sticky;top:0;z-index:10;
    background:var(--teal-dark);color:#fff;
    padding:10px 14px;border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header.testbar .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  header.testbar .titleline{font-weight:700;font-size:0.95em;}
  header.testbar .subline{font-size:0.78em;opacity:0.85;}
  header.testbar .progress-outer{background:rgba(255,255,255,0.25);}
  header.testbar .progress-inner{background:var(--gold);}
  .savebtn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.5);
    color:#fff;border-radius:999px;padding:6px 12px;font-size:0.8em;cursor:pointer;
  }
  .savebtn:hover{background:rgba(255,255,255,0.28);}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#2f7d4f;color:#fff;padding:10px 18px;border-radius:999px;
    font-size:0.9em;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:50;
    opacity:0;transition:opacity 0.3s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .banner{
    border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:0.92em;
  }
  .banner.warn{background:#fbeadb;border:1px solid #e8b978;color:#7a4a10;}
  .banner.reminder{background:#eaf3f4;border:1px solid #9fcfcf;color:var(--teal-dark);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .passage-img{max-width:100%;border-radius:10px;display:block;margin:10px auto;border:1px solid var(--border);}
  details.intro{background:#faf5e8;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
  details.intro summary{cursor:pointer;font-weight:600;color:var(--maroon);}
  details.intro .passage-text p{margin:0 0 10px;}
  table.data-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:0.85em;}
  table.data-table th,table.data-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;}
  table.data-table th{background:#f2ead4;}
  .q-groupline{font-size:0.8em;color:var(--sub);margin-bottom:4px;}
  .q-prompt{font-size:1.05em;margin-bottom:14px;}
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .opt-label{
    display:flex;align-items:flex-start;gap:10px;
    background:#faf7ee;border:2px solid var(--border);border-radius:12px;
    padding:12px 14px;cursor:pointer;font-size:0.98em;
  }
  .opt-label:hover{border-color:var(--teal);}
  .opt-label.selected{border-color:var(--teal);background:#eaf6f4;}
  .opt-label.correct{border-color:var(--green);background:#e9f6ec;}
  .opt-label.incorrect{border-color:var(--red);background:#fbeaea;}
  .opt-label input{margin-top:3px;}
  input[type="text"].textans{
    width:100%;padding:12px 14px;font-size:1em;border:2px solid var(--border);border-radius:12px;margin-bottom:16px;
  }
  textarea.reflectans{
    width:100%;min-height:80px;padding:12px 14px;font-size:1em;border:2px solid var(--border);border-radius:12px;margin-bottom:16px;font-family:inherit;
  }
  .feedback{
    border-radius:12px;padding:14px 16px;margin-bottom:14px;font-weight:600;font-size:0.98em;
  }
  .feedback.correct{background:#e9f6ec;color:var(--green);border:1px solid #b9e0c4;}
  .feedback.incorrect{background:#fbeaea;color:var(--red);border:1px solid #eec3c3;}
  .feedback.saved{background:#eef3fb;color:#345b96;border:1px solid #c4d6ef;}
  .review-item{border-bottom:1px solid var(--border);padding:12px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .rp{font-weight:600;margin-bottom:4px;}
  .review-item .ra{font-size:0.92em;margin-bottom:2px;}
  .tag-correct{color:var(--green);font-weight:700;}
  .tag-incorrect{color:var(--red);font-weight:700;}
  .tag-reflect{color:#345b96;font-weight:700;}
  .group-summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.92em;}
  .group-summary-row:last-child{border-bottom:none;}
  footer.note{text-align:center;color:var(--sub);font-size:0.8em;margin-top:20px;}
</style>
</head>

{
  id:"geocaching", title:"Geocaching", image:"treasureMap",
  text:`"Would you like to go geocaching with me this weekend, Tommy?" asked his father. "I have found a couple of new ones near the creek that I think would be fun. We could invite your friend Sam to join us."

"Sure, Dad. I love geocaching," said Tommy. "Should we go Saturday?" They agreed that they would leave Saturday morning to find the new geocaches, and Tommy ran to call Sam and invite him. Sam agreed to come with them. Although he wasn't sure what geocaching was, he always had fun with Tommy and his dad.

Friday night, Tommy and his dad got their gear ready. Both of them had handheld GPS units, hiking boots with good wool socks, a backpack to carry first aid gear, water, and swag for the cache such as plastic soldiers, a water pistol, and some playing cards. Tommy's father made sure that they had a compass and a map, bug spray, and hats, and he printed out the coordinates for the geocaches. Tommy had given Sam a list of things to bring with him, as well.

Saturday morning, Tommy and Dad picked up Sam at his house and off they went. "Mr. Jones, could you explain to me what geocaching is?" Sam asked, as they were getting in the car.

"Of course, Sam. Basically, it's like a giant worldwide treasure hunt. People hide geocaches, or containers, then take the coordinates with their GPS and enter the coordinates into a website where people like us can find them. Then other people, like us, go hunting for these containers. Some of them are very tiny, just big enough to have a piece of paper for the date and your name. Some of them are large enough to hold books or toys and a logbook. Sometimes, people even put disposable cameras in them so you can take a picture of yourself at the cache. Sometimes, there are even items in the cache that can be tracked, so you can see how they move around the world."

Tommy's dad could see that Sam was still a little confused, but he knew that the boy would catch on as they got going. Mr. Jones put the coordinates for the first cache into his GPS, and off they went. "It looks like this first cache is only two miles from here," he told the boys.

The GPS led the trio to a small parking area just inside the local park, where they stopped and got their backpacks on, sprayed themselves with bug spray, and reset the GPS for off-road walking. "It looks like we have about 400 feet to go just that way," Mr. Jones said, as they headed away from the car into the woods. When they arrived at the location, Sam looked around. "I don't see anything," he complained.

Tommy laughed. "Our GPS is accurate to 15 feet, Sam, which means that the cache container is within 15 feet of Dad right now, but in any direction. The way we do it is Dad stands still, and I walk 15 feet from him. Then we know how far in each direction to look. Why don't I walk 15 feet to his right and you go left?" Then we know exactly where to search. Sam agreed, and the boys quickly marked off their search area. "The cache is medium sized, Sam, so be looking for something like the plastic boxes your mom puts leftovers in, okay?"

Tommy, Sam, and Mr. Jones searched for about 10 minutes. They looked in tree branches, under rocks and leaves, and even inside of a hollow log before Sam yelled, "I think I found it!" Sure enough, he had found the container under a pile of leaves beside the hollow log. Since this was Sam's first find, Tommy and his dad let Sam open the box and choose an item to trade. Sam chose to take a bouncy rubber ball and leave a water gun. Mr. Jones signed the logbook for all of them, and they hid the cache back where they found it.

"That was so much fun, Tommy! I'm so glad you asked me to come along," Sam said excitedly.

"Does that mean you boys are ready to find the next one?" Mr. Jones asked. The boys cheered and the three set off for the car.`,

    {id:"1", type:"mc", prompt:"Why did Sam go with Tommy and Mr. Jones?", options:["He loved geocaching.","Tommy offered to give him a water pistol.","He always had fun when he was with Tommy and Mr. Jones.","He wanted to go swimming in the creek."], correct:2},
    {id:"2", type:"mc", prompt:"Why did Sam and Tommy have to mark off a search area?", options:["The GPS was accurate only to 15 feet.","Tommy's dad wanted to make the boys work harder.","Searching a big area was more fun.","Tommy wanted Sam to learn how to search."], correct:0},

  id:"dance", title:"Dance Class", image:"ballerina",
  text:`Jillian and Samantha attend dance classes at Ms. Suzie's Dance Studio every Friday after school. The twins have matching leotards and tights. They both wear their long brown hair up in a bun. However, that's all they have in common at Ms. Suzie's.

Jillian loves classical dance and is taking a ballet class. After she went into the classroom, she put on her satin slippers and began to stretch her legs at the barre. Jillian watches herself in the wall-length mirrors to make sure her feet are moving correctly on the wooden floor. When Ms. Suzie turns on the music, Jillian and the other ballerinas get into line and settle into position one. Jillian stood with the balls of her feet completely turned out, her heels touching and her feet forming a straight line. As Ms. Suzie took the class through the other four positions, Jillian thought about what was coming up later. Ms. Suzie had promised that today they would start learning en pointe. "En pointe" is French for "on the tip," when ballerinas stand on the tip of their toes as they dance. Jillian brought special toe shoes with her today, reinforced to support her feet and protect her toes.

In another classroom, Samantha slipped into her tap shoes and began to warm up on the wooden floor. Tap shoes are like dress shoes with little metal plates under the toes and the heels. The plates are attached by small screws that can be loosened to change the sound of the tapping. Ms. Jessica, one of Ms. Suzie's dance instructors, started the music. Samantha and her friends started working on their tap steps, watching themselves in the mirrors on the wall. Samantha started with basic tap steps, called single steps, and quickly moved through the different steps like the brush, the shuffle, and the ball change. Samantha likes the modern movements and music of tap. Jillian and Samantha both are practicing with extra effort. The school recital is next week, and they want to do their very best. The recital was so important to them that last month, their dad built a mini dance studio in the basement. It has a wooden floor, mirrors, and a barre. There is only room enough for one of them to practice at a time, so they take turns in the mini studio. Jillian practices in the mornings and Samantha in the evenings. They are really ready for the big night.

After class, the girls walked home together excitedly talking about their classes.`,

  id:"familynames", title:"Family Names", image:"crest",
  text:`Surnames are names that families share. They are passed down from generation to generation today, but this was not always the case.

{
  id:"meteor", title:"Meteor Watching", image:"meteor",
  text:`Every year in August, the Perseid Meteor shower is visible to the naked eye and is a favorite for professional and amateur astronomers, alike.

Many people like the Perseid Meteor shower because it happens in the summer when people are on vacation, the nighttime temperatures are moderate, and the weather generally is good. People have been enjoying this summer sky show for over 2,000 years.

Meteors are little bits of rock and ice left over from a comet passing by. The Perseid meteors are from the comet Swift-Tuttle, which passes by Earth every 135 years. The comet leaves a debris trail through which the Earth passes every year on its way around the Sun.

As the Earth moves through the debris trail, the meteors hit the atmosphere and burn, leaving streaks of light across the sky. The best time to see this light show is in the very early morning when the moon is setting. You need to be away from city lights, with a dark, open sky to see the shooting stars at their best.`,

  instructions:"To keep your writing interesting, vary your sentences — some long, some short, some simple, some complex. Combine each pair of sentences below into one, more interesting sentence. There's no single right answer here — after the whole test, you'll see a sample combined sentence to compare with your own.",
  questions:[
    {id:"1", type:"reflect", prompt:"Combine: \"Nate and Evan go to the Houston Zoo. They go on Sundays.\"", sample:"Nate and Evan go to the Houston Zoo on Sundays."},
    {id:"2", type:"reflect", prompt:"Combine: \"Dragonflies live by the river. I am hoping to see some today.\"", sample:"Dragonflies live by the river, where I hope to see some today."},
    {id:"3", type:"reflect", prompt:"Combine: \"Evan likes the monkeys. The monkeys live in the primate habitat.\"", sample:"Evan likes the monkeys that live in the primate habitat."},
    {id:"4", type:"reflect", prompt:"Combine: \"Baboons are from African and Asia. They mostly live in zoos now.\"", sample:"Baboons are from Africa and Asia, but they mostly live in zoos now."},
    {id:"5", type:"reflect", prompt:"Combine: \"Nick watches the baby giraffe. It tries to eat leaves from a tall tree.\"", sample:"Nick watches the baby giraffe as it tries to eat leaves from a tall tree."}
  ]
},

{
  id:"heteronyms", title:"Heteronyms",
  instructions:"Heteronyms are spelled the same but sound different and mean different things, depending on how they're used. For each sentence, choose which meaning matches the word as it's used.",
  questions:[
    {id:"1", type:"mc", prompt:"\"The Polish furniture needs polish.\" Which meaning fits the second word — \"a substance to give a shiny surface\"?", options:["Polish (the nationality/adjective)","polish (the shiny substance)"], correct:1},
    {id:"2", type:"mc", prompt:"\"I object to that object.\" Which meaning fits the first word — \"to disapprove\"?", options:["object (to disapprove, verb)","object (a thing, noun)"], correct:0},
    {id:"3", type:"mc", prompt:"\"She was close enough to the window to close it.\" Which meaning fits the second word — \"to shut\"?", options:["close (nearby, adjective)","close (to shut, verb)"], correct:1},
    {id:"4", type:"mc", prompt:"\"The bass drum had a bass painted on it.\" Which meaning fits the second word — \"a fish\"?", options:["bass (low, deep sound)","bass (a fish)"], correct:1},
    {id:"5", type:"mc", prompt:"\"Mr. Jones is ready to present the present to the President.\" Which word means \"to give formally\"?", options:["present (the verb — to give)","present (the noun — a gift)","President (the person)"], correct:0},
    {id:"6", type:"mc", prompt:"\"Don't desert us just because we are in the desert.\" Which meaning fits the first word — \"to leave\"?", options:["desert (to leave, verb)","desert (dry sandy land, noun)"], correct:0},
    {id:"7", type:"mc", prompt:"\"The dove dove for the food.\" Which meaning fits the first word — \"a bird\"?", options:["dove (a bird, noun)","dove (past tense of dive, verb)"], correct:0},
    {id:"8", type:"mc", prompt:"\"Give me a minute and I'll show you minute particles in my microscope.\" Which meaning fits the second word — \"tiny\"?", options:["minute (a unit of time)","minute (tiny, adjective)"], correct:1},
    {id:"9", type:"mc", prompt:"\"The singer is here to record a new record.\" Which meaning fits the first word — \"to preserve in sound\"?", options:["record (to preserve in sound, verb)","record (a disc/album, noun)"], correct:0},
    {id:"10", type:"mc", prompt:"\"I refuse to take out the refuse.\" Which meaning fits the first word — \"to say no\"?", options:["refuse (to say no, verb)","refuse (trash, noun)"], correct:0}
  ]
},

var FLAT = [];
(function buildFlat(){
  READING_PASSAGES.forEach(function(p){
    p.questions.forEach(function(q, i){
      FLAT.push({
        uid: "rd_" + p.id + "_" + q.id,
        sectionId: "reading",
        sectionLabel: "Reading",
        groupId: p.id,
        groupLabel: p.title,
        groupFirst: i === 0,
        group: p,
        q: q
      });
    });
  });
  LANGUAGE_SUBSECTIONS.forEach(function(s){
    s.questions.forEach(function(q, i){
      FLAT.push({
        uid: "ls_" + s.id + "_" + q.id,
        sectionId: "language",
        sectionLabel: "Written Expression",
        groupId: s.id,
        groupLabel: s.title,
        groupFirst: i === 0,
        group: s,
        q: q
      });
    });
  });
})();

var TOTAL = FLAT.length;
var SCORED_TOTAL = FLAT.filter(function(f){ return f.q.type !== "reflect"; }).length;

/* map groupId -> list of flat indices, and ordered group list */
var GROUP_ORDER = [];
var GROUP_INDEXES = {};
FLAT.forEach(function(f, idx){
  if(!GROUP_INDEXES[f.groupId]){
    GROUP_INDEXES[f.groupId] = [];
    GROUP_ORDER.push({id:f.groupId, label:f.groupLabel, sectionLabel:f.sectionLabel});
  }
  GROUP_INDEXES[f.groupId].push(idx);
});

   ============================================================ */
function storageWorks(){
  try{
    var k = "__t__" + Date.now();
    localStorage.setItem(k, "1");
    var ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
var STORAGE_OK = storageWorks();

function defaultState(){
  return {
    version: 1,
    startedAt: Date.now(),
    lastSavedAt: null,
    currentIndex: 0,
    responses: {},
    completedGroups: {},
    finished: false,
    finishedAt: null
  };
}

function loadState(){
  if(!STORAGE_OK) return defaultState();
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return defaultState();
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}

function saveState(){
  state.lastSavedAt = Date.now();
  if(!STORAGE_OK) return false;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){ return false; }
}

var state = loadState();

/* flush on visibility / pagehide */
document.addEventListener("visibilitychange", function(){
  if(document.hidden) saveState();
});
window.addEventListener("pagehide", function(){ saveState(); });

/* ============================================================
   GRADING HELPERS
   ============================================================ */
function normalize(s){
  return String(s || "")
    .toLowerCase()
    .replace(/[.,'"!?;:()\/\\-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function gradeQuestion(q, answer){
  if(q.type === "mc"){
    return Number(answer) === Number(q.correct);
  }
  if(q.type === "text"){
    var norm = normalize(answer);
    return (q.accept || []).some(function(a){ return normalize(a) === norm; });
  }
  return null; /* reflect: ungraded */
}

function correctAnswerDisplay(q){
  if(q.type === "mc") return q.options[q.correct];
  if(q.type === "text") return (q.accept || [])[0] || "";
  return q.sample || "";
}

/* ============================================================

   ============================================================ */
function passageIntroHTML(group, isReading){
  var html = '<details class="intro"' + (true ? " open" : "") + '>';
  html += '<summary>' + (isReading ? "📖 Read the passage" : "ℹ️ Instructions") + (isReading ? (" — " + group.title) : (" — " + group.title)) + '</summary>';
  html += '<div class="passage-text">';
  if(isReading && group.image){
    html += '<img class="passage-img" src="' + IMAGES[group.image] + '" alt="' + group.title + ' illustration">';
  }
  if(group.text){
    group.text.split("\n\n").forEach(function(para){
      html += "<p>" + para + "</p>";
    });
  }
  if(group.tableHtml){
    html += group.tableHtml;
  }
  if(!isReading && group.instructions){
    html += "<p>" + group.instructions + "</p>";
  }
  html += '</div></details>';
  return html;
}

var pendingGrade = null; /* {uid, correct} once submitted, before Continue clicked */

function renderQuestion(){
  var f = FLAT[state.currentIndex];
  var q = f.q;
  var isReading = f.sectionId === "reading";
  var html = "";
  html += testHeaderHTML();
  html += '<div class="card">';

  if(f.groupFirst){
    html += passageIntroHTML(f.group, isReading);
  } else {
    html += '<details class="intro"><summary>' + (isReading ? "📖 Show passage again" : "ℹ️ Show instructions again") + '</summary><div class="passage-text">';
    if(isReading && f.group.image){
      html += '<img class="passage-img" src="' + IMAGES[f.group.image] + '" alt="' + f.group.title + ' illustration">';
    }
    if(f.group.text){
      f.group.text.split("\n\n").forEach(function(para){ html += "<p>" + para + "</p>"; });
    }
    if(f.group.tableHtml) html += f.group.tableHtml;
    if(!isReading && f.group.instructions) html += "<p>" + f.group.instructions + "</p>";
    html += "</div></details>";
  }

  html += '<div class="q-groupline">' + f.groupLabel + '</div>';
  html += '<div class="q-prompt">' + q.prompt + '</div>';

  var existing = state.responses[f.uid];

  if(q.type === "mc"){
    html += '<div class="options" id="optWrap">';
    q.options.forEach(function(opt, i){
      var sel = existing && Number(existing.answer) === i;
      html += '<label class="opt-label' + (sel ? " selected" : "") + '" data-idx="' + i + '">';
      html += '<input type="radio" name="mcopt" value="' + i + '"' + (sel ? " checked" : "") + '>';
      html += '<span>' + opt + '</span></label>';
    });
    html += '</div>';
  } else if(q.type === "text"){
    html += '<input type="text" class="textans" id="txtAns" placeholder="Type your answer here" value="' + (existing ? String(existing.answer).replace(/"/g,'&quot;') : "") + '">';
  } else {
    html += '<textarea class="reflectans" id="reflectAns" placeholder="Write your sentence(s) here">' + (existing ? String(existing.answer) : "") + '</textarea>';
  }

  html += '<div id="feedbackArea"></div>';
  html += '<button class="btn block" id="btnSubmit">Submit Answer</button>';
  html += '</div>';

  app.innerHTML = html;
  wireTestHeader();

  if(q.type === "mc"){
    var labels = document.querySelectorAll("#optWrap .opt-label");
    labels.forEach(function(lbl){
      lbl.addEventListener("click", function(){
        labels.forEach(function(l){ l.classList.remove("selected"); });
        lbl.classList.add("selected");
        lbl.querySelector("input").checked = true;
      });
    });
  }

  document.getElementById("btnSubmit").onclick = function(){ submitAnswer(f, q); };
}

function submitAnswer(f, q){
  var answer;
  if(q.type === "mc"){
    var checked = document.querySelector('#optWrap input[name="mcopt"]:checked');
    if(!checked){ showToast("Please choose an answer first."); return; }
    answer = Number(checked.value);
  } else if(q.type === "text"){
    answer = document.getElementById("txtAns").value;
    if(!answer.trim()){ showToast("Please type an answer first."); return; }
  } else {
    answer = document.getElementById("reflectAns").value;
    if(!answer.trim()){ showToast("Please write something first."); return; }
  }

  var correct = gradeQuestion(q, answer);
  state.responses[f.uid] = {answer: answer, correct: correct, answeredAt: Date.now()};
  saveState(); /* SAVE AFTER EVERY QUESTION */

  var fbHtml = "";
  if(q.type === "reflect"){
    fbHtml = '<div class="feedback saved">💾 Saved! Nice work thinking that through.</div>';
  } else if(correct){
    fbHtml = '<div class="feedback correct">✅ Correct! Mā shā\' Allāh.</div>';
  } else {
    fbHtml = '<div class="feedback incorrect">❌ Not quite this time — you\'ll see the answer at the end. Keep going!</div>';
  }

  document.getElementById("feedbackArea").innerHTML = fbHtml;

  if(q.type === "mc"){
    document.querySelectorAll("#optWrap .opt-label").forEach(function(lbl){
      lbl.querySelector("input").disabled = true;
    });
  } else if(q.type === "text"){
    document.getElementById("txtAns").disabled = true;
  } else {
    document.getElementById("reflectAns").disabled = true;
  }

  var submitBtn = document.getElementById("btnSubmit");
  submitBtn.textContent = "Continue ▶️";
  submitBtn.onclick = function(){ advance(f); };
}

function advance(f){
  var groupIdxs = GROUP_INDEXES[f.groupId];
  var isLastInGroup = groupIdxs[groupIdxs.length - 1] === state.currentIndex;

  state.currentIndex++;

  if(isLastInGroup){
    state.completedGroups[f.groupId] = true;
    saveState(); /* SAVE AFTER EVERY SECTION */
    if(state.currentIndex >= TOTAL){
      state.finished = true;
      state.finishedAt = Date.now();
      saveState();
      renderGroupComplete(f, true);
    } else {
      renderGroupComplete(f, false);
    }
  } else {
    saveState();
    renderQuestion();
  }
}

function renderGroupComplete(f, isVeryLast){
  stopReminder();
  var html = "";
  html += '<div class="card center">';
  html += judySVG(90);
  html += '<h2>🎉 ' + f.groupLabel + ' complete!</h2>';
  if(isVeryLast){
    html += '<p>That was the last section, mā shā\' Allāh! Let\'s see the full results.</p>';
    html += '<button class="btn block" id="btnGo">📊 See My Final Results</button>';
  } else {
    html += '<p class="muted">Great focus, ' + STUDENT + '. Your progress is saved. On to the next section, in shā\' Allāh!</p>';
    html += '<button class="btn block" id="btnGo">Continue ▶️</button>';
  }
  html += '<div style="height:10px"></div>';
  html += '<button class="btn secondary block" id="btnHome2">🏠 Back to Home (progress is saved)</button>';
  html += '</div>';
  app.innerHTML = html;
  document.getElementById("btnGo").onclick = function(){
    if(isVeryLast) renderFinalResults(); else renderTest();
  };
  document.getElementById("btnHome2").onclick = renderHome;
}

/* ============================================================
   RENDER: TEST FLOW ENTRY
   ============================================================ */
function renderTest(){
  startReminder();
  if(state.currentIndex >= TOTAL){
    state.finished = true;
    saveState();
    renderFinalResults();
    return;
  }
  renderQuestion();
}

/* ============================================================
   RENDER: FINAL RESULTS
   ============================================================ */
function encouragementFor(pct){
  if(pct >= 90) return "Mā shā\' Allāh! Excellent work, " + STUDENT + " — alhamdulillāh! Your hard work is really showing.";
  if(pct >= 75) return "Great effort, alhamdulillāh! You're doing really well — just a bit more review and you'll be even stronger.";
  if(pct >= 60) return "Solid work, " + STUDENT + "! In shā\' Allāh, a little more review on a few topics and you'll feel even more confident.";
  return "You worked hard and finished the whole test — that matters a lot! In shā\' Allāh, let's go back over a few areas together before the real test. You've got this.";
}

function renderFinalResults(){
  stopReminder();
  var stats = overallStats();
  var pct = stats.scoredTotal ? Math.round((stats.correct / stats.scoredTotal) * 100) : 0;

  var bySection = {};
  var byGroup = {};
  FLAT.forEach(function(f){
    var r = state.responses[f.uid];
    if(!bySection[f.sectionId]) bySection[f.sectionId] = {label: f.sectionLabel, total: 0, correct: 0};
    if(!byGroup[f.groupId]) byGroup[f.groupId] = {label: f.groupLabel, sectionLabel: f.sectionLabel, total: 0, correct: 0, reflect: 0};
    if(f.q.type !== "reflect"){
      bySection[f.sectionId].total++;
      byGroup[f.groupId].total++;
      if(r && r.correct){ bySection[f.sectionId].correct++; byGroup[f.groupId].correct++; }
    } else {
      byGroup[f.groupId].reflect++;
    }
  });

  var html = "";
  html += '<div class="card center">';
  html += judySVG(110);
  html += '<h1>Test Complete!</h1>';
  html += '<p>' + encouragementFor(pct) + '</p>';
  html += '<div class="stat-grid">';
  html += '<div class="stat-box"><div class="num">' + stats.correct + '/' + stats.scoredTotal + '</div><div class="lbl">Total Score</div></div>';
  html += '<div class="stat-box"><div class="num">' + pct + '%</div><div class="lbl">Overall</div></div>';
  html += '</div>';
  html += '<div class="row" style="justify-content:center">';
  html += '<button class="btn gold" id="btnExport">⬇️ Export Full Results</button>';
  html += '<button class="btn secondary" id="btnHome3">🏠 Home</button>';
  html += '</div>';
  html += '</div>';

  html += '<div class="card"><h3>Score by Section</h3>';
  ["reading","language"].forEach(function(sid){
    var s = bySection[sid];
    if(!s) return;
    var p = s.total ? Math.round((s.correct/s.total)*100) : 0;
    html += '<div class="group-summary-row"><span>' + s.label + '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>';
  });
  html += '</div>';

  html += '<div class="card"><h3>Score by Passage / Skill</h3>';
  GROUP_ORDER.forEach(function(g){
    var gs = byGroup[g.id];
    var p = gs.total ? Math.round((gs.correct/gs.total)*100) : 0;
    var extra = gs.reflect ? (" + " + gs.reflect + " written response" + (gs.reflect>1?"s":"")) : "";
    html += '<div class="group-summary-row"><span>' + gs.label + '</span><span>' + (gs.total ? (gs.correct + '/' + gs.total + ' (' + p + '%)') : '') + extra + '</span></div>';
  });
  html += '</div>';

  html += '<div class="card"><h3>Full Review</h3><p class="muted">Now that the test is finished, here are the correct answers for anything missed.</p>';
  var currentGroup = null;
  FLAT.forEach(function(f){
    var r = state.responses[f.uid];
    if(f.groupFirst){
      html += '<h3 style="margin-top:18px">' + f.groupLabel + '</h3>';
    }
    html += '<div class="review-item">';
    html += '<div class="rp">' + f.q.prompt + '</div>';
    if(f.q.type === "reflect"){
      html += '<div class="ra"><span class="tag-reflect">Written response:</span> ' + (r ? r.answer : "<em>not answered</em>") + '</div>';
      html += '<div class="ra muted">Sample answer: ' + f.q.sample + '</div>';
    } else {
      var studentDisplay = r ? (f.q.type === "mc" ? f.q.options[Number(r.answer)] : r.answer) : "<em>not answered</em>";
      if(r && r.correct){
        html += '<div class="ra"><span class="tag-correct">✅ Correct —</span> ' + studentDisplay + '</div>';
      } else {
        html += '<div class="ra"><span class="tag-incorrect">❌ Answered:</span> ' + studentDisplay + '</div>';
        html += '<div class="ra muted">Correct answer: ' + correctAnswerDisplay(f.q) + '</div>';
      }
    }
    html += '</div>';
  });
  html += '</div>';

  html += '<footer class="note">Iowa Assessments practice items adapted from ' + STUDENT + '\'s Mometrix study guide for personal use.</footer>';

  app.innerHTML = html;
  document.getElementById("btnExport").onclick = exportResults;
  document.getElementById("btnHome3").onclick = renderHome;
}

/* ============================================================
   EXPORT
   ============================================================ */
function exportResults(){
  var stats = overallStats();
  var pct = stats.scoredTotal ? Math.round((stats.correct / stats.scoredTotal) * 100) : 0;
  var out = {
    student: STUDENT,
    test: "Iowa Assessments Level 11 — ELA (Reading + Written Expression)",
    exportedAt: new Date().toISOString(),
    finishedAt: state.finishedAt ? new Date(state.finishedAt).toISOString() : null,
    overall: {scored: stats.scoredTotal, correct: stats.correct, percent: pct},
    responses: []
  };
  FLAT.forEach(function(f){
    var r = state.responses[f.uid];
    out.responses.push({
      id: f.uid,
      section: f.sectionLabel,
      group: f.groupLabel,
      type: f.q.type,
      prompt: f.q.prompt,
      studentAnswer: r ? (f.q.type === "mc" ? f.q.options[Number(r.answer)] : r.answer) : null,
      correct: r ? r.correct : null,
      correctAnswer: f.q.type === "reflect" ? null : correctAnswerDisplay(f.q),
      sampleAnswer: f.q.type === "reflect" ? f.q.sample : null
    });
  });
  var blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "shareefah_iowa_ela_results.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast("⬇️ Results exported!");
}

/* ============================================================
   INIT
   ============================================================ */
if(state.finished){
  renderHome();
} else {
  renderHome();
}
</script>
