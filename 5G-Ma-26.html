function startQuizSession(items, sessionType, subId) {
  UI.session.quiz = {
    subId, sessionType, queue: items.slice(), pos: 0,
    selectedIndex: null, confidence: null, revealed: false,
    displayOrder: fisherYates([0,1,2,3]), flagged: false, clueShown: false,
    stats: { correct: 0, total: 0 },
  };
  UI.view = "quiz";
  render();
}

function startSubUnitQuiz(subId) {
  const su = subUnitMeta(subId).sub;
  startQuizSession(fisherYates(su.practicePool), "subunit", subId);
}

function startReviewListSession() {
  const groups = reviewListGrouped();
  let items = [];
  Object.values(groups).forEach(arr => { items = items.concat(arr); });
  items.sort((a,b) => dueScore(b.id) - dueScore(a.id));
  if (items.length === 0) { UI.view = "review"; render(); return; }
  startQuizSession(items, "reviewList", null);
}

function startSingleItemSession(itemId) {
  const item = itemById(itemId);
  startQuizSession([item], "single", item.sub);
}

function startComputationTuneup() {
  const nbt2 = subUnitMeta("nbt2").sub.practicePool.filter(i => i.iowaCat === "Computation");
  const nbt3 = subUnitMeta("nbt3").sub.practicePool.filter(i => i.iowaCat === "Computation");
  const items = fisherYates(nbt2.concat(nbt3)).slice(0, 8);
  startQuizSession(items, "tuneup", null);
}

function viewQuiz() {
  const Q = UI.session.quiz;
  if (Q.detourReturn) {
    Q.detourReturn = false;
    Q.pos += 1;
    Q.selectedIndex = null; Q.confidence = null; Q.revealed = false;
    Q.displayOrder = fisherYates([0,1,2,3]);
  }
  if (Q.pos >= Q.queue.length) {
    return `<div class="card center-text">
      ${judyPanel("cheer", `Session complete! You got ${Q.stats.correct} of ${Q.stats.total} correct. Every attempt makes the real test easier.`)}

        <button class="btn btn-primary" data-action="quiz-done-dashboard">Back to Trail Map</button>
        <button class="btn btn-secondary" data-action="goto-review">Open Review List</button>
      </div>
    </div>`;
  }
  const item = Q.queue[Q.pos];
  const diagram = diagramForItem(item);
  let html = `<button class="btn btn-ghost btn-sm" data-action="quiz-exit">← Exit session</button>
    <div class="small-text mt8">Question ${Q.pos+1} of ${Q.queue.length} <span class="pill ${iowaCatPillClass(item.iowaCat)}">${iowaCatLabel(item.iowaCat)}</span></div>

      ${diagram ? `<div class="mt8 mb0">${diagram}</div>` : ""}
      ${renderChoices(item, {displayOrder: Q.displayOrder, revealed: Q.revealed, selectedAuthoredIndex: Q.selectedIndex})}`;

  if (!Q.revealed) {
    html += `<div class="mt16" style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" data-action="quiz-show-clue">💡 Show a clue</button>

    }

  if (Q.selectedIndex !== null && !Q.revealed) {
    html += `<div class="mt16">
      <div class="small-text">How confident are you?</div>
      <div class="confidence-row">
        <button class="btn btn-secondary btn-sm" data-action="quiz-confidence" data-level="confident">😊 Confident</button>
        <button class="btn btn-secondary btn-sm" data-action="quiz-confidence" data-level="unsure">🤔 Not sure</button>
      </div>
    </div>`;
  }

  if (Q.revealed) {
    const correct = Q.selectedIndex === item.correctIndex;
    const tierMsg = {
      "recurring": "This exact mix-up has come up before — let's make sure it clicks this time.",
      "slipped": "You had this one solid before — just a little rust. A quick refresher will bring it right back.",
      "confident-miss": "You were sure about this one — those are worth a closer look since they teach the most.",
      "new-gap": "First time seeing this — totally normal, that's what practice is for.",
    }[Q.lastTier] || "";
    html += `<div class="explanation-box">${escapeHtml(item.explanations[Q.selectedIndex])}
      ${!correct ? `<div class="mt8"><strong>Correct answer:</strong> ${escapeHtml(item.choices[item.correctIndex])} — ${escapeHtml(item.explanations[item.correctIndex])}</div>` : ""}
      ${tierMsg ? `<div class="mt8 small-text">${tierMsg}</div>` : ""}
    </div>
    <div class="mt16" style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" data-action="quiz-next">${Q.pos+1 >= Q.queue.length ? "Finish" : "Next question →"}</button>
      ${!correct ? `<button class="btn btn-secondary" data-action="quiz-study-retry">Study this, then retry</button>` : ""}
      <button class="btn btn-ghost btn-sm" data-action="quiz-flag" data-id="${item.id}">${STATE.manualFlags[item.id] ? "🚩 Flagged" : "🏳️ Flag for review"}</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

const QuizActions = {
  "choose": (el) => {
    const Q = UI.session.quiz;
    if (Q.revealed) return;
    Q.selectedIndex = parseInt(el.dataset.authoredIndex, 10);
    render();
  },
  "quiz-show-clue": () => {
    UI.session.quiz.clueShown = true;
    render();
  },
  "quiz-confidence": (el) => {
    const Q = UI.session.quiz;
    const item = Q.queue[Q.pos];
    const confident = el.dataset.level === "confident";
    const correct = Q.selectedIndex === item.correctIndex;
    const wasRecurringBefore = Object.values(getRecord(item.id).wrongChoiceCounts || {}).some(c => c >= 2);
    const result = recordAttempt(item.id, { correct, confident, chosenIndex: Q.selectedIndex });
    Q.lastTier = result.tier;
    Q.revealed = true;
    Q.stats.total += 1;
    if (correct) Q.stats.correct += 1;
    if (correct && wasRecurringBefore) awardBadge("beat_a_mixup");
    checkBadgesGeneral();
    popToastSoon();
    render();
  },
  "quiz-next": () => {
    const Q = UI.session.quiz;
    Q.pos += 1;
    Q.selectedIndex = null; Q.confidence = null; Q.revealed = false; Q.clueShown = false;
    Q.displayOrder = fisherYates([0,1,2,3]);
    if (Q.pos >= Q.queue.length && Q.sessionType === "tuneup") awardBadge("tuneup_done");
    render();
  },
  "quiz-study-retry": () => {
    const Q = UI.session.quiz;

    startDetourLearn(item.sub, { type: "quiz", subId: Q.subId });
  },
  "quiz-flag": (el) => {

    if (STATE.manualFlags[id]) delete STATE.manualFlags[id];

/* ============================================================
   EXAM SIMULATION -- true Iowa Level 11 Math format:
   Part 1&2 (Concepts/Problem Solving/Data): 60 min, 60 items
   Computation: 20 min, 29 items
   Completion (not score) unlocks the next exam.
   ============================================================ */
const EXAM_TIPS = [
  "Pacing for Part 1: about 1 minute per question — if one's taking too long, mark your best guess and keep moving.",
  "Pacing for Part 2 (Computation): under 45 seconds per question — these are meant to move fast.",
  "Read the whole question before looking at the answer choices — they're designed to tempt a fast skim.",
  "You can move forward and back within a part to double-check answers before time runs out.",
  "If a computation problem has a zero in the middle of your answer, double-check you didn't drop it.",
  "Estimate first on word problems so you can sanity-check whether your exact answer is in the right ballpark.",
];

let examTimerInterval = null;
function clearExamTimer() { if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; } }

function startExamPretest(examKey) {

function beginExamPart(partNum) {
  const E = UI.session.exam;
  const exam = STUDY_DATA.exams[E.examKey];
  const items = partNum === 1 ? exam.part1 : exam.part2;
  const spec = partNum === 1 ? STUDY_DATA.meta.examSpec.part1 : STUDY_DATA.meta.examSpec.part2;
  E.phase = "part" + partNum;
  UI.view = "examPart";
  E.pos = 0;
  E.answers = new Array(items.length).fill(null);
  E.displayOrders = items.map(() => fisherYates([0,1,2,3]));
  E.timeLeftSec = spec.minutes * 60;
  E.items = items;
  render();
  clearExamTimer();
  examTimerInterval = setInterval(() => {
    E.timeLeftSec -= 1;
    const el = document.getElementById("exam-timer-display");
    if (el) {
      el.textContent = fmtTime(Math.max(0, E.timeLeftSec));
      el.className = "exam-timer" + (E.timeLeftSec <= 60 ? " low" : "");
    }
    if (E.timeLeftSec <= 0) {
      clearExamTimer();
      submitExamPart();
    }
  }, 1000);
}

function submitExamPart() {
  clearExamTimer();
  const E = UI.session.exam;
  if (E.phase === "part1") {
    E.part1Answers = E.answers; E.part1Items = E.items;
    beginExamPart(2);
  } else if (E.phase === "part2") {
    E.part2Answers = E.answers; E.part2Items = E.items;
    finishExam();
  }
}

function finishExam() {
  const E = UI.session.exam;
  const subScores = {};
  function tally(items, answers) {
    items.forEach((item, i) => {
      subScores[item.sub] = subScores[item.sub] || { correct: 0, total: 0, missed: [] };
      subScores[item.sub].total += 1;
      const ans = answers[i];
      const correct = ans && ans.chosenIndex === item.correctIndex;
      if (correct) subScores[item.sub].correct += 1;
      else subScores[item.sub].missed.push({ item, chosenIndex: ans ? ans.chosenIndex : null });
    });
  }
  tally(E.part1Items, E.part1Answers);
  tally(E.part2Items, E.part2Answers);
  const part1Correct = E.part1Answers.filter((a,i) => a && a.chosenIndex === E.part1Items[i].correctIndex).length;
  const part2Correct = E.part2Answers.filter((a,i) => a && a.chosenIndex === E.part2Items[i].correctIndex).length;
  const ranked = Object.entries(subScores).map(([sub, s]) => ({ sub, pct: s.correct / s.total, ...s }))
    .sort((a,b) => a.pct - b.pct);
  const attempt = {
    date: Date.now(),
    part1: { correctCount: part1Correct, total: E.part1Items.length },
    part2: { correctCount: part2Correct, total: E.part2Items.length },
    predicted: E.predicted,
    subScores,
    weakestSubs: ranked.slice(0,3).map(r => r.sub),
  };
  STATE.examAttempts[E.examKey] = attempt;
  saveState();
  checkBadgesAfterExam(attempt);
  checkBadgesGeneral();
  popToastSoon();
  UI.view = "examResults";
  UI.params = { examKey: E.examKey };
  render();
}

/* ============================================================
   OPTIONAL GAMES -- now with real game feel: per-round countdown,
   combo multiplier, lives (Speed Round), confetti/shake feedback,
   and a persisted local high score. Still pure reinforcement --
   NEVER writes to mastery/streak/review-list state.
   ============================================================ */
function allGlossaryTerms() {
  const out = [];
  STUDY_DATA.units.forEach(u => u.subunits.forEach(su => {
    Object.entries(su.notes.glossary).forEach(([term, g]) => out.push({ term, def: g.def }));
  }));
  return out;
}

function buildTermMatchRound() {
  const all = allGlossaryTerms();
  const shuffled = fisherYates(all);
  const rounds = shuffled.slice(0, 10).map(target => {
    const distractors = fisherYates(all.filter(t => t.term !== target.term)).slice(0,3);
    const options = fisherYates([target, ...distractors]);
    return { term: target.term, correctDef: target.def, options };
  });
  return rounds;
}

function speedRoundEligibleItems() {
  return allBankItems().filter(it => /=\s*\?\s*$/.test(it.stem.trim()));
}

function buildSpeedRound() {
  const pool = fisherYates(speedRoundEligibleItems()).slice(0, 14);
  return pool.map(item => {
    const makeTrue = Math.random() < 0.5;
    const chosenIdx = makeTrue ? item.correctIndex : fisherYates(item.choices.map((_,i)=>i).filter(i=>i!==item.correctIndex))[0];
    const statement = item.stem.replace(/\?\s*$/, item.choices[chosenIdx]);
    return { statement, isTrue: makeTrue };
  });
}

const GAME_TIME_LIMIT_MS = { termMatch: 9000, speedRound: 6000 };

function clearGameTimer() { if (window.__gameTimerHandle) { clearTimeout(window.__gameTimerHandle); window.__gameTimerHandle = null; } }

function startGame(gameId) {
  clearGameTimer();
  const rounds = gameId === "termMatch" ? buildTermMatchRound() : buildSpeedRound();
  UI.session.game = {
    id: gameId, rounds, pos: 0, score: 0, combo: 0, bestCombo: 0,
    lives: gameId === "speedRound" ? 3 : null,
    roundStartAt: Date.now(), roundOver: false, feedback: null,
  };
  UI.view = "game";
  render();
  armGameTimer();
}

function armGameTimer() {
  const G = UI.session.game;
  if (!G || G.pos >= G.rounds.length) return;
  G.roundStartAt = Date.now();
  clearGameTimer();
  window.__gameTimerHandle = setTimeout(() => resolveGameRound(null), GAME_TIME_LIMIT_MS[G.id]);
}

function comboMultiplier(combo) { return 1 + Math.floor(combo / 3); }

function resolveGameRound(userAnswerCorrect) {
  clearGameTimer();
  const G = UI.session.game;
  if (!G || G.roundOver || UI.view !== "game") return;
  G.roundOver = true;
  if (userAnswerCorrect) {
    G.combo += 1;
    G.bestCombo = Math.max(G.bestCombo, G.combo);
    G.score += comboMultiplier(G.combo - 1);
    G.feedback = "correct";
  } else {
    G.combo = 0;
    G.feedback = "wrong";
    if (G.lives !== null) G.lives -= 1;
  }
  render();
  const gameOver = G.lives !== null && G.lives <= 0;
  setTimeout(() => {
    if (!UI.session.game || UI.session.game !== G || UI.view !== "game") return; // navigated away
    if (gameOver) {
      G.pos = G.rounds.length; // force end screen
    } else {
      G.pos += 1;
      G.roundOver = false;
      G.feedback = null;
    }
    render();
    if (G.pos < G.rounds.length) armGameTimer();
    else finalizeGameScore(G);
  }, 900);
}

function finalizeGameScore(G) {
  const key = G.id;
  if (G.score > (STATE.gameHighScores[key] || 0)) {
    STATE.gameHighScores[key] = G.score;
    saveState();
  }
  const perfect = G.bestCombo >= G.rounds.length;
  if (perfect && G.id === "termMatch") awardBadge("game_termmatch_perfect");
  if (perfect && G.id === "speedRound") awardBadge("game_speedround_perfect");
  popToastSoon();
}

function confettiHtml() {
  const colors = ["#1868DB","#E8703A","#E8B23D","#3E8E5C"];
  let pieces = "";
  for (let i=0;i<14;i++) {
    const dx = (Math.random()*160-80).toFixed(0) + "px";
    const left = 10 + Math.random()*80;
    const color = colors[i % colors.length];
    const delay = (Math.random()*0.15).toFixed(2);
    pieces += `<div class="confetti-piece" style="left:${left}%; background:${color}; --dx:${dx}; animation-delay:${delay}s;"></div>`;
  }
  return `<div class="confetti-burst">${pieces}</div>`;
}

function livesHtml(lives) {
  if (lives === null) return "";
  let s = "";
  for (let i=0;i<3;i++) s += i < lives ? "❤️" : "🤍";
  return `<div class="lives-row">${s}</div>`;
}

function viewGame() {
  const G = UI.session.game;
  if (G.pos >= G.rounds.length) {
    clearGameTimer();
    const best = STATE.gameHighScores[G.id] || 0;
    return `<div class="card center-text">
      ${judyPanel(G.score >= best ? "cheer" : "encourage", `Final score: ${G.score} (best combo x${comboMultiplier(G.bestCombo-1)})! ${G.score >= best && G.score > 0 ? "New high score!" : "Nice reps — every round sharpens your speed."}`)}
      <div class="small-text">Best score for this game: ${Math.max(best, G.score)}</div>
      <div class="mt16" style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-primary" data-action="goto-game" data-game="${G.id}">Play again</button>
        <button class="btn btn-secondary" data-action="goto-dashboard">Back to Trail Map</button>
      </div>
    </div>`;
  }
  const r = G.rounds[G.pos];
  const elapsed = Date.now() - G.roundStartAt;
  const limit = GAME_TIME_LIMIT_MS[G.id];
  const pctLeft = G.roundOver ? 0 : Math.max(0, 100 - (elapsed/limit)*100);
  let html = `<div class="card-row" style="justify-content:space-between;">
      <div class="small-text">🎮 ${G.id === "termMatch" ? "Term Match" : "Speed Round True/False"} — ${G.pos+1}/${G.rounds.length}</div>
      ${livesHtml(G.lives)}
    </div>
    <div class="card-row" style="justify-content:space-between; margin-top:4px;">
      <span class="combo-badge">Score: ${G.score}${G.combo >= 3 ? ` · Combo x${comboMultiplier(G.combo-1)}!` : ""}</span>
    </div>
    <div class="game-timer-bar"><div class="game-timer-fill" id="game-timer-fill" style="width:${pctLeft}%;"></div></div>`;

  const feedbackClass = G.feedback === "wrong" ? "shake" : "";
  if (G.id === "termMatch") {
    html += `<div class="card ${feedbackClass}"><h3>Which definition matches: "${escapeHtml(r.term)}"?</h3>
      <div class="choice-list mt16">${r.options.map(o => {
        let cls = "choice-btn";
        if (G.roundOver) {
          if (o.def === r.correctDef) cls += " correct";
          else if (G.feedback === "wrong" && o.def === G._chosenDef) cls += " incorrect";
        }
        return `<button class="${cls}" ${G.roundOver ? "disabled" : ""} data-action="game-term-choose" data-correct="${o.def === r.correctDef}" data-def="${escapeHtml(o.def)}">${escapeHtml(o.def)}</button>`;
      }).join("")}</div>
      ${G.feedback === "correct" ? confettiHtml() : ""}
    </div>`;
  } else {
    html += `<div class="card center-text ${feedbackClass}">
      <div class="q-stem">${escapeHtml(r.statement)}</div>
      <div class="mt16" style="display:flex; gap:14px; justify-content:center;">
        <button class="btn btn-primary" data-action="game-tf-choose" data-answer="true" ${G.roundOver?"disabled":""}>✅ True</button>
        <button class="btn btn-secondary" data-action="game-tf-choose" data-answer="false" ${G.roundOver?"disabled":""}>❌ False</button>
      </div>
      ${G.feedback === "correct" ? confettiHtml() : ""}
      ${G.roundOver ? `<div class="mt8 small-text">${r.isTrue ? "That was True." : "That was False."}</div>` : ""}
    </div>`;
  }
  return html;
}

function awardBadge(id) {
  if (STATE.badges[id]) return; // already earned
  STATE.badges[id] = Date.now();
  saveState();
  UI.toastQueue = UI.toastQueue || [];
  UI.toastQueue.push(id);
  if (Object.keys(STATE.badges).length >= 10) awardBadge("carrot_collector");
}

function checkBadgesGeneral() {
  if (Object.keys(STATE.learned).length >= 1) awardBadge("first_learn");
  if (Object.keys(STATE.learned).length >= 15) awardBadge("all_learned");
  const anyAttempted = Object.keys(STATE.perQuestion).length > 0;
  if (anyAttempted) awardBadge("first_quiz");
  if (Object.values(STATE.perQuestion).some(r => r.cleared)) awardBadge("first_clear");
  if (Object.values(STATE.perQuestion).some(r => r.durable)) awardBadge("durable_master");
  if (STATE.dayStreak.current >= 3) awardBadge("streak_3");
  if (STATE.dayStreak.current >= 7) awardBadge("streak_7");

  STUDY_DATA.units.forEach(u => {
    let unitFull = true;
    u.subunits.forEach(su => {
      if (subUnitMasteryPct(su.id) >= 0.999) awardBadge("sub_mastered");
      else unitFull = false;
    });
    if (unitFull) awardBadge("unit_mastered");
  });
  if (STUDY_DATA.units.every(u => unitMasteryPct(u.id) >= 0.999)) awardBadge("all_mastered");
}

/* ============================================================
   SCRATCHPAD -- a persistent canvas overlay, mounted OUTSIDE the main
   #judy-app render cycle on purpose: if it lived inside the innerHTML
   that render() rewrites, every unrelated re-render (picking an answer,
   a game round, anything) would wipe her drawing. Available in Learn,
   Study/Quiz, AND Exams (real tests allow scratch paper too).
   ============================================================ */
const SCRATCH_COLORS = ["#3A2A22", "#1868DB", "#E8703A", "#3E8E5C"];
let scratchState = { drawing: false, color: SCRATCH_COLORS[0], lastX: 0, lastY: 0, everUsed: false };

function buildScratchpadDOM() {
  const root = document.createElement("div");
  root.id = "scratchpad-root";
  root.style.display = "none";
  root.innerHTML = `
    <div class="scratchpad-overlay" id="scratchpad-overlay-bg">
      <div class="scratchpad-panel" id="scratchpad-panel">
        <div class="scratchpad-toolbar">
          <strong style="margin-right:8px;">🖍️ Scratchpad</strong>
          ${SCRATCH_COLORS.map((c,i) => `<span class="scratchpad-swatch${i===0?' active':''}" data-color="${c}" style="background:${c}"></span>`).join("")}
          <button class="btn btn-ghost btn-sm" id="scratchpad-clear-btn" type="button">Clear</button>
          <button class="btn btn-primary btn-sm" id="scratchpad-close-btn" type="button" style="margin-left:auto;">Done</button>
        </div>
        <canvas id="scratchpad-canvas"></canvas>
        <div class="small-text mt8">Draw with your mouse or finger — this is just for working things out, it isn't graded or saved.</div>
      </div>
    </div>`;
  document.body.appendChild(root);

  const canvas = root.querySelector("#scratchpad-canvas");
  const ctx0 = () => canvas.getContext("2d");
  function resizeCanvasKeepingContent() {
    const rect = canvas.getBoundingClientRect();
    const prev = canvas.toDataURL ? (canvas.width ? canvas.toDataURL() : null) : null;
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    const ctx = ctx0();
    ctx.scale(2,2);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 3;
    if (prev) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height); img.src = prev; }
  }
  function pos(evt) {
    const rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }
  canvas.addEventListener("pointerdown", (e) => {
    scratchState.drawing = true;
    scratchState.everUsed = true;
    const p = pos(e);
    scratchState.lastX = p.x; scratchState.lastY = p.y;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!scratchState.drawing) return;
    const p = pos(e);
    const ctx = ctx0();
    ctx.strokeStyle = scratchState.color;
    ctx.beginPath();
    ctx.moveTo(scratchState.lastX, scratchState.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    scratchState.lastX = p.x; scratchState.lastY = p.y;
  });
  function stopDraw() {
    if (scratchState.drawing && scratchState.everUsed) {
      awardBadge("scratchpad_used");
    }
    scratchState.drawing = false;
  }
  canvas.addEventListener("pointerup", stopDraw);
  canvas.addEventListener("pointerleave", stopDraw);

  root.querySelectorAll(".scratchpad-swatch").forEach(sw => {
    sw.addEventListener("click", () => {
      scratchState.color = sw.dataset.color;
      root.querySelectorAll(".scratchpad-swatch").forEach(s => s.classList.remove("active"));
      sw.classList.add("active");
    });
  });
  root.querySelector("#scratchpad-clear-btn").addEventListener("click", () => {
    const ctx = ctx0();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
  root.querySelector("#scratchpad-close-btn").addEventListener("click", closeScratchpad);
  root.querySelector("#scratchpad-overlay-bg").addEventListener("click", (e) => {
    if (e.target.id === "scratchpad-overlay-bg") closeScratchpad();
  });
  window.addEventListener("resize", () => { if (root.style.display !== "none") resizeCanvasKeepingContent(); });

  root._resize = resizeCanvasKeepingContent;
}

function openScratchpad() {
  const root = document.getElementById("scratchpad-root");
  if (!root) return;
  root.style.display = "flex";
  requestAnimationFrame(() => root._resize());
}
function closeScratchpad() {
  const root = document.getElementById("scratchpad-root");
  if (root) root.style.display = "none";
}

    openProgressFromFile(el.files[0], (err) => {
      const msg = document.getElementById("open-progress-msg");
      if (err) {
        if (msg) { msg.textContent = "Couldn't open that file: " + err.message; msg.style.color = "var(--danger)"; }
      } else {
        _itemIndex = null; // force item cache rebuild in case buildVersion changed
        render();
        const msg2 = document.getElementById("open-progress-msg");
        if (msg2) { msg2.textContent = "Progress loaded!"; msg2.style.color = "var(--ok)"; }
      }
    });
  }
}

async function initApp() {
  await loadState();
  document.getElementById("judy-app").setAttribute("data-theme", STATE.settings.theme || "light");
  document.getElementById("judy-app").addEventListener("click", handleGlobalClick);
  document.getElementById("judy-app").addEventListener("input", handleGlobalInput);
  document.getElementById("judy-app").addEventListener("change", handleGlobalInput);
  buildScratchpadDOM();
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initApp);
} else {
  initApp();
}

</script>
</body>
</html>
