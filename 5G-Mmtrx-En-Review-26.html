<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Get Ready for Iowa English Test (5th Grade)</title>
<style>
  :root{
    --bg:#FBF6EC;
    --panel:#FFFFFF;
    --ink:#2E2A25;
    --sub:#6b6255;
    --teal:#0d6e6e;
    --teal-dark:#095151;
    --gold:#c9972c;
    --maroon:#7a2e3a;
    --green:#2f7d4f;
    --red:#b23a3a;
    --blue:#345b96;
    --border:#e7ddc9;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    padding-bottom:40px;
  }
  #app{max-width:760px;margin:0 auto;padding:16px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(60,50,20,0.06);
  }
  .bismillah{text-align:center;font-size:1.4em;color:var(--teal-dark);margin:6px 0 2px;}
  .bismillah-en{text-align:center;color:var(--sub);font-size:0.82em;margin-bottom:12px;}
  h1{font-size:1.35em;margin:0 0 6px;color:var(--teal-dark);}
  h2{font-size:1.15em;margin:0 0 10px;color:var(--teal-dark);}
  h3{font-size:1.02em;margin:0 0 8px;color:var(--maroon);}
  p{margin:0 0 12px;}
  .muted{color:var(--sub);font-size:0.92em;}
  .center{text-align:center;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  .btn{
    display:inline-block;background:var(--teal);color:#fff;border:none;border-radius:999px;
    padding:12px 20px;font-size:0.98em;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;
  }
  .btn:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal-dark);border:2px solid var(--teal);}
  .btn.secondary:hover{background:#eef7f7;}
  .btn.gold{background:var(--gold);color:#3a2a06;}
  .btn.gold:hover{background:#b3861f;}
  .btn.danger{background:#fff;color:var(--red);border:2px solid var(--red);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn.block{display:block;width:100%;}
  .btn.small{padding:8px 14px;font-size:0.85em;}
  .judy-wrap{display:flex;justify-content:center;margin:6px 0 10px;}
  .judy{width:96px;height:110px;}
  .judy-earL,.judy-earR{transform-box:fill-box;transform-origin:50% 100%;}
  .judy-earL{animation:earL 4.2s ease-in-out infinite;}
  .judy-earR{animation:earR 4.2s ease-in-out infinite 0.4s;}
  @keyframes earL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-6deg);}}
  @keyframes earR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(6deg);}}
  .judy-body{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  .progress-outer{background:#eee3c9;border-radius:999px;height:12px;overflow:hidden;margin:8px 0;}
  .progress-inner{background:var(--teal);height:100%;border-radius:999px;transition:width 0.3s ease;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .stat-box{background:#f7f1e0;border-radius:12px;padding:10px 14px;text-align:center;}
  .stat-box .num{font-size:1.4em;font-weight:700;color:var(--teal-dark);}
  .stat-box .lbl{font-size:0.8em;color:var(--sub);}
  .banner{border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:0.92em;}
  .banner.warn{background:#fbeadb;border:1px solid #e8b978;color:#7a4a10;}
  .banner.info{background:#eaf3f4;border:1px solid #9fcfcf;color:var(--teal-dark);}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#2f7d4f;color:#fff;padding:10px 18px;border-radius:999px;font-size:0.9em;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:50;opacity:0;transition:opacity 0.3s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}
  header.testbar{
    position:sticky;top:0;z-index:10;background:var(--teal-dark);color:#fff;padding:10px 14px;border-radius:14px;
    margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header.testbar .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  header.testbar .titleline{font-weight:700;font-size:0.95em;}
  header.testbar .subline{font-size:0.78em;opacity:0.85;}
  header.testbar .progress-outer{background:rgba(255,255,255,0.25);}
  header.testbar .progress-inner{background:var(--gold);}
  .savebtn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.5);color:#fff;border-radius:999px;padding:6px 12px;font-size:0.8em;cursor:pointer;}
  .savebtn:hover{background:rgba(255,255,255,0.28);}
  .module-row{
    display:flex;align-items:center;gap:12px;background:#faf7ee;border:2px solid var(--border);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer;
  }
  .module-row:hover{border-color:var(--teal);}
  .module-row .icon{font-size:1.6em;width:38px;text-align:center;}
  .module-row .info{flex:1;}
  .module-row .mtitle{font-weight:700;color:var(--ink);font-size:0.98em;}
  .module-row .mmeta{font-size:0.78em;color:var(--sub);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.72em;font-weight:700;margin-left:6px;}
  .badge.priority{background:#fbe0e0;color:var(--red);}
  .badge.done{background:#e0f2e6;color:var(--green);}
  .badge.progress{background:#eaf3f4;color:var(--teal-dark);}
  .lesson-block{background:#faf5e8;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .lesson-block h3{margin-top:0;}
  .lesson-block ul{margin:0 0 8px;padding-left:20px;}
  .lesson-block li{margin-bottom:6px;}
  .mistake-block{background:#fff4ee;border:1px solid #f0c9a8;border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .mistake-block h3{color:var(--maroon);margin-top:0;}
  .mistake-item{border-bottom:1px dashed #e6c9ab;padding:8px 0;font-size:0.92em;}
  .mistake-item:last-child{border-bottom:none;}
  .mistake-item .yours{color:var(--red);}
  .mistake-item .fix{color:var(--green);}
  .flash{background:#eef3fb;border:2px solid #c4d6ef;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;}
  .flash .ffront{font-weight:700;color:var(--blue);margin-bottom:6px;}
  .flash .fback{display:none;color:var(--ink);border-top:1px dashed #c4d6ef;padding-top:8px;margin-top:8px;}
  .flash.flipped .fback{display:block;}
  .flash .taphint{font-size:0.75em;color:var(--sub);}
  .passage-img{max-width:100%;border-radius:10px;display:block;margin:10px auto;border:1px solid var(--border);}
  table.data-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:0.85em;}
  table.data-table th,table.data-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;}
  table.data-table th{background:#f2ead4;}
  .q-prompt{font-size:1.05em;margin-bottom:14px;}
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .opt-label{display:flex;align-items:flex-start;gap:10px;background:#faf7ee;border:2px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:0.98em;}
  .opt-label:hover{border-color:var(--teal);}
  .opt-label.selected{border-color:var(--teal);background:#eaf6f4;}
  .opt-label.correct{border-color:var(--green);background:#e9f6ec;}
  .opt-label.incorrect{border-color:var(--red);background:#fbeaea;}
  .opt-label input{margin-top:3px;}
  input[type="text"].textans{width:100%;padding:12px 14px;font-size:1em;border:2px solid var(--border);border-radius:12px;margin-bottom:16px;}
  .feedback{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:0.95em;}
  .feedback.correct{background:#e9f6ec;color:var(--green);border:1px solid #b9e0c4;}
  .feedback.incorrect{background:#fbeaea;color:var(--red);border:1px solid #eec3c3;}
  .feedback .why{color:var(--ink);font-weight:400;margin-top:6px;font-size:0.95em;}
  .group-summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.92em;}
  .group-summary-row:last-child{border-bottom:none;}
  footer.note{text-align:center;color:var(--sub);font-size:0.8em;margin-top:20px;}
  #fileOpenInput{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileOpenInput" accept="application/json,.json">

  teachingHtml:`
    <h3>The Rule</h3>
    <p>A <strong>conjunction</strong> is the connecting word itself — not the words sitting next to it. There are 3 types:</p>
    <ul>
      <li><strong>Coordinating</strong> — joins two equal ideas. Memory trick: <strong>FANBOYS</strong> = For, And, Nor, But, Or, Yet, So. These are ALWAYS coordinating.</li>
      <li><strong>Subordinating</strong> — starts a clause that can't stand alone (a reason, time, or condition). Examples: because, although, unless, since, when, while, if, after, before. Quick test: cover up that half of the sentence — if it sounds incomplete/confusing by itself, it's subordinating.</li>
      <li><strong>Correlative</strong> — always a <strong>matched PAIR</strong> working as a team, even when the words are far apart: both...and, either...or, neither...nor, not only...but also.</li>
    </ul>
    <p><strong>Fastest way to check:</strong> Is it a FANBOYS word? → Coordinating. Is it one of the pair-words (both/either/neither/not only)? → Correlative. Otherwise, if it's introducing a reason/time/condition clause → Subordinating.</p>

/* ============================================================
   STORAGE
   ============================================================ */
function storageWorks(){
  try{
    var k = "__t__" + Date.now();
    localStorage.setItem(k, "1");
    var ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
var STORAGE_OK = storageWorks();

function defaultState(){
  var mp = {};
  MODULES.forEach(function(m){
    mp[m.id] = {phase:"intro", practiceIndex:0, responses:{}, correct:0, total:0, seenIntro:false};
  });
  return {
    version:1,
    startedAt: Date.now(),
    lastSavedAt: null,
    moduleProgress: mp
  };
}

function loadState(){
  if(!STORAGE_OK) return defaultState();
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object" || !parsed.moduleProgress) return defaultState();
    var d = defaultState();
    MODULES.forEach(function(m){
      if(parsed.moduleProgress[m.id]) d.moduleProgress[m.id] = parsed.moduleProgress[m.id];
    });
    d.startedAt = parsed.startedAt || d.startedAt;
    return d;
  }catch(e){ return defaultState(); }
}

function saveState(){
  state.lastSavedAt = Date.now();
  if(!STORAGE_OK) return false;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){ return false; }
}

var state = loadState();

document.addEventListener("visibilitychange", function(){ if(document.hidden) saveState(); });
window.addEventListener("pagehide", function(){ saveState(); });

/* ============================================================
   MANUAL SAVE / OPEN (file-based, iOS-safe)
   ============================================================ */
function manualSave(){
  saveState();
  var payload = JSON.stringify(state, null, 2);
  var fname = "shareefah_iowa_review_progress.json";
  var blob = new Blob([payload], {type:"application/json"});
  var file = null;
  try{ file = new File([blob], fname, {type:"application/json"}); }catch(e){ file = null; }

  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:"Shareefah's Iowa Review Progress"})
      .then(function(){ showToast("💾 Saved! Choose Save to Files to keep it."); })
      .catch(function(){ fallbackDownload(blob, fname); });
  } else {
    fallbackDownload(blob, fname);
  }
}
function fallbackDownload(blob, fname){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast("💾 Progress file downloaded — tap 'Save to Files' if prompted.");
}

function manualOpen(){
  document.getElementById("fileOpenInput").click();
}
document.getElementById("fileOpenInput").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!parsed || !parsed.moduleProgress) throw new Error("bad file");
      var d = defaultState();
      MODULES.forEach(function(m){
        if(parsed.moduleProgress[m.id]) d.moduleProgress[m.id] = parsed.moduleProgress[m.id];
      });
      d.startedAt = parsed.startedAt || d.startedAt;
      state = d;
      saveState();
      showToast("📂 Progress restored!");
      renderHome();
    }catch(err){
      showToast("⚠️ That file couldn't be read. Please choose a saved progress file.");
    }
  };
  reader.readAsText(f);
  e.target.value = "";
});

/* ============================================================
   GRADING HELPERS
   ============================================================ */
function normalize(s){
  return String(s || "").toLowerCase().replace(/[.,'"!?;:()\/\\-]/g," ").replace(/\s+/g," ").trim();
}
function gradeQuestion(q, answer){
  if(q.type === "mc") return Number(answer) === Number(q.correct);
  if(q.type === "text"){
    var norm = normalize(answer);
    return (q.accept || []).some(function(a){ return normalize(a) === norm; });
  }
  return null;
}
function correctAnswerDisplay(q){
  if(q.type === "mc") return q.options[q.correct];
  if(q.type === "text") return (q.accept || [])[0] || "";
  return "";
}

function findModule(id){
  for(var i=0;i<MODULES.length;i++) if(MODULES[i].id === id) return MODULES[i];

}

function enterModule(mid){
  var m = findModule(mid);
  var mp = state.moduleProgress[mid];
  if(mp.phase === "practice"){
    renderPractice(m);
  } else if(mp.phase === "done"){
    renderModuleDone(m);
  } else {
    renderIntro(m);
  }
}

  html += '<div class="lesson-block">' + m.teachingHtml + '</div>';

  if(m.mistakesHtml){
    html += '<div class="mistake-block"><h3>🔍 What tripped ' + STUDENT + ' up</h3>' + m.mistakesHtml + '</div>';
  }

  if(m.flashcards && m.flashcards.length){
    html += '<div class="card"><h3>🃏 Quick Flashcards — tap each to flip</h3>';
    m.flashcards.forEach(function(fc, i){
      html += '<div class="flash" data-fc="' + i + '"><div class="ffront">' + fc.front + '</div><div class="fback">' + fc.back + '</div><div class="taphint">(tap to flip)</div></div>';
    });
    html += '</div>';
  }

  html += '<div class="card center">';
  html += '<button class="btn block" id="btnBeginPractice">Begin Practice ▶️</button>';
  html += '<div style="height:8px"></div>';
  html += '<button class="btn secondary block" id="btnBackHome">🏠 Back to Home</button>';
  html += '</div>';

  app.innerHTML = html;
  wireHeaderSave();

  document.querySelectorAll(".flash").forEach(function(f){
    f.addEventListener("click", function(){ f.classList.toggle("flipped"); });
  });

  document.getElementById("btnBeginPractice").onclick = function(){
    mp.phase = "practice";
    mp.practiceIndex = 0;
    mp.seenIntro = true;
    saveState();
    renderPractice(m);
  };
  document.getElementById("btnBackHome").onclick = renderHome;
}

/* ============================================================
   PRACTICE FLOW
   ============================================================ */
function renderPractice(m){
  startReminder();
  var mp = state.moduleProgress[m.id];
  if(mp.practiceIndex >= m.practice.length){
    mp.phase = "done";
    saveState();
    renderModuleDone(m);
    return;
  }
  var q = m.practice[mp.practiceIndex];
  var qid = "p" + mp.practiceIndex;
  var existing = mp.responses[qid];

  var html = "";
  html += moduleHeaderHTML(m, "Practice " + (mp.practiceIndex+1) + " of " + m.practice.length);
  html += '<div class="card">';

  if(q.passageHtml && mp.practiceIndex === (q.passageStartIndex || 0)){
    html += '<div class="lesson-block">' + q.passageHtml + '</div>';
  }

  html += '<div class="q-prompt">' + q.prompt + '</div>';

  if(q.type === "mc"){
    html += '<div class="options" id="optWrap">';
    q.options.forEach(function(opt, i){
      var sel = existing && Number(existing.answer) === i;
      html += '<label class="opt-label' + (sel?" selected":"") + '" data-idx="' + i + '"><input type="radio" name="mcopt" value="' + i + '"' + (sel?" checked":"") + '><span>' + opt + '</span></label>';
    });
    html += '</div>';
  } else {
    html += '<input type="text" class="textans" id="txtAns" placeholder="Type your answer here" value="' + (existing ? String(existing.answer).replace(/"/g,'&quot;') : "") + '">';
  }

  html += '<div id="feedbackArea"></div>';
  html += '<button class="btn block" id="btnSubmit">Check Answer</button>';
  html += '</div>';
  app.innerHTML = html;
  wireHeaderSave();

  if(q.type === "mc"){
    var labels = document.querySelectorAll("#optWrap .opt-label");
    labels.forEach(function(lbl){
      lbl.addEventListener("click", function(){
        labels.forEach(function(l){ l.classList.remove("selected"); });
        lbl.classList.add("selected");
        lbl.querySelector("input").checked = true;
      });
    });
  }

  document.getElementById("btnSubmit").onclick = function(){ submitPractice(m, q, qid); };
}

function submitPractice(m, q, qid){
  var mp = state.moduleProgress[m.id];
  var answer;
  if(q.type === "mc"){
    var checked = document.querySelector('#optWrap input[name="mcopt"]:checked');
    if(!checked){ showToast("Please choose an answer first."); return; }
    answer = Number(checked.value);
  } else {
    answer = document.getElementById("txtAns").value;
    if(!answer.trim()){ showToast("Please type an answer first."); return; }
  }

  var correct = gradeQuestion(q, answer);
  if(!mp.responses[qid]){
    mp.total++;
    if(correct) mp.correct++;
  } else {
    if(mp.responses[qid].correct !== correct){
      if(correct) mp.correct++; else mp.correct--;
    }
  }
  mp.responses[qid] = {answer:answer, correct:correct};
  saveState();

  var fbHtml = '<div class="feedback ' + (correct?"correct":"incorrect") + '">' +
    (correct ? "✅ Correct!" : "❌ Not quite — correct answer: " + correctAnswerDisplay(q)) +
    (q.explanation ? '<div class="why">💡 ' + q.explanation + '</div>' : '') +
    '</div>';
  document.getElementById("feedbackArea").innerHTML = fbHtml;

  if(q.type === "mc"){
    document.querySelectorAll("#optWrap .opt-label").forEach(function(lbl, i){
      lbl.querySelector("input").disabled = true;
      if(i === q.correct) lbl.classList.add("correct");
      else if(Number(answer) === i) lbl.classList.add("incorrect");
    });
  } else {
    document.getElementById("txtAns").disabled = true;
  }

  var btn = document.getElementById("btnSubmit");
  btn.textContent = "Continue ▶️";
  btn.onclick = function(){
    mp.practiceIndex++;
    saveState();
    renderPractice(m);
  };
}

/* ============================================================
   MODULE DONE
   ============================================================ */
function renderModuleDone(m){
  stopReminder();
  var mp = state.moduleProgress[m.id];
  var pct = mp.total ? Math.round((mp.correct/mp.total)*100) : 0;
  var idx = MODULES.findIndex(function(x){ return x.id === m.id; });
  var next = MODULES[idx+1];

  var msg;
  if(pct >= 90) msg = "Mā shā\' Allāh! You've really got this down now.";
  else if(pct >= 70) msg = "Great progress, alhamdulillāh! This is looking much stronger.";
  else msg = "Good effort! In shā\' Allāh, look over the lesson above once more before moving on.";

  var html = "";
  html += '<div class="card center">';
  html += judySVG(90);
  html += '<h2>🎉 ' + m.title + ' — Complete!</h2>';
  html += '<div class="stat-grid"><div class="stat-box"><div class="num">' + mp.correct + '/' + mp.total + '</div><div class="lbl">This round</div></div><div class="stat-box"><div class="num">' + pct + '%</div><div class="lbl">Score</div></div></div>';
  html += '<p>' + msg + '</p>';
  html += '<div class="row" style="justify-content:center">';
  html += '<button class="btn secondary" id="btnRedo">🔄 Practice Again</button>';
  html += '<button class="btn gold" id="btnSaveDone">💾 Save Progress</button>';
  html += '</div>';
  html += '<div style="height:10px"></div>';
  if(next) html += '<button class="btn block" id="btnNext">Next: ' + next.icon + ' ' + next.title + ' ▶️</button><div style="height:8px"></div>';
  html += '<button class="btn secondary block" id="btnHome2">🏠 Back to Home</button>';
  html += '</div>';
  app.innerHTML = html;

  document.getElementById("btnRedo").onclick = function(){
    if(confirm("Practice this section again? Your score for it will reset.")){
      mp.phase = "intro"; mp.practiceIndex = 0; mp.responses = {}; mp.correct = 0; mp.total = 0;
      saveState();
      renderIntro(m);
    }
  };
  document.getElementById("btnSaveDone").onclick = manualSave;
  if(next) document.getElementById("btnNext").onclick = function(){ enterModule(next.id); };
  document.getElementById("btnHome2").onclick = renderHome;
}

/* ============================================================
   INIT
   ============================================================ */
renderHome();
</script>
</body>
</html>
