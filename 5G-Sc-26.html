<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Judy's Science Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EA;
    --cream-2:#F3ECDC;
    --plum:#3A2E4D;
    --plum-soft:#6b5d80;
    --white:#FFFFFF;
    --green:#4FA974;      /* Life Land */
    --green-dark:#3A8058;
    --amber:#F2A93B;      /* Energy & Matter Land */
    --amber-dark:#CE871E;
    --clay:#C1783F;       /* Earth & Sky Land */
    --clay-dark:#9C5C29;
    --indigo:#6C5CE7;     /* Space & Inquiry Land */
    --indigo-dark:#4E3FC4;
    --eye:#8B5FBF;
    --pink:#E8698A;
    --sky:#4FB6E8;
    --ok:#4FA974;
    --bad:#E8698A;
    --shadow-plum: rgba(58,46,77,0.18);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.6), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(111,191,115,0.12), transparent 45%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--plum);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  #app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---------- TOP BAR ---------- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:var(--white);
    border-bottom:3px solid var(--cream-2);
    position:sticky;
    top:0;
    z-index:50;
  }
  #topbar .brand{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  #topbar .brand svg{width:38px;height:38px;}
  #topbar .brand span{font-family:'Baloo 2';font-weight:700;font-size:1.05rem;color:var(--plum);}
  #topbar .actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    background:var(--cream-2);
    border:none;
    border-radius:50%;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:1.15rem;
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);background:#EFE6CE;}
  .icon-btn:active{transform:translateY(0);}
  .streak-chip{
    display:flex;align-items:center;gap:4px;
    background:linear-gradient(135deg, var(--amber), var(--amber-dark));
    color:white;font-weight:800;font-family:'Baloo 2';
    padding:6px 12px;border-radius:20px;font-size:0.9rem;
    box-shadow:0 3px 0 var(--amber-dark);
  }
  /* ---------- VIEWS ---------- */
  .view{display:none;flex:1;padding:18px 16px 90px;animation:fadeIn .35s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- HOME / TRAIL ---------- */
  .hero-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:0 8px 0 var(--shadow-plum);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .hero-card h1{margin:0 0 4px;font-size:1.4rem;color:var(--plum);}
  .hero-card p{margin:0;color:var(--plum-soft);font-weight:600;font-size:.95rem;}
  .trail-wrap{margin-top:10px;}
  .land-list{display:flex;flex-direction:column;gap:14px;}
  .land-card{
    background:var(--white);
    border-radius:var(--radius-md);
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 5px 0 var(--shadow-plum);
    cursor:pointer;
    border:3px solid transparent;
    transition:transform .15s ease;
  }
  .land-card:hover{transform:translateY(-2px);}
  .land-card:active{transform:translateY(1px);}
  .land-emoji{
    width:56px;height:56px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;flex-shrink:0;
  }
  .land-info{flex:1;min-width:0;}
  .land-info h3{margin:0 0 4px;font-size:1.05rem;}
  .land-info .sub{font-size:.82rem;color:var(--plum-soft);font-weight:700;}
  .progress-track{
    background:var(--cream-2);
    height:10px;border-radius:6px;overflow:hidden;margin-top:6px;
  }
  .progress-fill{height:100%;border-radius:6px;transition:width .4s ease;}
  .chev{font-size:1.3rem;color:var(--plum-soft);}

  /* ---------- WARDROBE QUEST (home page motivator) ---------- */
  .quest-card{
    background:linear-gradient(135deg,#2E2545,#4A3B6B);
    border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:20px;
    display:flex;align-items:center;gap:14px;color:white;
    box-shadow:0 8px 0 rgba(58,46,77,0.35);cursor:pointer;
    position:relative;overflow:hidden;
  }
  .quest-card:before{
    content:"✨";position:absolute;font-size:5rem;opacity:.08;right:-10px;top:-16px;
  }
  .quest-silhouette{
    width:64px;height:96px;flex-shrink:0;position:relative;
  }
  .quest-silhouette svg{filter:brightness(0) invert(1);opacity:.9;width:100%;height:100%;}
  .quest-silhouette .lock-icon{
    position:absolute;bottom:2px;right:-2px;background:var(--amber);
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.9rem;box-shadow:0 2px 0 var(--amber-dark);
  }
  .quest-info{flex:1;}
  .quest-info .eyebrow{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.75;}
  .quest-info h3{margin:2px 0 6px;font-size:1.05rem;font-family:'Baloo 2';}
  .quest-track{background:rgba(255,255,255,0.18);height:10px;border-radius:6px;overflow:hidden;}
  .quest-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#F2A93B,#FFD27A);transition:width .4s ease;}
  .quest-info .quest-sub{font-size:.78rem;font-weight:700;margin-top:5px;opacity:.85;}
  .quest-card.all-done{background:linear-gradient(135deg,var(--green),var(--green-dark));}

  /* ---------- UNLOCK CELEBRATION MODAL ---------- */
  #unlockModal{
    position:fixed;inset:0;background:rgba(58,46,77,0.55);z-index:400;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  #unlockModal.show{display:flex;}
  .unlock-card{
    background:var(--white);border-radius:28px;padding:28px 24px;text-align:center;
    max-width:340px;box-shadow:0 14px 0 rgba(58,46,77,0.3);animation:popIn .4s ease;
  }
  @keyframes popIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .unlock-card h2{font-size:1.3rem;margin:8px 0 4px;color:var(--plum);}
  .unlock-card p{font-weight:700;color:var(--plum-soft);margin:0 0 16px;font-size:.92rem;}

  /* ---------- PEEK AT LESSON DRAWER ---------- */
  #peekModal{
    position:fixed;inset:0;background:rgba(58,46,77,0.5);z-index:350;
    display:none;align-items:flex-end;justify-content:center;
  }
  #peekModal.show{display:flex;}
  .peek-sheet{
    background:var(--cream);width:100%;max-width:720px;max-height:82vh;
    border-radius:26px 26px 0 0;display:flex;flex-direction:column;
    animation:slideUp .3s ease;box-shadow:0 -10px 30px rgba(0,0,0,.2);
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .peek-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;font-family:'Baloo 2';font-weight:800;color:var(--plum);
    border-bottom:3px solid var(--cream-2);flex-shrink:0;
  }
  .peek-body{overflow-y:auto;padding:16px 18px 28px;}
  .peek-body .btn-row{display:none;}

  /* ---------- LAND VIEW ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{
    background:var(--white);border:none;border-radius:12px;
    padding:8px 14px;font-weight:800;font-family:'Baloo 2';
    cursor:pointer;box-shadow:0 3px 0 var(--shadow-plum);color:var(--plum);
  }
  .module-grid{display:flex;flex-direction:column;gap:12px;}
  .module-row{
    background:var(--white);border-radius:16px;padding:14px 16px;
    display:flex;align-items:center;gap:12px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow-plum);
  }
  .module-status{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.85rem;color:white;background:#D8CFBE;
  }
  .module-status.done{background:var(--green);}
  .module-status.review{background:var(--amber);}
  .module-row .m-title{font-weight:800;font-family:'Baloo 2';font-size:1rem;flex:1;}

  /* ---------- LESSON VIEW ---------- */
  .judy-speech-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;}
  .judy-speech-row .judy-avatar{width:76px;height:76px;flex-shrink:0;}
  .bubble{
    background:var(--white);border-radius:18px;padding:14px 16px;
    box-shadow:0 5px 0 var(--shadow-plum);position:relative;font-weight:700;color:var(--plum);
    flex:1;
  }
  .bubble:before{
    content:"";position:absolute;left:-8px;top:20px;
    border-width:8px 10px 8px 0;border-style:solid;
    border-color:transparent var(--white) transparent transparent;
  }
  .lesson-card{
    background:var(--white);border-radius:var(--radius-lg);padding:20px;
    box-shadow:0 8px 0 var(--shadow-plum);margin-bottom:16px;
  }
  .lesson-card h2{margin-top:0;font-size:1.3rem;}
  .lesson-card p{line-height:1.6;font-weight:600;color:#4a3d5c;}
  .fun-fact{
    background:linear-gradient(135deg,#FFF3D6,#FFE8B8);
    border-radius:14px;padding:12px 14px;font-weight:700;font-size:.92rem;
    margin:14px 0;border:2px dashed var(--amber);
  }
  .vocab{
    text-decoration:underline dotted var(--indigo);text-decoration-thickness:2px;
    color:var(--indigo-dark);font-weight:800;cursor:pointer;position:relative;
  }
  .popover{
    position:absolute;bottom:130%;left:0;background:var(--plum);color:white;
    padding:10px 12px;border-radius:12px;font-size:.85rem;font-weight:700;
    width:220px;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.25);display:none;
  }
  .popover.show{display:block;}
  .popover button{
    margin-top:6px;background:rgba(255,255,255,.18);border:none;color:white;
    border-radius:8px;padding:4px 8px;cursor:pointer;font-weight:800;font-size:.78rem;
  }
  .diagram-box{
    background:var(--cream-2);border-radius:18px;padding:14px;margin:14px 0;
    display:flex;justify-content:center;
  }
  .diagram-box svg{max-width:100%;height:auto;}
  .photo-diagram{border-radius:16px;overflow:hidden;background:white;}
  .photo-diagram img{width:100%;height:auto;display:block;max-height:340px;object-fit:cover;}
  .photo-diagram .caption-strip{
    background:var(--plum);color:white;padding:10px 14px;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
    font-weight:800;font-family:'Baloo 2';font-size:.82rem;text-align:center;
  }
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;}
  .photo-grid figure{margin:0;border-radius:14px;overflow:hidden;background:white;}
  .photo-grid img{width:100%;height:110px;object-fit:cover;display:block;}
  .photo-grid figcaption{
    background:var(--cream-2);color:var(--plum);font-weight:800;font-family:'Baloo 2';
    font-size:.78rem;text-align:center;padding:6px 4px;
  }
  .photo-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .photo-strip figure{margin:0;flex:0 0 auto;width:120px;border-radius:14px;overflow:hidden;background:white;}
  .photo-strip img{width:120px;height:100px;object-fit:cover;display:block;}
  .photo-strip figcaption{
    background:var(--cream-2);color:var(--plum);font-weight:800;font-family:'Baloo 2';
    font-size:.72rem;text-align:center;padding:5px 3px;
  }
  .photo-strip .arrow-between{align-self:center;font-size:1.3rem;color:var(--plum-soft);flex:0 0 auto;}
  .photo-credit{font-size:.7rem;color:var(--plum-soft);font-weight:700;margin-top:4px;text-align:right;}
  .hunch-box{
    background:linear-gradient(135deg,#EDE7FB,#E2D9FA);
    border-radius:16px;padding:14px 16px;margin-bottom:14px;border:2px solid var(--indigo);
  }
  .hunch-box .label{font-family:'Baloo 2';font-weight:800;color:var(--indigo-dark);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;}
  .btn{
    font-family:'Baloo 2';font-weight:700;border:none;border-radius:14px;
    padding:12px 20px;cursor:pointer;font-size:1rem;color:white;
    box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--green-dark));}
  .btn.ghost{background:var(--cream-2);color:var(--plum);box-shadow:0 4px 0 #ddd2b8;}
  .btn.indigo{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  /* ---------- HINT LADDER ---------- */
  .hint-box{
    background:#FFF;border:2px solid var(--cream-2);border-radius:16px;
    padding:12px 14px;margin-top:12px;
  }
  .hint-reveal{
    margin-top:8px;padding:10px 12px;background:var(--cream-2);border-radius:10px;
    font-weight:700;font-size:.92rem;display:none;
  }
  .hint-reveal.show{display:block;animation:fadeIn .3s ease;}

  /* ---------- QUIZ VIEW ---------- */
  .quiz-progress{display:flex;gap:6px;margin-bottom:16px;}
  .quiz-progress .dot{flex:1;height:8px;border-radius:6px;background:var(--cream-2);}
  .quiz-progress .dot.active{background:var(--indigo);}
  .quiz-progress .dot.correct{background:var(--green);}
  .quiz-progress .dot.wrong{background:var(--pink);}
  .q-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;box-shadow:0 8px 0 var(--shadow-plum);}
  .q-card .qtype{font-size:.75rem;font-weight:800;color:var(--plum-soft);text-transform:uppercase;letter-spacing:.05em;}
  .q-card h3{margin:6px 0 16px;font-size:1.12rem;line-height:1.4;}
  .choice{
    display:block;width:100%;text-align:left;background:var(--cream-2);
    border:3px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:10px;
    font-weight:700;font-family:'Nunito';font-size:.98rem;cursor:pointer;color:var(--plum);
  }
  .choice:hover{border-color:#D8CFBE;}
  .choice.selected-correct{background:#DFF3E5;border-color:var(--green);}
  .choice.selected-wrong{background:#FBE3EA;border-color:var(--pink);}
  .choice.reveal-correct{background:#DFF3E5;border-color:var(--green);}
  .choice[disabled]{cursor:default;}
  .feedback{
    margin-top:14px;padding:14px;border-radius:14px;font-weight:700;
    display:flex;gap:10px;align-items:flex-start;
  }
  .feedback.good{background:#DFF3E5;color:var(--green-dark);}
  .feedback.think{background:#FDF0DD;color:var(--amber-dark);}
  .feedback svg{width:34px;height:34px;flex-shrink:0;}

  /* match question */
  .match-wrap{display:flex;gap:14px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
  .match-item{
    background:var(--cream-2);border-radius:12px;padding:10px 12px;font-weight:700;
    cursor:pointer;border:3px solid transparent;font-size:.9rem;text-align:center;
  }
  .match-item.sel{border-color:var(--indigo);background:#EDE7FB;}
  .match-item.paired-correct{background:#DFF3E5;border-color:var(--green);}
  .match-item.paired-wrong{background:#FBE3EA;border-color:var(--pink);}

  /* true/false */
  .tf-row{display:flex;gap:12px;}
  .tf-row .choice{flex:1;text-align:center;}

  /* ---------- WARDROBE ---------- */
  .wardrobe-stage{
    background:var(--white);border-radius:var(--radius-lg);padding:24px;text-align:center;
    box-shadow:0 8px 0 var(--shadow-plum);margin-bottom:18px;
  }
  .wardrobe-stage svg{width:220px;height:220px;}
  .outfit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .outfit-card{
    background:var(--white);border-radius:16px;padding:14px 8px;text-align:center;
    cursor:pointer;border:3px solid transparent;box-shadow:0 4px 0 var(--shadow-plum);
    font-weight:800;font-family:'Baloo 2';font-size:.85rem;
  }
  .outfit-card.active{border-color:var(--indigo);background:#EDE7FB;}
  .outfit-card.locked{opacity:.55;cursor:pointer;position:relative;}
  .outfit-card.locked .swatch{filter:grayscale(1);}
  .outfit-card .lock-tag{
    display:block;font-size:.65rem;font-weight:800;color:var(--plum-soft);
    margin-top:3px;text-transform:none;
  }
  .outfit-card .swatch{font-size:1.7rem;margin-bottom:4px;}
  .lock-note{font-size:.72rem;color:var(--plum-soft);font-weight:700;margin-top:4px;}

  /* ---------- SIM (states of matter) ---------- */
  .sim-box{
    background:linear-gradient(180deg,#EAF6FB,#DFF0F8);border-radius:18px;padding:16px;margin:14px 0;
    position:relative;
  }
  .sim-canvas-wrap{
    position:relative;background:white;border-radius:14px;height:200px;overflow:hidden;
    border:3px solid #cfe6ee;
  }
  .sim-particle{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:var(--sky);box-shadow:0 0 0 3px rgba(79,182,232,0.25);
  }
  .sim-slider-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .sim-slider-row input[type=range]{flex:1;accent-color:var(--pink);}
  .sim-label{
    font-family:'Baloo 2';font-weight:800;text-align:center;margin-top:8px;font-size:1rem;
  }
  .state-chip{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:.85rem;
    font-weight:800;color:white;margin-top:4px;
  }

  /* ---------- BOTTOM NAV ---------- */
  #bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--white);border-top:3px solid var(--cream-2);
    display:flex;justify-content:center;padding:8px 0;z-index:60;
  }
  #bottomnav .inner{max-width:720px;width:100%;display:flex;justify-content:space-around;}
  .nav-btn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--plum-soft);font-weight:800;font-family:'Baloo 2';font-size:.72rem;cursor:pointer;
    padding:4px 10px;border-radius:10px;
  }
  .nav-btn.active{color:var(--indigo);background:#EDE7FB;}
  .nav-btn .ic{font-size:1.3rem;}

  /* Judy mascot idle animation */
  .judy-idle{transform-origin:50% 90%;animation:judyBreathe 2.6s ease-in-out infinite;}
  @keyframes judyBreathe{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-3px) scale(1.015);}
  }
  .judy-ear-wiggle{transform-origin:50% 100%;animation:earWiggle 3.4s ease-in-out infinite;}
  @keyframes earWiggle{
    0%,100%{transform:rotate(0deg);}
    45%{transform:rotate(-3deg);}
    55%{transform:rotate(2deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .judy-idle, .judy-ear-wiggle{animation:none;}
  }

  /* confetti canvas */
  #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:200;}

  /* toast */
  #toast{
    position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);
    background:var(--plum);color:white;padding:10px 18px;border-radius:14px;
    font-weight:800;font-family:'Baloo 2';z-index:300;transition:transform .3s ease;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  #toast.show{transform:translate(-50%,0);}

  .lock-badge{font-size:.7rem;background:var(--cream-2);color:var(--plum-soft);padding:3px 8px;border-radius:10px;font-weight:800;}

  /* signs-in-creation callout */
  .signs-box{
    background:linear-gradient(135deg,#F1FBF3,#E3F5E7);
    border:2px dashed var(--green);border-radius:14px;padding:12px 14px;margin:14px 0;
  }
  .signs-box .label{font-family:'Baloo 2';font-weight:800;color:var(--green-dark);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;}
  .quran-embed-wrap{margin:10px 0;border-radius:14px;overflow:hidden;background:white;min-height:150px;}
  .quran-embed-wrap iframe{display:block;min-height:150px;border:none;}

  ::selection{background:var(--eye);color:white;}
</style>
</head>
<body>

/* =====================================================
   SOUND (Web Audio API — synthesized, no files)
===================================================== */
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, start, dur, type='sine', gain=0.18){
  if(state.muted) return;
  const c = ac();
  const t0 = c.currentTime + start;
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

/* =====================================================

===================================================== */
function launchConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const colors = ['#6C5CE7','#4FA974','#F2A93B','#E8698A','#4FB6E8'];
  let particles = Array.from({length:70}, ()=>({
    x: Math.random()*canvas.width, y:-20-Math.random()*200,
    vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
    size: 5+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360, vr: -6+Math.random()*12
  }));
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ return; }
  let frames=0;
  function step(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    frames++;
    if(frames<140) requestAnimationFrame(step); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  step();
}

    lessonHTML:`
      <h2>Your Body's Amazing Teamwork</h2>
      <p>Your body is made of several <span class="vocab" data-term="bodysystem">body systems</span> — groups of organs that work together to do a job. None of them work alone; they constantly depend on each other.</p>
      <p>The <span class="vocab" data-term="digestive">digestive system</span> breaks the food you eat into tiny nutrients your body can use. The <span class="vocab" data-term="circulatory">circulatory system</span> — your heart and blood vessels — carries those nutrients (and oxygen) to every cell in your body. The <span class="vocab" data-term="respiratory">respiratory system</span> — your lungs — brings in oxygen from the air and removes carbon dioxide. The <span class="vocab" data-term="skeletal">skeletal system</span> (your bones) supports your body and protects organs like your brain and heart, while the <span class="vocab" data-term="muscular">muscular system</span> lets you move. The <span class="vocab" data-term="nervous">nervous system</span> — your brain, spinal cord, and nerves — sends fast messages so all these systems know what to do and when.</p>

          <figure><img src="images/brain-model.jpg" alt="Labeled 9-part human brain model"><figcaption>Nervous</figcaption></figure>

      </div>
      <p>That's why running makes your heart and lungs work harder together: your muscles suddenly need much more oxygen and energy, so your circulatory and respiratory systems speed up to deliver it.</p>

    lessonHTML:`
      <h2>Who Eats Whom? Energy in an Ecosystem</h2>
      <p>An <span class="vocab" data-term="ecosystem">ecosystem</span> is a community of living things (plants, animals, fungi, bacteria) interacting with each other and their non-living surroundings (sunlight, water, soil, air) in one place.</p>
      <p>Energy flows through an ecosystem in a <span class="vocab" data-term="foodchain">food chain</span>: <span class="vocab" data-term="producer">producers</span> (plants) use sunlight to make their own food, <span class="vocab" data-term="consumer">consumers</span> (animals) eat producers or other consumers for energy, and <span class="vocab" data-term="decomposer">decomposers</span> (like mushrooms and bacteria) break down dead plants and animals, returning nutrients to the soil. Since most animals eat more than one kind of food, many overlapping food chains link together into a <span class="vocab" data-term="foodweb">food web</span>.</p>
      <div class="diagram-box">
        <p style="font-weight:800;font-family:'Baloo 2';text-align:center;margin:0 0 8px;color:var(--plum-soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;">A forest food chain, real photo by real photo</p>
        <div class="photo-strip">
          <figure><img src="https://cdn.pixabay.com/photo/2014/03/21/15/01/oak-tree-292111_1280.jpg" alt="A large real oak tree"><figcaption>Oak tree<br>(producer)</figcaption></figure>
          <span class="arrow-between">→</span>
          <figure><img src="images/foodweb-beetle.jpg" alt="A real beetle on a leaf"><figcaption>Beetle<br>(primary consumer)</figcaption></figure>
          <span class="arrow-between">→</span>
          <figure><img src="images/foodweb-mouse.jpg" alt="A real field mouse"><figcaption>Field mouse<br>(primary consumer)</figcaption></figure>
          <span class="arrow-between">→</span>
          <figure><img src="images/foodweb-fox.jpg" alt="A real fox in a forest"><figcaption>Fox<br>(secondary consumer)</figcaption></figure>
          <span class="arrow-between">→</span>
          <figure><img src="https://cdn.pixabay.com/photo/2021/06/08/00/00/wolf-6319260_1280.jpg" alt="A real gray wolf"><figcaption>Wolf<br>(tertiary consumer)</figcaption></figure>
          <span class="arrow-between">→</span>
          <figure><img src="images/foodweb-mushroom.jpg" alt="Real mushrooms decomposing on a forest floor"><figcaption>Mushroom<br>(decomposer)</figcaption></figure>

      </div>
      <p>That's why removing even one animal — like all the foxes — can ripple through a whole ecosystem: without foxes eating them, the rabbit population could grow too large and eat too much grass, which then affects every other animal that depends on that grass.</p>

        </div>
        <p style="margin:6px 0 0;">This ayah describes animals as organized "communities" — which is exactly how scientists describe an ecosystem: an organized community of living things depending on one another.</p>
      </div>

    lessonHTML:`
      <h2>Built to Survive</h2>
      <p>An <span class="vocab" data-term="adaptation">adaptation</span> is a feature or behavior that helps a living thing survive in its environment. Adaptations can be <span class="vocab" data-term="structural">structural</span> (a physical body part, like thick fur, sharp claws, or a long neck) or <span class="vocab" data-term="behavioral">behavioral</span> (something an animal does, like migrating, hibernating, or building a nest).</p>
      <p>Some behaviors are <span class="vocab" data-term="instinct">instincts</span> — behaviors an animal is simply born knowing how to do, without ever being taught. A spider doesn't need lessons to spin a web, and a sea turtle hatchling doesn't need to be shown the way to the ocean.</p>

      <p>Camouflage (blending into surroundings), mimicry (looking like something dangerous or unappetizing), and migration (traveling long distances for food or better weather) are all common adaptation strategies you'll find across nearly every ecosystem on Earth.</p>

      <h2>From Egg to Adult</h2>

      <p>Some insects, like butterflies, go through <span class="vocab" data-term="completemeta">complete metamorphosis</span>: egg → <span class="vocab" data-term="larva">larva</span> (caterpillar) → <span class="vocab" data-term="pupa">pupa</span> (chrysalis) → adult. Each stage looks completely different from the last! Other insects, like grasshoppers, go through <span class="vocab" data-term="incompletemeta">incomplete metamorphosis</span>: egg → nymph → adult, where the nymph already looks like a small version of the adult.</p>

    lessonHTML:`
      <h2>Sorting the Living World</h2>

      <p>One of the biggest splits is between <span class="vocab" data-term="vertebrate">vertebrates</span> (animals with a backbone — fish, amphibians, reptiles, birds, and mammals) and <span class="vocab" data-term="invertebrate">invertebrates</span> (animals without a backbone — insects, worms, jellyfish, and more; in fact, over 95% of all known animal species are invertebrates!).</p>

      </div>
      <p>Scientists also classify animals by how they move (legs, wings, fins), how they breathe (lungs, gills), whether they're warm-blooded or cold-blooded, and how their young are born or hatched.</p>
      <div class="fun-fact">🌟 Fun fact: A whale is a mammal, not a fish — even though it lives in water and looks fish-like — because it's warm-blooded, breathes air with lungs, and nurses its young.</div>

    lessonHTML:`
      <h2>What You're Born With vs. What You Learn</h2>
      <p>An <span class="vocab" data-term="inherited">inherited trait</span> is a characteristic passed down from parents to offspring — you didn't choose it or learn it, you were simply born with it. Eye color, hair type, blood type, and attached vs. unattached earlobes are all classic examples.</p>
      <p>A <span class="vocab" data-term="learned">learned (acquired) trait</span> is something you develop during your life through experience, practice, or your environment — like knowing how to ride a bike, speaking a certain language, or even a scar from an old injury.</p>
      <div class="diagram-box">
        <div class="photo-diagram">
          <img src="images/heredity-freckles.jpg" alt="Close-up of freckles on skin, a real inherited trait">
          <div class="caption-strip">🧬 Freckles are an inherited trait — passed down, not learned</div>
        </div>

function landModules(landId){ return MODULES.filter(m=>m.land===landId); }
function landProgress(landId){
  const mods = landModules(landId);
  if(mods.length===0) return 0;
  const done = mods.filter(m=>state.completed[m.id]).length;
  return Math.round(done/mods.length*100);
}
function landDoneCount(landId){
  const mods = landModules(landId);
  return {done: mods.filter(m=>state.completed[m.id]).length, total: mods.length};
}
function landComplete(landId){
  const mods = landModules(landId);
  return mods.length>0 && mods.every(m=>state.completed[m.id]);
}

let cachedVoices = [];
function refreshVoices(){
  const v = speechSynthesis.getVoices();
  if(v && v.length) cachedVoices = v;
}
if('speechSynthesis' in window){
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickBestVoice(){
  if(!cachedVoices.length) refreshVoices();
  // Preference order: explicitly enhanced/premium/neural US voices first,
  // then well-known higher-quality default names on iOS/macOS Safari,
  // then any US English voice, then any English voice at all.
  const rank = [
    /en-US.*(Enhanced|Premium|Neural)/i,
    /(Enhanced|Premium|Neural)/i,
    /^(Samantha|Ava|Nicky|Allison|Susan)$/i,
    /Samantha|Ava|Nicky|Allison|Susan/i,
    /en-US/i,
    /^en/i
  ];
  for(const pattern of rank){
    const match = cachedVoices.find(v=>pattern.test(v.name) || pattern.test(v.lang));
    if(match) return match;
  }
  return null;
}
function speakTerm(e, term){
  e.stopPropagation();
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); // stop any overlapping speech from a previous tap
  const utter = new SpeechSynthesisUtterance(term);
  utter.lang = 'en-US';
  const preferred = pickBestVoice();
  if(preferred) utter.voice = preferred;
  utter.rate = 0.82;
  utter.pitch = 1.0;
  speechSynthesis.speak(utter);
}

/* ---- states of matter simulation ---- */
let simParticles = [];
function initSim(){
  const wrap = document.getElementById('simCanvas');
  wrap.innerHTML = '';
  simParticles = [];
  updateSim._anchor = false; updateSim._n = null;
  const n = 24;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'sim-particle';
    wrap.appendChild(p);
    simParticles.push({el:p, x:Math.random()*260+20, y:Math.random()*160+20, vx:0, vy:0});
  }
  updateSim(document.getElementById('tempSlider').value);
}
function updateSim(val){
  const wrap = document.getElementById('simCanvas');
  if(!wrap){ cancelAnimationFrame(updateSim._raf); return; } // module no longer on screen — stop the loop
  val = Number(val);
  const label = document.getElementById('simStateLabel');
  const w = wrap.clientWidth || 300, h = 200;
  let stateName, color, speed, spread;
  if(val < 33){ stateName='SOLID (ICE)'; color='#4FB6E8'; speed=0.15; spread=0.25; }
  else if(val < 70){ stateName='LIQUID (WATER)'; color='#2F9AD6'; speed=0.6; spread=0.6; }
  else { stateName='GAS (WATER VAPOR)'; color='#B7E3F5'; speed=1.8; spread=1; }
  label.innerHTML = `<span class="state-chip" style="background:${color};">${stateName}</span>`;
  if(!updateSim._anchor || updateSim._n !== stateName){
    updateSim._anchor = true; updateSim._n = stateName;
    // reposition anchor points based on state
    simParticles.forEach((p,i)=>{
      if(stateName.startsWith('SOLID')){
        const cols=6; const gx = (i%cols)*(w/cols)+w/cols/2; const gy=Math.floor(i/cols)*(h/4)+h/2-40;
        p.tx=gx; p.ty=gy;
      } else if(stateName.startsWith('LIQUID')){
        p.tx = Math.random()*(w-30)+15; p.ty = Math.random()*(h*0.5)+h*0.45;
      } else {
        p.tx = Math.random()*(w-20)+10; p.ty = Math.random()*(h-20)+10;
      }
    });
  }
  simParticles.forEach(p=>{
    p.x += (p.tx-p.x)*0.08 + (Math.random()-0.5)*speed*4;
    p.y += (p.ty-p.y)*0.08 + (Math.random()-0.5)*speed*4;
    p.x = Math.max(6, Math.min(w-14, p.x));
    p.y = Math.max(6, Math.min(h-14, p.y));
    p.el.style.left = p.x+'px'; p.el.style.top = p.y+'px';
    p.el.style.background = color;
  });
  cancelAnimationFrame(updateSim._raf);
  updateSim._raf = requestAnimationFrame(()=>updateSim(val));
}

let quizIndex = 0;
let quizResults = [];

function startQuiz(){
  quizIndex = 0; quizResults = [];
  renderQuizProgress();
  renderQuestion();
  showViewRaw('quiz');
}
function renderQuizProgress(){
  const wrap = document.getElementById('quizProgress');
  wrap.innerHTML='';
  currentModule.quiz.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className='dot'+(i===quizIndex?' active':'')+
      (quizResults[i]===true?' correct':'')+(quizResults[i]===false?' wrong':'');
    wrap.appendChild(d);
  });
}

function renderQuestion(){
  const q = currentModule.quiz[quizIndex];
  const area = document.getElementById('quizArea');
  let bodyHTML = '';
  if(q.type==='mc'){
    bodyHTML = `<div class="qtype">Multiple Choice</div><h3>${q.q}</h3>` +
      q.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answerMC(${i})">${c}</button>`).join('');
  } else if(q.type==='tf'){
    bodyHTML = `<div class="qtype">True or False</div><h3>${q.q}</h3>
      <div class="tf-row">
        <button class="choice" data-b="true" onclick="answerTF(true)">✅ True</button>
        <button class="choice" data-b="false" onclick="answerTF(false)">❌ False</button>
      </div>`;
  } else if(q.type==='match'){
    bodyHTML = `<div class="qtype">Match It</div><h3>${q.q}</h3>
      <div class="match-wrap">
        <div class="match-col" id="matchLeft"></div>
        <div class="match-col" id="matchRight"></div>
      </div>`;
  }
  bodyHTML += `<div class="hint-box"><button class="btn ghost" style="padding:8px 14px;" onclick="giveHint()">💡 Give me a hint</button>
    <div id="hintText"></div>
  </div>
  <div id="feedbackArea"></div>`;
  area.innerHTML = `<div class="q-card">${bodyHTML}</div>`;

  if(q.type==='match') setupMatch(q);
  hintLevel = 0;
  wrongAttempts = 0;
  answered = false;
  renderQuizProgress();
}

let hintLevel = 0;
let wrongAttempts = 0;
let answered = false;

function giveHint(){
  const q = currentModule.quiz[quizIndex];
  if(!q.hints || hintLevel>=q.hints.length) { toast("That's all the hints Judy has — give it your best guess! 🐰"); return; }
  sndTap();
  const box = document.getElementById('hintText');
  const div = document.createElement('div');
  div.className='hint-reveal show';
  div.textContent = q.hints[hintLevel];
  box.appendChild(div);
  hintLevel++;
  maybeShowRevealButton();
}

function maybeShowRevealButton(){
  const q = currentModule.quiz[quizIndex];
  if(answered) return;
  if(q.type==='match') return;
  const box = document.getElementById('hintText');
  if(hintLevel >= (q.hints?q.hints.length:0) && wrongAttempts >= 1 && !document.getElementById('revealBtn')){
    const btn = document.createElement('button');
    btn.id = 'revealBtn';
    btn.className = 'btn ghost';
    btn.style.cssText = 'padding:8px 14px;margin-top:8px;';
    btn.textContent = "🐰 Judy, just show me the answer";
    btn.onclick = revealAnswer;
    box.appendChild(btn);
  }
}

function revealAnswer(){
  const q = currentModule.quiz[quizIndex];
  answered = true;
  if(q.type==='mc'){
    document.querySelectorAll('.choice').forEach((b,idx)=>{
      if(idx===q.correct) b.classList.add('reveal-correct');
      b.setAttribute('disabled','true');
    });
  } else if(q.type==='tf'){
    document.querySelectorAll('.choice').forEach(b=>{
      const isTrueBtn = b.dataset.b==='true';
      if((isTrueBtn && q.answer===true)||(!isTrueBtn && q.answer===false)) b.classList.add('reveal-correct');
      b.setAttribute('disabled','true');
    });
  }
  showFeedback(false, q.explain);
}

function lockChoices(){
  document.querySelectorAll('.choice').forEach(b=>b.setAttribute('disabled','true'));
}

function answerMC(i){
  if(answered) return;
  const q = currentModule.quiz[quizIndex];
  const correct = i===q.correct;
  const btn = document.querySelector('.choice[data-i="'+i+'"]');
  if(correct){
    answered = true;
    btn.classList.add('selected-correct');
    document.querySelectorAll('.choice').forEach(b=>b.setAttribute('disabled','true'));
    showFeedback(true, q.explain);
  } else {
    wrongAttempts++;
    btn.classList.add('selected-wrong');
    btn.setAttribute('disabled','true');
    sndWrong();
    showTryAgain();
  }
}
function answerTF(val){
  if(answered) return;
  const q = currentModule.quiz[quizIndex];
  const correct = val===q.answer;
  const btn = document.querySelector('.choice[data-b="'+val+'"]');
  if(correct){
    answered = true;
    btn.classList.add('selected-correct');
    document.querySelectorAll('.choice').forEach(b=>b.setAttribute('disabled','true'));
    showFeedback(true, q.explain);
  } else {
    wrongAttempts++;
    btn.classList.add('selected-wrong');
    btn.setAttribute('disabled','true');
    sndWrong();
    showTryAgain();
  }
}
function showTryAgain(){
  const area = document.getElementById('feedbackArea');
  const nudge = wrongAttempts===1
    ? "Not quite — want a hint? Or go ahead and try again 🐰"
    : "Still not it — Judy's hints are right above if you want one.";
  area.innerHTML = `<div class="feedback think"><div>${judySVGInline('thinking')}</div><div>${nudge}</div></div>`;
  maybeShowRevealButton();
}

let matchState = {leftSel:null, pairs:{}, done:0};
function setupMatch(q){
  matchState = {leftSel:null, pairs:{}, done:0};
  const leftCol = document.getElementById('matchLeft');
  const rightCol = document.getElementById('matchRight');
  leftCol.innerHTML=''; rightCol.innerHTML='';
  q.left.forEach((txt,i)=>{
    const el = document.createElement('div');
    el.className='match-item'; el.textContent=txt; el.dataset.i=i;
    el.onclick=()=>selectLeft(i, el);
    leftCol.appendChild(el);
  });
  // seeded shuffle for right column (stable per module+question)
  const seed = hashCode(currentModule.id+q.id);
  const order = seededShuffle(q.right.map((_,i)=>i), seed);
  order.forEach(origIdx=>{
    const el = document.createElement('div');
    el.className='match-item'; el.textContent=q.right[origIdx]; el.dataset.i=origIdx;
    el.onclick=()=>selectRight(origIdx, el);
    rightCol.appendChild(el);
  });
}
function hashCode(str){ let h=0; for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i); h|=0;} return Math.abs(h); }
function seededShuffle(arr, seed){
  const a = arr.slice(); let s = seed;
  for(let i=a.length-1;i>0;i--){
    s = (s*9301+49297)%233280;
    const j = Math.floor((s/233280)*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function selectLeft(i, el){
  if(el.classList.contains('paired-correct')) return;
  document.querySelectorAll('#matchLeft .match-item').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel'); matchState.leftSel = i;
  sndTap();
}
function selectRight(i, el){
  if(matchState.leftSel===null || el.classList.contains('paired-correct')) return;
  const q = currentModule.quiz[quizIndex];
  const leftIdx = matchState.leftSel;
  const correct = leftIdx === i; // by construction, right[i] pairs with left[i]
  const leftEl = document.querySelector('#matchLeft .match-item[data-i="'+leftIdx+'"]');
  if(correct){
    leftEl.classList.remove('sel'); leftEl.classList.add('paired-correct');
    el.classList.add('paired-correct');
    matchState.done++; sndCorrect();
    matchState.leftSel = null;
    if(matchState.done === q.left.length){
      answered = true;
      showFeedback(true, q.explain);
    }
  } else {
    el.classList.add('paired-wrong'); sndWrong();
    setTimeout(()=>el.classList.remove('paired-wrong'), 500);
    // leftSel stays active on purpose — she can immediately try another right answer
    // without having to re-tap the left item
  }
}

function showFeedback(correct, explain){
  const area = document.getElementById('feedbackArea');
  if(correct){ sndCorrect(); }
  else { sndWrong(); }
  const q = currentModule.quiz[quizIndex];
  if(!correct || wrongAttempts>0){
    // log to notebook — either she needed the reveal, or she struggled before landing it
    state.notebook.push({moduleId:currentModule.id, question:q.q, correct:explain});
    if(!state.reviewQueue.includes(currentModule.id)) state.reviewQueue.push(currentModule.id);
  }
  saveState();
  let headline;
  if(correct && wrongAttempts===0) headline = "Yes! You got it. 🎉";
  else if(correct) headline = "There you go — you worked it out! 🎉";
  else headline = "Good thinking — here's the idea:";
  area.innerHTML = `<div class="feedback ${correct?'good':'think'}">
      <div>${judySVGInline(correct?'happy':'thinking')}</div>
      <div>${headline} <br><span style="font-weight:600;">${explain}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="nextQuestion()">${quizIndex < currentModule.quiz.length-1 ? 'Next Question →' : 'Finish Quick Check →'}</button>
    </div>`;
  quizResults[quizIndex] = correct;
  renderQuizProgress();
}
function judySVGInline(mood){ return judySVG({size:40, mood, animate:false}); }

function nextQuestion(){
  if(quizIndex < currentModule.quiz.length-1){
    quizIndex++;
    renderQuestion();
  } else {
    finishModule();
  }
}

function finishModule(){
  const allCorrect = quizResults.every(r=>r===true);
  const wasLandCompleteBefore = landComplete(currentLand);
  state.completed[currentModule.id] = true;
  state.streak += 1;
  saveState();
  sndComplete();
  if(allCorrect) sndMilestone();
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="q-card" style="text-align:center;">
      ${judySVGInline('happy')}
      <h2 style="margin:10px 0 4px;">Module Complete! 🎉</h2>
      <p style="font-weight:700;color:var(--plum-soft);">You got ${quizResults.filter(r=>r).length} of ${quizResults.length} correct.</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn primary" onclick="openLand(currentLand)">Back to ${LANDS.find(l=>l.id===currentLand).name}</button>
        <button class="btn indigo" onclick="goHome()">Home</button>
      </div>
    </div>`;
  toast('Great work, Shareefah! 🌟');

  const nowComplete = landComplete(currentLand);
  if(!wasLandCompleteBefore && nowComplete){
    const unlocked = OUTFITS.find(o=>o.unlockLand===currentLand);
    if(unlocked) setTimeout(()=>showUnlockModal(unlocked), 900);
  }
}

function showUnlockModal(outfit){
  sndMilestone();
  const land = LANDS.find(l=>l.id===outfit.unlockLand);
  document.getElementById('unlockCardInner').innerHTML = `
    <div>${judySVG({size:150, mood:'happy', outfit:outfit.id})}</div>
    <div class="eyebrow" style="color:var(--indigo);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;">New wardrobe piece earned!</div>
    <h2>${outfit.emoji} ${outfit.name} unlocked!</h2>
    <p>You finished every module in ${land.name} — Judy is so proud of you, Shareefah!</p>
    <button class="btn primary" onclick="closeUnlockModal('${outfit.id}')">Dress Judy up now →</button>
  `;
  document.getElementById('unlockModal').classList.add('show');
}
function closeUnlockModal(outfitId){
  document.getElementById('unlockModal').classList.remove('show');
  state.outfit = outfitId; saveState(); renderAllJudys();
  showView('wardrobe');
}

/* =====================================================
   WARDROBE
===================================================== */
function renderWardrobe(){
  document.getElementById('wardrobeJudy').innerHTML = judySVG({size:180, mood:'happy'});
  const grid = document.getElementById('outfitGrid');
  grid.innerHTML='';
  OUTFITS.forEach(o=>{
    const unlocked = isOutfitUnlocked(o);
    const card = document.createElement('div');
    card.className='outfit-card'+(state.outfit===o.id?' active':'')+(unlocked?'':' locked');
    card.onclick = unlocked ? ()=>selectOutfit(o.id) : ()=>lockedOutfitTap(o);
    let sub = '';
    if(!unlocked){
      const land = LANDS.find(l=>l.id===o.unlockLand);
      const {done,total} = landDoneCount(land.id);
      sub = `<span class="lock-tag">🔒 ${done}/${total} · ${land.name}</span>`;
    }
    card.innerHTML = `<div class="swatch">${unlocked?o.emoji:'🔒'}</div>${o.name}${sub}`;
    grid.appendChild(card);
  });
}
function lockedOutfitTap(o){
  const land = LANDS.find(l=>l.id===o.unlockLand);
  sndTap();
  toast(`Finish ${land.name} to unlock the ${o.name}! 💪`);
}
function selectOutfit(id){
  const o = OUTFITS.find(x=>x.id===id);
  if(!o || !isOutfitUnlocked(o)) return;
  state.outfit = id; saveState(); sndTap();
  renderWardrobe(); renderAllJudys();
  toast('Judy is ready! 💫');
}

/* =====================================================
   LAB NOTEBOOK (stage-1 stub — simple alert-style view)
===================================================== */
function openNotebook(){
  if(state.notebook.length===0){
    toast("Judy's notebook is empty so far — great job! 📓");
    return;
  }
  const lines = state.notebook.slice(-5).map(n=>`• ${n.question}\\n  → ${n.correct}`).join('\\n\\n');
  alert("Judy's Lab Notebook (recent items to review):\\n\\n"+lines);
}

/* =====================================================
   INIT
===================================================== */
function init(){
  renderAllJudys();
  renderHome();
  if(!state.introSeen){
    setTimeout(()=>toast("Salaam! I'm Judy 🐰 Let's explore science together!"), 500);
    state.introSeen = true; saveState();
  }
  document.getElementById('muteBtn').textContent = state.muted ? '🔇' : '🔊';
}
window.addEventListener('load', init);
window.addEventListener('resize', ()=>{
  const c = document.getElementById('confetti-canvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
});
</script>
