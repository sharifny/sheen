<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judy's Social Studies Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#6EC6E8;
  --meadow:#7BC96F;
  --sun:#FFD166;
  --berry:#FF8FAB;
  --cream:#FFFBF2;
  --plum:#3D2C4E;
  --plum-soft:#6B5C7A;
  --card:#FFFFFF;
  --line:#EFE6D8;
  --gov:#8E7CC3;
  --hist:#E8A87C;
  --geo:#6EC6E8;
  --econ:#7BC96F;
  --shadow: 0 6px 0 rgba(61,44,78,0.12);
  --radius: 22px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito', sans-serif;
  background: linear-gradient(180deg, #FFF8EC 0%, #FFF1DE 100%);
  color:var(--plum);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.display{
  font-family:'Baloo 2', cursive;
  font-weight:800;
  color:var(--plum);
  margin:0 0 8px 0;
}
button{font-family:inherit;}
#app{max-width:900px;margin:0 auto;padding:16px 16px 90px;position:relative;min-height:100vh;}
.screen{display:none;animation:fadein .35s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 18px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-title{font-family:'Baloo 2';font-weight:800;font-size:1.3rem;color:var(--plum);}
.brand-title .accent{color:var(--berry);}
.icon-btn{
  background:var(--card); border:2px solid var(--line); border-radius:16px;
  width:44px;height:44px; display:flex;align-items:center;justify-content:center;
  cursor:pointer; box-shadow:var(--shadow); font-size:1.2rem;
}
.icon-btn:active{transform:translateY(3px); box-shadow:none;}

/* Progress pill */
.progress-wrap{background:var(--card); border-radius:20px; padding:10px 16px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); border:2px solid var(--line);}
.progress-bar-bg{flex:1; height:14px; background:#F1E9DA; border-radius:10px; overflow:hidden;}
.progress-bar-fill{height:100%; background:linear-gradient(90deg,var(--sun),var(--berry)); border-radius:10px; transition:width .5s ease;}
.progress-pct{font-weight:800; font-family:'Baloo 2'; color:var(--plum); min-width:44px; text-align:right;}

/* Cards / Lands */
.lands-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
@media (max-width:560px){.lands-grid{grid-template-columns:1fr;}}
.land-card{
  border-radius:var(--radius); padding:18px; cursor:pointer; position:relative; overflow:hidden;
  box-shadow:var(--shadow); border:3px solid rgba(255,255,255,0.6); color:white; min-height:150px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.land-card:active{transform:translateY(3px); box-shadow:none;}
.land-card.gov{background:linear-gradient(145deg,#8E7CC3,#6E5AA8);}
.land-card.hist{background:linear-gradient(145deg,#E8A87C,#D4854D);}
.land-card.geo{background:linear-gradient(145deg,#6EC6E8,#3FA6CC);}
.land-card.econ{background:linear-gradient(145deg,#7BC96F,#54A648);}
.land-card h3{color:white; font-size:1.15rem;}
.land-sub{opacity:.92; font-size:.85rem; font-weight:600;}
.land-badge{position:absolute; top:12px; right:14px; background:rgba(255,255,255,0.25); border-radius:12px; padding:4px 10px; font-weight:800; font-size:.8rem;}
.module-chip-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.mod-chip{width:14px;height:14px;border-radius:50%; background:rgba(255,255,255,0.35); border:2px solid rgba(255,255,255,0.6);}
.mod-chip.done{background:var(--sun); border-color:white;}
.mod-chip.flagged{background:var(--berry); border-color:white;}

/* Judy panel */
.judy-panel{
  background:var(--card); border-radius:var(--radius); padding:16px; display:flex; gap:14px; align-items:center;
  box-shadow:var(--shadow); border:2px solid var(--line); margin-bottom:16px;
}
.judy-avatar{width:64px; height:64px; flex-shrink:0;}
.judy-speech{flex:1; font-weight:700; color:var(--plum-soft); font-size:.98rem; line-height:1.35;}
.judy-name{color:var(--berry); font-family:'Baloo 2'; font-weight:800;}

/* Buttons */
.btn{
  font-family:'Baloo 2'; font-weight:700; border:none; border-radius:16px; padding:14px 22px;
  cursor:pointer; font-size:1rem; box-shadow:var(--shadow); transition:transform .1s;
}
.btn:active{transform:translateY(3px); box-shadow:none;}
.btn-primary{background:var(--berry); color:white;}
.btn-secondary{background:var(--card); color:var(--plum); border:2px solid var(--line);}
.btn-block{width:100%; display:block; text-align:center;}
.btn-row{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* Lesson screen */
.lesson-card{background:var(--card); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); border:2px solid var(--line);}
.strand-tag{display:inline-block; font-family:'Baloo 2'; font-weight:800; font-size:.75rem; letter-spacing:.5px; text-transform:uppercase; padding:5px 12px; border-radius:20px; color:white; margin-bottom:10px;}
.tag-gov{background:var(--gov);} .tag-hist{background:var(--hist);} .tag-geo{background:var(--geo);} .tag-econ{background:var(--econ);}
.svg-illustration{width:100%; max-width:420px; display:block; margin:14px auto;}
.lesson-text{font-size:1.05rem; line-height:1.7; color:var(--plum);}
.lesson-text p{margin:0 0 14px 0;}
.fun-fact{background:#FFF3D6; border-radius:16px; padding:12px 16px; margin-top:14px; border:2px dashed var(--sun); font-weight:600;}
.fun-fact-label{font-family:'Baloo 2'; color:#B8860B; font-weight:800; margin-right:6px;}

/* Vocab tap word */
.vocab-word{
  color:var(--gov); font-weight:800; border-bottom:3px dotted var(--gov); cursor:pointer; position:relative;
  padding:0 2px; border-radius:4px;
}
.vocab-word:hover{background:#F1EBFB;}
.vocab-popover{
  position:fixed; z-index:999; background:var(--plum); color:white; padding:12px 14px; border-radius:14px;
  max-width:260px; font-size:.9rem; font-weight:600; line-height:1.4; box-shadow:0 10px 24px rgba(0,0,0,.25);
  display:none;
}
.vocab-popover.show{display:block;}
.vocab-popover .vp-word{font-family:'Baloo 2'; font-weight:800; font-size:1rem; color:var(--sun); display:flex; align-items:center; gap:8px;}
.vocab-popover .vp-clue{opacity:.85; font-style:italic; margin-top:4px; font-size:.82rem;}
.sound-btn{
  background:rgba(255,255,255,0.15); border:none; border-radius:50%; width:26px;height:26px; color:white; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:.85rem;
}
.sound-btn:active{background:rgba(255,255,255,0.35);}

/* Quiz */
.quiz-progress{display:flex; gap:6px; margin-bottom:14px;}
.qp-dot{flex:1; height:8px; border-radius:6px; background:#F1E9DA;}
.qp-dot.active{background:var(--sky);}
.qp-dot.correct{background:var(--meadow);}
.qp-dot.wrong{background:var(--berry);}
.question-text{font-size:1.15rem; font-weight:700; margin-bottom:16px; line-height:1.5;}
.options{display:flex; flex-direction:column; gap:10px;}
.option-btn{
  text-align:left; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px 16px;
  font-family:'Nunito'; font-weight:700; font-size:1rem; cursor:pointer; color:var(--plum);
}
.option-btn:hover{border-color:var(--sky);}
.option-btn.selected-correct{background:#E7F7E4; border-color:var(--meadow); color:#2F7A2A;}
.option-btn.selected-wrong{background:#FDE7EC; border-color:var(--berry); color:#B23A56;}
.option-btn.reveal-correct{border-color:var(--meadow); background:#E7F7E4;}
.option-btn:disabled{cursor:default;}
.match-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.match-item{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px; font-weight:700; cursor:pointer; text-align:center;}
.match-item.picked{border-color:var(--sky); background:#EAF7FC;}
.match-item.matched{border-color:var(--meadow); background:#E7F7E4; opacity:.7; cursor:default;}
.feedback-box{margin-top:16px; padding:14px 16px; border-radius:16px; font-weight:700; display:flex; gap:10px; align-items:flex-start;}
.feedback-correct{background:#E7F7E4; color:#2F7A2A;}
.feedback-wrong{background:#FDE7EC; color:#B23A56;}
.feedback-explain{font-weight:600; font-size:.92rem; margin-top:4px; color:var(--plum-soft);}

/* Map click question */
.mapclick-wrap{position:relative; max-width:420px; margin:0 auto;}
.mapclick-wrap svg{width:100%; cursor:pointer;}
.mapclick-target{transition:fill .15s;}
.mapclick-target:hover{fill-opacity:.7;}

/* Streak / toast */
.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--plum); color:white;
  padding:12px 20px; border-radius:20px; font-weight:800; font-family:'Baloo 2'; z-index:1000; box-shadow:0 8px 20px rgba(0,0,0,.25);
  display:flex; align-items:center; gap:8px; opacity:0; transition:opacity .3s, top .3s;
}
.toast.show{opacity:1; top:26px;}

/* Trophy / Meet Judy */
.trophy-shelf{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px;}
@media (max-width:560px){.trophy-shelf{grid-template-columns:repeat(2,1fr);}}
.trophy-item{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; text-align:center; box-shadow:var(--shadow);}
.trophy-item.locked{opacity:.35;}
.trophy-icon{font-size:2rem;}
.trophy-label{font-weight:700; font-size:.8rem; margin-top:4px;}

/* Review queue */
.review-item{background:var(--card); border:2px solid var(--berry); border-radius:16px; padding:14px 16px; margin-bottom:10px; font-weight:700;}

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:2px solid var(--line);
  display:flex; justify-content:space-around; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); z-index:50;
}
.nav-btn{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--plum-soft); font-weight:700; font-size:.72rem; cursor:pointer; padding:4px 10px; border-radius:12px;}
.nav-btn.active{color:var(--berry); background:#FFF0F4;}
.nav-icon{font-size:1.3rem;}

/* Intro / Bismillah screen */
.intro-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center;}
.bismillah{font-size:1.3rem; color:var(--plum-soft); font-weight:700; margin-bottom:6px;}
.intro-wrap .display{font-size:2rem;}

.small-note{font-size:.8rem; color:var(--plum-soft); text-align:center; margin-top:10px;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>
<div id="vocabPopover" class="vocab-popover"></div>
<div id="toast" class="toast"></div>
<script>
/* =========================================================
   JUDY'S SOCIAL STUDIES ADVENTURE
   Bismillah. Built as a single self-contained file for
   GitHub Pages hosting. Progress is saved with localStorage
   so it persists between sessions on the same device/browser.
   ========================================================= */

/* ---------- STORAGE ---------- */
const STORAGE_KEY = 'judySocialStudies_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Could not read saved progress', e); }
  return {
    completedModules:{},       // moduleId -> {score, total, date}
    missedQuestions:{},        // "moduleId::qIndex" -> {dueAfterModuleCount, seen}
    modulesCompletedCount:0,
    accessories:[],            // strand ids collected
    streak:0,
    lastPlayedDate:null,
    lastScreen:'home'
  };
}
let STATE = loadState();
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.warn('Could not save progress', e); }
}

/* ---------- TEXT TO SPEECH ---------- */
let bestVoice = null;
function pickBestVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return null;
  const preferredNames = ['Google US English','Samantha','Microsoft Aria Online (Natural)','Microsoft Jenny Online (Natural)','Ava','Allison','Microsoft Zira'];
  for(const name of preferredNames){
    const v = voices.find(v=>v.name.includes(name));
    if(v) return v;
  }
  const enUS = voices.find(v=>v.lang==='en-US' && !v.name.toLowerCase().includes('robot'));
  if(enUS) return enUS;
  return voices.find(v=>v.lang && v.lang.startsWith('en')) || voices[0];
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ bestVoice = pickBestVoice(); };
  bestVoice = pickBestVoice();
}
function speakWord(text){
  if(!('speechSynthesis' in window)){
    showToast('🔇 Voice not supported on this device \u2014 use the spelling guide instead');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.88; u.pitch = 1.02;
  if(bestVoice) u.voice = bestVoice;
  window.speechSynthesis.speak(u);
}

/* ---------- TOAST ---------- */
let toastTimer=null;
function showToast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms);
}

/* ---------- VOCAB POPOVER ---------- */
function showVocabPopover(word, evt){
  const entry = GLOSSARY[word.toLowerCase()];
  if(!entry) return;
  const pop = document.getElementById('vocabPopover');
  pop.innerHTML = `
    <div class="vp-word">${capitalize(word)}
      <button class="sound-btn" onclick="speakWord('${word.replace(/'/g,"")}')" aria-label="Play pronunciation">🔊</button>
    </div>
    <div>${entry.def}</div>
    ${entry.clue ? `<div class="vp-clue">Clue: ${entry.clue}</div>` : ''}
    ${entry.ipa ? `<div class="vp-clue">Say it: ${entry.ipa}</div>` : ''}
  `;
  const rect = evt.target.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 8;
  if(left + 260 > window.innerWidth) left = window.innerWidth - 270;
  if(top + 140 > window.innerHeight) top = rect.top - 140;
  pop.style.left = Math.max(8,left)+'px';
  pop.style.top = Math.max(8,top)+'px';
  pop.classList.add('show');
  evt.stopPropagation();
}
document.addEventListener('click', (e)=>{
  if(!e.target.classList.contains('vocab-word')){
    document.getElementById('vocabPopover').classList.remove('show');
  }
});
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* Render lesson text: turns [[key]] or [[key|Displayed Text]] into tappable vocab spans */
function renderVocabText(str){
  return str.replace(/\[\[(.+?)\]\]/g, (m, inner)=>{
    const parts = inner.split('|');
    const key = parts[0].trim();
    const display = (parts[1] || parts[0]).trim();
    return `<span class="vocab-word" onclick="showVocabPopover('${key.replace(/'/g,"")}', event)">${display}</span>`;
  });
}

/* ---------- JUDY AVATAR (simple SVG bunny, a few moods) ---------- */
function judySVG(mood){
  // mood: 'idle' | 'happy' | 'think' | 'oops'
  const earColor = '#FFE1EC';
  const bodyColor = '#FFFFFF';
  const outline = '#3D2C4E';
  let mouth = 'M 40,58 Q 46,63 52,58';
  let eyes = `<circle cx="38" cy="46" r="3.2" fill="${outline}"/><circle cx="54" cy="46" r="3.2" fill="${outline}"/>`;
  let extra = '';
  if(mood==='happy'){ mouth = 'M 38,56 Q 46,68 54,56'; extra = `<path d="M30,40 Q38,34 44,40" stroke="${outline}" stroke-width="2" fill="none"/><path d="M48,40 Q54,34 62,40" stroke="${outline}" stroke-width="2" fill="none"/>`; eyes=''; }
  if(mood==='oops'){ mouth = 'M 40,60 Q 46,56 52,60'; eyes = `<circle cx="38" cy="47" r="2.6" fill="${outline}"/><circle cx="54" cy="47" r="2.6" fill="${outline}"/>`; }
  if(mood==='think'){ mouth = 'M 42,58 L 50,58'; }
  return `
  <svg viewBox="0 0 92 100" class="judy-avatar">
    <ellipse cx="46" cy="72" rx="26" ry="22" fill="${bodyColor}" stroke="${outline}" stroke-width="2.5"/>
    <ellipse cx="28" cy="22" rx="8" ry="24" fill="${bodyColor}" stroke="${outline}" stroke-width="2.5" transform="rotate(-12 28 22)"/>
    <ellipse cx="28" cy="24" rx="4" ry="17" fill="${earColor}" transform="rotate(-12 28 24)"/>
    <ellipse cx="62" cy="22" rx="8" ry="24" fill="${bodyColor}" stroke="${outline}" stroke-width="2.5" transform="rotate(12 62 22)"/>
    <ellipse cx="62" cy="24" rx="4" ry="17" fill="${earColor}" transform="rotate(12 62 24)"/>
    <circle cx="46" cy="48" r="24" fill="${bodyColor}" stroke="${outline}" stroke-width="2.5"/>
    ${eyes}${extra}
    <ellipse cx="46" cy="54" rx="4" ry="3" fill="#F9B8C4"/>
    <path d="${mouth}" stroke="${outline}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="56" r="4" fill="#FFD3DC" opacity="0.7"/>
    <circle cx="62" cy="56" r="4" fill="#FFD3DC" opacity="0.7"/>
    <path d="M36,88 Q46,80 56,88" stroke="${outline}" stroke-width="2" fill="none"/>
  </svg>`;
}

/* ---------- NAVIGATION ---------- */
let CURRENT = {screen:'home', land:null, moduleId:null, quizIndex:0, quizScore:0, quizMissed:[], selected:null, matchPicks:{}, matchDone:{}};

function goHome(){ CURRENT.screen='home'; render(); }
function goReview(){ CURRENT.screen='review'; render(); }
function goTrophy(){ CURRENT.screen='trophy'; render(); }
function openLand(landId){ CURRENT.land = landId; CURRENT.screen='land'; render(); }
function openModule(id){
  CURRENT.moduleId = id; CURRENT.screen='lesson'; CURRENT.quizIndex=0; CURRENT.quizScore=0; CURRENT.quizMissed=[]; CURRENT.selected=null; CURRENT.matchPicks={}; CURRENT.matchDone={};
  render();
}
</script>
<script>
/* ---------- GLOSSARY (tappable vocabulary bank) ---------- */
const GLOSSARY = {
  'legislative': {def:'The branch of government that makes laws (Congress).', clue:'"Legis" is Latin for law.'},
  'executive': {def:'The branch of government that carries out and enforces laws (the President).', clue:'Think "execute" \u2014 to carry something out.'},
  'judicial': {def:'The branch of government that interprets laws and settles disputes (the courts).', clue:'You can hear the word "judge" inside it.'},
  'veto': {def:'The power of the President to reject a bill passed by Congress.', clue:'"Veto" is Latin for "I forbid."'},
  'amendment': {def:'An official change or addition made to the Constitution.', clue:'Think "amend" \u2014 to fix or change something.'},
  'ratify': {def:'To formally approve something, making it official.', clue:''},
  'census': {def:'An official count of everyone living in the country, taken every 10 years.', clue:''},
  'bill of rights': {def:'The first 10 amendments to the Constitution, protecting basic freedoms like speech and religion.', clue:''},
  'checks and balances': {def:'A system where each branch of government can limit the power of the other branches.', clue:''},
  'electoral college': {def:'A group of representatives from each state who formally cast the votes that elect the President.', clue:''},
  'capital city': {def:'The city where a state or country\u2019s government is based.', clue:'Don\u2019t confuse with "capital" (money)!'},
  'capital': {def:'Money or resources used to start or grow a business.', clue:'Don\u2019t confuse with "capital city"!'},
  'surplus': {def:'Extra money left over after all expenses are paid.', clue:''},
  'deficit': {def:'When spending is more than the money coming in.', clue:''},
  'tax': {def:'Money citizens and businesses pay to the government to fund roads, schools, and more.', clue:''},
  'budget': {def:'A plan for how money will be earned, spent, and saved.', clue:''},
  'barter': {def:'Trading goods or services directly, without using money.', clue:''},
  'producer': {def:'A person or business that makes goods or provides services.', clue:''},
  'consumer': {def:'A person who buys and uses goods or services.', clue:'Think "consume" \u2014 to use up.'},
  'goods': {def:'Physical items that people make or buy, like shoes or bread.', clue:''},
  'services': {def:'Helpful actions people do for others, usually for pay, like teaching or fixing a car.', clue:''},
  'colony': {def:'A settlement or land controlled by another, more distant country.', clue:''},
  'revolution': {def:'A big, often sudden change \u2014 especially the overthrow of a government.', clue:''},
  'independence': {def:'Freedom from being ruled or controlled by another country.', clue:''},
  'treaty': {def:'A formal, official agreement between two or more countries.', clue:''},
  'confederacy': {def:'The group of 11 southern states that separated from the U.S. during the Civil War.', clue:''},
  'union': {def:'During the Civil War, the northern states that stayed loyal to the U.S. government.', clue:'"Union" also just means things joined together.'},
  'immigrant': {def:'A person who moves from one country to live permanently in another.', clue:''},
  'archipelago': {def:'A group or chain of islands.', clue:'From Greek: "arkhi" (chief) + "pelagos" (sea).', ipa:'ar-kuh-PEL-uh-go'},
  'atoll': {def:'A ring-shaped coral island or reef surrounding a lagoon.', clue:''},
  'isthmus': {def:'A thin strip of land connecting two larger areas of land.', clue:'', ipa:'ISS-muhs'},
  'estuary': {def:'The area where a river\u2019s fresh water meets and mixes with the sea.', clue:''},
  'glacier': {def:'A huge, slow-moving mass of ice.', clue:''},
  'peninsula': {def:'Land that is surrounded by water on three sides.', clue:'From Latin: "paene" (almost) + "insula" (island).'},
  'plateau': {def:'A large area of flat land that sits higher than the land around it.', clue:''},
  'levee': {def:'A wall or bank built along a river to stop it from flooding.', clue:''},

function getModule(id){ return MODULES.find(m=>m.id===id); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function overallPct(){ return Math.round(100 * Object.keys(STATE.completedModules).length / MODULES.length); }
function landModules(landId){ return MODULES.filter(m=>m.land===landId); }
function landDoneCount(landId){ return landModules(landId).filter(m=>STATE.completedModules[m.id]).length; }
function isFlagged(modId, qIdx){ return !!STATE.missedQuestions[modId+'::'+qIdx] && !STATE.missedQuestions[modId+'::'+qIdx].resolved; }

function updateStreak(){
  const today = todayStr();
  if(STATE.lastPlayedDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.toISOString().slice(0,10);
  STATE.streak = (STATE.lastPlayedDate === yStr) ? (STATE.streak||0)+1 : 1;
  STATE.lastPlayedDate = today;
  saveState();
}

function renderMatchQuestion(q){
  const lefts = q.pairs.map(p=>p[0]);
  const rights = shuffleStable(q.pairs.map(p=>p[1]), q.q);
  return `<div class="question-text">${q.q}</div>
  <div class="match-grid">
    <div>${lefts.map((l,i)=>`<div class="match-item" data-side="L" data-val="${escAttr(l)}" onclick="matchPick(this,'L','${escAttr(l)}')" id="ml${i}">${l}</div>`).join('')}</div>
    <div>${rights.map((r,i)=>`<div class="match-item" data-side="R" data-val="${escAttr(r)}" onclick="matchPick(this,'R','${escAttr(r)}')" id="mr${i}">${r}</div>`).join('')}</div>
  </div>
  <div id="feedbackZone"></div>`;
}
function escAttr(s){ return s.replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function shuffleStable(arr, seed){
  const a = arr.slice();
  let s = seed.length;
  for(let i=a.length-1;i>0;i--){ s = (s*9301+49297)%233280; const j = Math.floor((s/233280)*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let matchState = {leftPicked:null, matchedCount:0};
function matchPick(el, side, val){
  const m = getModule(CURRENT.moduleId); const q = m.questions[CURRENT.quizIndex];
  if(el.classList.contains('matched')) return;
  if(side==='L'){
    document.querySelectorAll('.match-item[data-side="L"]').forEach(e=>e.classList.remove('picked'));
    el.classList.add('picked'); matchState.leftPicked = {el, val};
  } else {
    if(!matchState.leftPicked) return;
    const leftVal = matchState.leftPicked.val;
    const correctPair = q.pairs.find(p=>p[0]===leftVal);
    if(correctPair && correctPair[1]===val){
      matchState.leftPicked.el.classList.add('matched'); matchState.leftPicked.el.classList.remove('picked');
      el.classList.add('matched');
      matchState.matchedCount++;
      matchState.leftPicked = null;
      if(matchState.matchedCount === q.pairs.length){
        recordAnswer(true);
        document.getElementById('feedbackZone').innerHTML = feedbackHtml(true, q.explain||'All matched correctly!');
        disableAllInputs();
      }
    } else {
      showToast('Not quite \u2014 try again!');
      matchState.leftPicked.el.classList.remove('picked'); matchState.leftPicked=null;
      matchState.matchWrongOnce = true;
    }
  }
}

function answerChoice(i){
  const m = getModule(CURRENT.moduleId); const q = m.questions[CURRENT.quizIndex];
  const options = document.querySelectorAll('.option-btn');
  const correctIdx = q.type==='tf' ? (q.correct?0:1) : q.correct;
  const isCorrect = i===correctIdx;
  options.forEach((o,idx)=>{
    o.disabled = true;
    if(idx===correctIdx) o.classList.add(isCorrect? 'selected-correct':'reveal-correct');
    if(idx===i && !isCorrect) o.classList.add('selected-wrong');
  });
  recordAnswer(isCorrect, q.explain);
}

function answerHotspot(i){
  const m = getModule(CURRENT.moduleId); const q = m.questions[CURRENT.quizIndex];
  const buttons = document.querySelectorAll('.mapclick-wrap button');
  const isCorrect = !!q.points[i].correct;
  buttons.forEach((b,idx)=>{
    b.disabled = true; b.style.pointerEvents='none';
    if(q.points[idx].correct) b.style.background = 'rgba(123,201,111,0.75)';
    if(idx===i && !isCorrect) b.style.background = 'rgba(178,58,86,0.75)';
  });
  recordAnswer(isCorrect, q.explain);
}

function recordAnswer(isCorrect, explain){
  const m = getModule(CURRENT.moduleId);
  CURRENT.answeredLog[CURRENT.quizIndex] = isCorrect;
  if(isCorrect) CURRENT.quizScore++;
  else CURRENT.quizMissed.push(CURRENT.quizIndex);
  matchState = {leftPicked:null, matchedCount:0};
  if(explain !== undefined){
    document.getElementById('feedbackZone').innerHTML = feedbackHtml(isCorrect, explain);
  }
  if(isCorrect) showToast(pickPraise());
  setTimeout(()=>{
    const zone = document.getElementById('feedbackZone');
    if(zone && !zone.querySelector('.next-btn')){
      zone.innerHTML += `<button class="btn btn-primary next-btn" style="margin-top:10px;" onclick="nextQuestion()">${CURRENT.quizIndex < m.questions.length-1 ? 'Next question \u2192' : 'See my results \u2192'}</button>`;
    }
  }, 150);
}
function disableAllInputs(){
  document.querySelectorAll('.match-item').forEach(e=>e.style.pointerEvents='none');
}
function feedbackHtml(isCorrect, explain){
  return `<div class="feedback-box ${isCorrect?'feedback-correct':'feedback-wrong'}">
    <div style="font-size:1.3rem;">${isCorrect ? '\u2705':'\ud83d\udca1'}</div>
    <div><div>${isCorrect ? pickPraise() : "Let's figure this out together:"}</div><div class="feedback-explain">${explain||''}</div></div>
  </div>`;
}

  const opts = ['M\u0101 sh\u0101 All\u0101h! \ud83c\udf1f','Alhamdulillah, well done!','Excellent thinking!','You nailed it!','Judy is hopping with joy!'];
  return opts[Math.floor(Math.random()*opts.length)];
}

/* ---------- FINISH MODULE + SPACED REVIEW SCHEDULING ---------- */
function finishModule(){
  const m = getModule(CURRENT.moduleId);
  const total = m.questions.length;
  const score = CURRENT.quizScore;
  const wasFirstTime = !STATE.completedModules[m.id];
  STATE.completedModules[m.id] = {score, total, date: todayStr()};
  if(wasFirstTime) STATE.modulesCompletedCount++;

  // spaced review scheduling for missed questions
  CURRENT.quizMissed.forEach(qIdx=>{
    const key = m.id+'::'+qIdx;
    STATE.missedQuestions[key] = {moduleId:m.id, qIndex:qIdx, dueAfterCount: STATE.modulesCompletedCount + 2, resolved:false};
  });
  // any question answered correctly this time that was previously flagged -> resolve it
  m.questions.forEach((q,i)=>{
    if(CURRENT.answeredLog[i]===true){
      const key = m.id+'::'+i;
      if(STATE.missedQuestions[key]) STATE.missedQuestions[key].resolved = true;
    }
  });

  // accessory award: full land completed
  const land = LANDS.find(l=>l.id===m.land);
  const allDone = landModules(land.id).every(mm=>STATE.completedModules[mm.id]);
  let newAccessory = false;
  if(allDone && !STATE.accessories.includes(land.id)){
    STATE.accessories.push(land.id);
    newAccessory = true;
  }
  saveState();
  CURRENT.screen='complete';
  CURRENT.lastResult = {score, total, newAccessory, land};
  render();
}

function renderCompleteScreen(){
  const {score, total, newAccessory, land} = CURRENT.lastResult;
  const pct = Math.round(100*score/total);
  const mood = pct>=80 ? 'happy' : (pct>=50 ? 'idle' : 'oops');
  let msg;
  if(pct>=80) msg = `M\u0101 sh\u0101 All\u0101h, alhamdulillah! You got ${score} out of ${total}! You really know this one.`;
  else if(pct>=50) msg = `Good effort \u2014 ${score} out of ${total}! Alhamdulillah for the progress. A little review will make it even stronger, in sh\u0101' All\u0101h.`;
  else msg = `You got ${score} out of ${total} \u2014 that's alright, learning takes practice! Let's add these to the Review Den and try again soon, in sh\u0101' All\u0101h.`;
  return `
  <div class="screen active">
    <div class="intro-wrap" style="min-height:60vh;">
      ${judySVG(mood)}
      <h2 class="display" style="margin-top:10px;">${pct>=80?'Amazing work!':'Nice try!'}</h2>
      <p style="font-weight:700; color:var(--plum-soft); max-width:360px;">${msg}</p>
      ${newAccessory ? `<div class="fun-fact" style="margin-top:14px;">\ud83c\udf89 New accessory unlocked for Judy: <b>${ACCESSORY_BY_LAND[land.id].icon} ${ACCESSORY_BY_LAND[land.id].label}</b>! Check the Meet Judy tab.</div>` : ''}
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="openLand('${land.id}')">Back to ${land.name}</button>
        <button class="btn btn-primary" onclick="goHome()">Adventure Map</button>
      </div>
    </div>
    ${bottomNav('home')}
  </div>`;
}

/* ---------- REVIEW SCREEN (spaced repetition queue) ---------- */
function renderReviewScreen(){
  const entries = Object.entries(STATE.missedQuestions).filter(([k,v])=>!v.resolved);
  const ready = entries.filter(([k,v])=>STATE.modulesCompletedCount >= v.dueAfterCount);
  const upcoming = entries.filter(([k,v])=>STATE.modulesCompletedCount < v.dueAfterCount);
  return `
  <div class="screen active">
    <div class="topbar"><div class="brand-title">\ud83d\udd01 Review Den</div></div>
    <div class="judy-panel">${judySVG('idle')}<div class="judy-speech"><span class="judy-name">Judy:</span> ${entries.length===0 ? "You're all caught up \u2014 nothing to review right now!" : `Let's go over ${ready.length} question${ready.length===1?'':'s'} together.`}</div></div>
    ${ready.length===0 && upcoming.length===0 ? '' : ''}
    ${ready.map(([key,v])=>renderReviewCard(key,v)).join('')}
    ${upcoming.length>0 ? `<h3 style="margin-top:20px;">Coming up soon</h3><p class="small-note" style="text-align:left;">These will reappear here after you finish a couple more modules \u2014 spacing them out helps them really stick!</p>` : ''}
    ${upcoming.map(([key,v])=>{
      const m = getModule(v.moduleId); const q = m.questions[v.qIndex];
      return `<div class="review-item" style="opacity:.55;"><div class="strand-tag ${LANDS.find(l=>l.id===m.land).tag}" style="font-size:.65rem;">${m.title}</div><div>${q.q||q.pairs?.map(p=>p[0]).join(', ')}</div></div>`;
    }).join('')}
    ${bottomNav('review')}
  </div>`;
}
function renderReviewCard(key, v){
  const m = getModule(v.moduleId); const q = m.questions[v.qIndex];
  const land = LANDS.find(l=>l.id===m.land);
  if(q.type==='mcq' || q.type==='tf'){
    const options = q.type==='tf' ? ['True','False'] : q.options;
    return `<div class="review-item">
      <span class="strand-tag ${land.tag}" style="font-size:.65rem;">${m.title}</span>
      <div class="question-text" style="font-size:1rem;">${q.q}</div>
      <div class="options">${options.map((opt,i)=>`<button class="option-btn" onclick="reviewAnswer('${key}', ${i}, this)">${opt}</button>`).join('')}</div>
      <div id="rf_${key.replace(/[:]/g,'_')}"></div>
    </div>`;
  }
  // fallback for match/hotspot: simple "got it now?" self-check
  return `<div class="review-item">
    <span class="strand-tag ${land.tag}" style="font-size:.65rem;">${m.title}</span>
    <div class="question-text" style="font-size:1rem;">${q.q}</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="reviewSelfCheck('${key}', false)">Still tricky</button>
      <button class="btn btn-primary" onclick="reviewSelfCheck('${key}', true)">Got it now!</button>
    </div>
  </div>`;
}
function reviewAnswer(key, choice, btnEl){
  const v = STATE.missedQuestions[key];
  const m = getModule(v.moduleId); const q = m.questions[v.qIndex];
  const correctIdx = q.type==='tf' ? (q.correct?0:1) : q.correct;
  const isCorrect = choice===correctIdx;
  const zone = document.getElementById('rf_'+key.replace(/[:]/g,'_'));
  zone.innerHTML = feedbackHtml(isCorrect, q.explain);
  if(isCorrect){ STATE.missedQuestions[key].resolved = true; }
  else { STATE.missedQuestions[key].dueAfterCount = STATE.modulesCompletedCount + 2; }
  saveState();
  setTimeout(render, 1400);
}
function reviewSelfCheck(key, gotIt){
  if(gotIt) STATE.missedQuestions[key].resolved = true;
  else STATE.missedQuestions[key].dueAfterCount = STATE.modulesCompletedCount + 2;
  saveState(); render();
}

/* ---------- TROPHY / MEET JUDY SCREEN ---------- */
function renderTrophyScreen(){
  return `
  <div class="screen active">
    <div class="topbar"><div class="brand-title">\ud83c\udfc6 Meet Judy</div></div>
    <div class="judy-panel">${judySVG('happy')}<div class="judy-speech"><span class="judy-name">Judy:</span> Here's everything I've collected on our adventure so far!</div></div>
    <div class="trophy-shelf">
      ${LANDS.map(l=>{
        const has = STATE.accessories.includes(l.id);
        const acc = ACCESSORY_BY_LAND[l.id];
        return `<div class="trophy-item ${has?'':'locked'}">
          <div class="trophy-icon">${has?acc.icon:'\ud83d\udd12'}</div>
          <div class="trophy-label">${has?acc.label:'Finish '+l.name}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="lesson-card" style="margin-top:18px; text-align:center;">
      <div style="font-weight:800; font-family:'Baloo 2'; color:var(--plum-soft); margin-bottom:6px;">Overall progress</div>
      <div class="progress-bar-bg" style="height:18px;"><div class="progress-bar-fill" style="width:${overallPct()}%"></div></div>
      <div style="margin-top:8px; font-weight:800;">${overallPct()}% complete \u2014 ${Object.keys(STATE.completedModules).length}/${MODULES.length} modules</div>
    </div>
    ${bottomNav('trophy')}
  </div>`;
}

/* ---------- BOOTSTRAP ---------- */
function initApp(){
  CURRENT.screen = (Object.keys(STATE.completedModules).length===0 && !STATE.introSeen) ? 'intro' : 'home';
  render();
}
document.addEventListener('DOMContentLoaded', initApp);
</script>
</script>
</body>
