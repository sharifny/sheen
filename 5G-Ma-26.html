<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Judy's Math Trail — Shareefah's Grade 5 Iowa Math Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JUDY'S MATH TRAIL -- design tokens & component styles
   Palette: warm cream / deep pine / burnt coral / golden mustard
   Type: Baloo 2 (display, playful) + Inter (body, readable)
   ============================================================ */
:root {
  --cream: #FBF6EC;
  --cream-card: #F3EEE0;
  --pine: #1868DB;
  --pine-dark: #0F4DA8;
  --coral: #E8703A;
  --coral-dark: #C85A2A;
  --mustard: #E8B23D;
  --sage: #DCE6F2;
  --ink: #3A2A22;
  --ink-soft: #6B5D52;
  --line: #E2D9C6;
  --white: #FFFFFF;
  --danger: #C24545;
  --ok: #3E8E5C;

  --bg: var(--cream);
  --card: var(--white);
  --text: var(--ink);
  --text-soft: var(--ink-soft);
  --border: var(--line);
  --shadow: 0 2px 10px rgba(58,42,34,0.08), 0 1px 2px rgba(58,42,34,0.06);
  --radius: 18px;
  --radius-sm: 12px;
  --touch: 48px;
}
[data-theme="dark"] {
  --bg: #23201B;
  --card: #2E2A23;
  --cream-card: #35312A;
  --text: #F3EEE0;
  --text-soft: #C9BEB0;
  --border: #464035;
  --sage: #253347;
  --shadow: 0 2px 12px rgba(0,0,0,0.35);
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
#judy-app {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}
#judy-app h1, #judy-app h2, #judy-app h3, #judy-app .display {
  font-family: 'Baloo 2', system-ui, sans-serif;
  font-weight: 700;
  color: var(--pine);
  margin: 0 0 8px;
}
[data-theme="dark"] #judy-app h1, [data-theme="dark"] #judy-app h2,
[data-theme="dark"] #judy-app h3, [data-theme="dark"] #judy-app .display { color: #6FA8FF; }

#judy-app button, #judy-app input, #judy-app select { font-family: inherit; }
#judy-app .visually-hidden {
  position: absolute; width:1px; height:1px; overflow:hidden; clip: rect(0,0,0,0);
}
#judy-app :focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  #judy-app * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

.jt-container { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
.jt-topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 16px; background: var(--pine); color: var(--white);
  position: sticky; top:0; z-index: 20;
}
.jt-topbar .brand { display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.15rem; color:var(--white); }
.jt-topbar button.icon-btn {
  background: rgba(255,255,255,0.15); border:none; color:var(--white);
  border-radius: 999px; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:1.1rem;
}
.jt-topbar button.icon-btn:hover { background: rgba(255,255,255,0.28); }
.jt-topbar-actions { display:flex; gap:8px; }

/* ---------- Trail dashboard (signature element) ---------- */
.trail-wrap { position:relative; padding: 28px 6px 10px; }
.trail-svg { width:100%; height:auto; display:block; }
.trail-node-btn {
  position:absolute; transform: translate(-50%,-50%);
  width: 84px; text-align:center; background:none; border:none; cursor:pointer;
  color: var(--text); padding:0;
}
.trail-node-circle {
  width:64px; height:64px; border-radius:50%; margin:0 auto 4px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.7rem; box-shadow: var(--shadow); border: 3px solid var(--card);
  transition: transform .15s;
}
.trail-node-btn:hover .trail-node-circle { transform: scale(1.06); }
.trail-node-label { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.78rem; line-height:1.15; }
.trail-node-pct { font-size:0.7rem; color: var(--text-soft); }

.judy-marker { position:absolute; width:46px; height:46px; transform: translate(-50%,-100%); pointer-events:none; }

/* ---------- Cards / generic components ---------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border);
}
.card-row { display:flex; gap:14px; align-items:center; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
  border-radius: 999px; padding: 12px 22px; min-height: var(--touch);
  border: none; cursor:pointer; transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--coral); color:white; box-shadow: 0 3px 0 var(--coral-dark); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-secondary { background: var(--sage); color: var(--pine-dark); }
.btn-ghost { background: transparent; color: var(--pine); border:2px solid var(--pine); }
[data-theme="dark"] .btn-ghost { color: var(--mustard); border-color: var(--mustard); }
.btn-sm { padding: 8px 16px; min-height:40px; font-size:0.9rem; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn-block { width:100%; }

.pill { display:inline-block; padding: 3px 11px; border-radius:999px; font-size:0.78rem; font-weight:700; }
.pill-sense { background:#DCEBE3; color:#1F5C3E; }
.pill-comp { background:#F6DFCB; color:#8C4A1E; }
.pill-alg { background:#E5DBF3; color:#5B3894; }
.pill-geo { background:#D9E8F2; color:#245A80; }
.pill-meas { background:#FCE7C8; color:#8A5A0D; }
.pill-data { background:#F3D9E0; color:#8E2F4C; }
[data-theme="dark"] .pill { filter: brightness(1.15) saturate(0.9); }

.progress-track { background: var(--sage); border-radius:999px; height:12px; overflow:hidden; }
.progress-fill { background: linear-gradient(90deg, var(--coral), var(--mustard)); height:100%; border-radius:999px; transition: width .4s; }

.badge-start { background: var(--coral); color:white; font-size:0.7rem; font-weight:700; padding:2px 9px; border-radius:999px; }

/* ---------- Judy mascot & speech bubble ---------- */
.judy-panel { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.judy-svg-wrap { flex:0 0 auto; width:64px; height:64px; }
.speech-bubble {
  position:relative; background: var(--cream-card); border:2px solid var(--border);
  border-radius: 16px; padding: 12px 16px; flex:1; font-size:0.98rem; line-height:1.45;
}
.speech-bubble:before {
  content:""; position:absolute; left:-9px; top:18px; width:0; height:0;
  border-top:8px solid transparent; border-bottom:8px solid transparent;
  border-right:9px solid var(--border);
}
.speech-bubble:after {
  content:""; position:absolute; left:-7px; top:18px; width:0; height:0;
  border-top:8px solid transparent; border-bottom:8px solid transparent;
  border-right:9px solid var(--cream-card);
}

/* ---------- Quiz / question card ---------- */
.q-stem { font-size:1.12rem; line-height:1.5; margin-bottom:16px; white-space:pre-line; }
.choice-list { display:flex; flex-direction:column; gap:10px; }
.choice-btn {
  text-align:left; background: var(--cream-card); border:2px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 16px; font-size:1rem; cursor:pointer;
  min-height: var(--touch); display:flex; align-items:center; gap:10px; color:var(--text);
}
.choice-btn:hover { border-color: var(--coral); }
.choice-btn.selected { border-color: var(--pine); background: var(--sage); }
.choice-btn.correct { border-color: var(--ok); background:#DFF3E4; color:#1F5C3E; }
.choice-btn.incorrect { border-color: var(--danger); background:#FBE4E4; color:#7A2626; }
[data-theme="dark"] .choice-btn.correct { background:#204632; color:#B7E8C6; }
[data-theme="dark"] .choice-btn.incorrect { background:#4A2323; color:#F3B8B8; }
.choice-letter {
  flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem;
}
.confidence-row { display:flex; gap:10px; margin: 14px 0; }
.explanation-box { margin-top:14px; padding:12px 14px; border-radius: var(--radius-sm); background: var(--cream-card); border-left:5px solid var(--pine); font-size:0.95rem; }

/* ---------- Exam mode (focused, no global nav) ---------- */
.exam-header { position:sticky; top:0; background: var(--pine-dark); color:white; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; z-index:30; }
.exam-timer { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.1rem; }
.exam-timer.low { color: #FFD3D3; }

/* ---------- Glossary popup ---------- */
.glossary-term { text-decoration: underline dotted; text-decoration-color: var(--coral); cursor:pointer; color: inherit; font-weight:600; }
.glossary-popup {
  position: fixed; inset:0; background: rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.glossary-popup-card { background: var(--card); border-radius: var(--radius); padding:20px; max-width:340px; width:100%; box-shadow: var(--shadow); }

/* ---------- Note bullets ---------- */
.note-bullet { background: var(--cream-card); border-radius: var(--radius-sm); padding:12px 14px; margin-bottom:10px; line-height:1.5; }
.note-bold { color: var(--coral-dark); font-weight:700; }
[data-theme="dark"] .note-bold { color: var(--mustard); }
.note-highlight { background: #FCE9C9; padding:1px 5px; border-radius:5px; }
[data-theme="dark"] .note-highlight { background:#5A4321; color:#FCE9C9; }
.watch-out { background: #FCEFE6; border:2px dashed var(--coral); border-radius: var(--radius-sm); padding: 12px 14px; margin-top:14px; }
[data-theme="dark"] .watch-out { background:#3B2A1E; }

/* ---------- Streak heatmap ---------- */
.heatmap-grid { display:grid; grid-template-columns: repeat(14, 1fr); gap:3px; }
.heatmap-cell { aspect-ratio:1; border-radius:3px; background: var(--sage); }

/* ---------- Misc ---------- */
.review-group-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:10px 0; }
.tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.hidden { display:none !important; }
.two-col { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
@media (max-width:560px) { .two-col { grid-template-columns: 1fr; } }
.center-text { text-align:center; }
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mb0{margin-bottom:0;}
.small-text { font-size:0.86rem; color: var(--text-soft); }

/* ---------- Step-by-step / More Explanations ---------- */
.step-block { background: var(--cream-card); border-radius: var(--radius-sm); padding:14px 16px; margin-bottom:12px; }
.step-list { margin:8px 0 0; padding-left:22px; }
.step-list li { margin-bottom:8px; line-height:1.5; }
.worked-example { background: var(--card); border:2px solid var(--pine); border-radius: var(--radius-sm); padding:12px 14px; margin-top:10px; }
[data-theme="dark"] .worked-example { border-color:#6FA8FF; }
.worked-example .we-title { font-weight:700; color:var(--pine); margin-bottom:6px; }
[data-theme="dark"] .worked-example .we-title { color:#6FA8FF; }
.worked-step { padding:4px 0; border-bottom:1px dashed var(--border); font-size:0.95rem; }
.worked-step:last-child { border-bottom:none; }
.more-expl-box { background:#EAF1FC; border-radius: var(--radius-sm); padding:14px 16px; margin-top:12px; }
[data-theme="dark"] .more-expl-box { background:#1E2C42; }

/* ---------- Clue button/box ---------- */
.clue-box { background:#FFF6E0; border:2px dashed var(--mustard); border-radius: var(--radius-sm); padding:12px 14px; margin-top:12px; }
[data-theme="dark"] .clue-box { background:#3D3316; }

/* ---------- Scratchpad ---------- */
.scratchpad-fab {
  position: fixed; bottom:20px; right:20px; z-index:50;
  width:56px; height:56px; border-radius:50%; background:var(--coral); color:white;
  border:none; box-shadow:0 4px 10px rgba(0,0,0,0.25); font-size:1.4rem; cursor:pointer;
}
.scratchpad-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:10px; }
.scratchpad-panel { background:var(--card); border-radius: var(--radius); padding:12px; width:100%; max-width:680px; box-shadow:var(--shadow); }
.scratchpad-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
.scratchpad-swatch { width:28px; height:28px; border-radius:50%; border:2px solid var(--border); cursor:pointer; }
.scratchpad-swatch.active { border-color: var(--pine); border-width:3px; }
#scratchpad-canvas { touch-action:none; width:100%; height:360px; background:white; border-radius:10px; border:2px solid var(--border); cursor:crosshair; }

/* ---------- Rewards / Collection ---------- */
.badge-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(84px,1fr)); gap:12px; }
.badge-cell { text-align:center; }
.badge-icon-wrap {
  width:64px; height:64px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center;
  font-size:1.8rem; background: var(--cream-card); border:2px solid var(--border);
}
.badge-cell.earned .badge-icon-wrap { background: linear-gradient(135deg, var(--mustard), var(--coral)); border-color: transparent; }
.badge-cell.locked .badge-icon-wrap { filter: grayscale(1); opacity:0.45; }
.badge-name { font-size:0.72rem; font-weight:700; line-height:1.2; }
.toast-reward {
  position: fixed; top:20px; left:50%; transform:translateX(-50%); z-index:300;
  background: var(--card); border-radius: var(--radius); padding:14px 20px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:12px; border:3px solid var(--mustard);
  animation: toast-pop 0.4s ease-out;
}
@keyframes toast-pop { from { transform:translateX(-50%) translateY(-30px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }

/* ---------- Save/Open ---------- */
.save-open-row { display:flex; gap:10px; }
.save-open-row .btn { flex:1; }

/* ---------- Games: combo / lives / confetti ---------- */
.combo-badge { display:inline-block; background:var(--mustard); color:#4A3200; font-weight:700; padding:2px 10px; border-radius:999px; font-size:0.8rem; }
.lives-row { display:flex; gap:4px; font-size:1.3rem; }
.game-timer-bar { height:8px; background:var(--sage); border-radius:999px; overflow:hidden; margin:10px 0; }
.game-timer-fill { height:100%; background: var(--coral); transition: width .1s linear; }
.confetti-burst { position:relative; }
.confetti-piece {
  position:absolute; width:8px; height:8px; top:0; left:50%; opacity:0.9;
  animation: confetti-fall 0.8s ease-out forwards;
}
@keyframes confetti-fall {
  to { transform: translate(var(--dx), 90px) rotate(360deg); opacity:0; }
}
.shake { animation: shake-anim 0.35s; }
@keyframes shake-anim { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

@media print {
  .jt-topbar, .no-print, .btn { display: none !important; }
  #judy-app { background: white; color: black; }
  .card { box-shadow: none; border: 1px solid #ccc; }
}

</style>
</head>

, 8, ...", "mnemonic": null}, "term": {"def": "One single number in a sequence.", "mnemonic": null}, "rule": {"def": "The pattern that tells you how to get from one term to the next.", "mnemonic": null}}, "watchOut": "Don't assume the relationship between two sequences is 'add the same extra amount' — test it on at least two pairs of terms, because it's very often 'multiply by' instead.", "stepByStep": {"title": "Step-by-Step: Finding a Pattern's Rule", "steps": ["Find the difference (or ratio) between the first two terms.", "Check that the same difference (or ratio) works for the next pair of terms too.", "Write the rule in words: 'start at ___, then add/multiply by ___ each time.'", "Apply the rule one more time to find the next term."], "example": {"problem": "Find the next number: 3, 7, 11, 15, ___", "workSteps": ["Step 1 — check the difference: 7 − 3 = 4, 11 − 7 = 4, 15 − 11 = 4", "Step 2 — the rule is 'add 4 each time'", "Step 3 — apply it: 15 + 4 = 19"], "answer": "19"}}, "moreExplanations": {"text": "Two related sequences are like two people walking at different speeds starting from the same spot. If one person's steps are always exactly double the other's, then no matter how far they've gone, the faster person's distance will always be double the slower person's distance at the same point in time. That's why checking just ONE pair of matching terms can reveal the whole relationship — but always check a second pair too, to be sure the pattern isn't a coincidence."}}, "practicePool": [{"id": "R0468", "stem": "Sequence X: multiples of 2 starting at 0 (0, 2, 4, 6, 8).\nSequence Y: multiples of 3 starting at 0 (0, 3, 6, 9, 12).\nWhat ordered pair (x, y) matches term number 4 from each sequence?", "choices": ["(6, 9)", "(4, 9)", "(6, 6)", "(9, 6)"], "correctIndex": 0, "explanations": ["Correct — pair the matching terms from each sequence in order.", "This uses the x-value from the wrong term.", "This uses the y-value from the wrong term.", "This swaps which seque "standard": "5.NBT.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0521", "stem": "Which expression shows 56,147 written in expanded form?", "choices": ["50,000 + 6,000 + 100 + 40 + 7", "40,000 + 6,000 + 100 + 40 + 7", "50,000 + 6,000 + 100 + 40 + 8", "50,000 + 6,000 + 100 + 50 + 7"], "correctIndex": 0, "explanations": ["Correct — each digit is multiplied by its place value.", "One digit's place value doesn't match its position in the original number.", "One digit's place value doesn't match its position in the original number.", "One digit's place value doesn't match its position in the original number."], "unit": "nbt", "sub": "nbt1", "iowaCat": "NumberSense", "standard": "5.NBT.3a", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0522", "stem": "In which number does the digit 6 represent a value that is ten times the value represented by the digit 6 in 333,667?", "choices": ["333,667", "901,675", "333,666", "980,824"], "correctIndex": 0, "explanations": ["Correct — moving the digit one place to the left multiplies its value by 10.", "This shifts the 6 to the wrong place value column.", "This shifts the 6 to the wrong place value column.", "This shifts the 6 to the wrong place value column."], "unit": "nbt", "sub": "nbt1", "iowaCat": "NumberSense", "standard": "5.NBT.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "nbt2", "name": "Multi-Digit Addition, Subtraction & Multiplication", "notes": {"title": "Multi-Digit Addition, Subtraction & Multiplication", "hook": "Judy remembers a tricky carrot-count mix-up: \"This is the one I want us to nail down completely — regrouping across zeros and carrying in multiplication. Once these two tricks click, this whole section gets so much easier.\"", "bullets": ["When subtracting and you hit a {b}zero{b/} you need to borrow from, you have to borrow from the NEXT nonzero digit and turn every zero in between into a 9 (the very last one becomes 10) before subtracting.", "Example: 5,000 − 1,634 → borrow across all three zeros: 5,000 becomes 4 thousands, 9 hundreds, 9 tens, 10 ones → subtract normally from there.", "When multiplying, if a partial product is 10 or more, {w}you must carry the tens digit and ADD it{w/} to the next column's product — forgetting this carry is the single most common multiplication mistake at this grade.", "Always estimate first (round both numbers) so you can sanity-check whether your exact answer is in the right ballpark."], "glossary": {"regroup": {"def": "Trading one unit from a bigger place value for ten units of a smaller place value (or vice versa) — the modern word for 'borrowing' or 'carrying.'", "mnemonic": null}, "carry": {"def": "Moving a regrouped ten from one column into the next column during addition or multiplication.", "mnemonic": null}, "difference": {"def": "The answer to a subtraction problem.", "mnemonic": null}}, "watchOut": "Before subtracting across zeros, rewrite the top number showing every regrouped digit — doing it in your head is exactly where the borrow-across-zero mistake sneaks in.", "stepByStep": {"title": "Step-by-Step: Subtracting Across Zeros (and Multiplying Big Numbers)", "steps": ["SUBTRACTION — find the first zero you'd need to borrow from. Instead, go further left to the first non-zero digit.", "Borrow from that non-zero digit, which turns every zero in between into a 9, and the very last one into a 10.", "Now subtract normally, column by column, from right to left.", "MULTIPLICATION — for a bigger multiplier, multiply by each digit separately (making one partial product per digit), shifting each partial product one place left, then add all the partial products together."], "example": {"problem": "5,000 − 1,634 = ?", "workSteps": ["Step 1 — every digit after the 5 is a zero, so borrow from the 5 itself", "Step 2 — the 5 becomes 4; every 0 in between becomes 9; the last 0 becomes 10", "Step 3 — now it reads like 4, 9, 9, 10 — subtract normally: 10−4=6, 9−3=6, 9−6=3, 4−1=3"], "answer": "3,366"}, "example2": {"problem": "213 × 4 (a preview of the big-number method)", "workSteps": ["Step 1 — multiply the ones: 3 × 4 = 12 → write 2, carry the 1", "Step 2 — multiply the tens: 1 × 4 = 4, plus the carried 1 = 5", "Step 3 — multiply the hundreds: 2 × 4 = 8"], "answer": "852"}}, "moreExplanations": {"text": "SUBTRACTING ACROSS ZEROS, another way to see it: think of 5,000 as 4 thousands + 10 hundreds. You're not borrowing from thin air — you're just trading one bigger unit (a thousand) for ten of the next-smaller unit (a hundred), the same way you'd trade a $100 bill for ten $10 bills before making change. Every zero in the way has to make that same trade, one step at a time, which is why they all turn into 9's except the very last one, which becomes a 10.\n\nMULTIPLYING BIGGER NUMBERS, another way to see it: 4,532 × 217 looks scary, but it's really just three easier problems stacked up: 4,532 × 200, plus 4,532 × 10, plus 4,532 × 7 — then add all three answers together. Each digit of the bottom number gets its own turn, and each one's answer gets shifted one more place to the left (that's the 'shift' that's so easy to forget).", "example3": {"problem": "1,234 × 3 (seeing the shift idea with a smaller number first)", "workSteps": ["Break 1,234 into 1,000 + 200 + 30 + 4", "Multiply each part by 3: 3,000 + 600 + 90 + 12", "Add them together: 3,000 + 600 + 90 + 12 = 3,702"], "answer": "3,702 (same answer as multiplying 1,234 × 3 directly — this is exactly what the standard algorithm is doing behind the scenes!)"}}}, "practicePool": [{"id": "R0531", "stem": "4,647 + 2,955 = ?", "choices": ["7,602", "7,062", "7,502", "7,612"], "correctIndex": 0, "explanations": ["Correct sum with regrouping carried into the next column.", "Digits got swapped in the final answer.", "This is short by not carrying a regrouped ten into the next column.", "Off by a small carrying slip."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0532", "stem": "1,465 × 511 = ?", "choices": ["748,615", "747,150", "10,255", "748,515"], "correctIndex": 0, "explanations": ["Correct — break it into three partial products (one per digit of the 3-digit number), shifting each one left, then add all three.", "This drops one of the three partial-product rows before adding — very easy to do with a 3-digit multiplier.", "This adds the partial products without shifting them left first, as if they were all in the ones place.", "Close, but a small slip in one of the partial products."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0533", "stem": "68 × 6 = ?", "choices": ["408", "368", "398", "414"], "correctIndex": 0, "explanations": ["Correct — remember to add the carried ten when you multiply the next place value.", "This multiplies the ones digit correctly but forgets to add the carry when multiplying the tens digit.", "This is 10 less than the correct product — a common carrying slip.", "This is one extra group of the multiplier too many."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0534", "stem": "7,995 − 769 = ?", "choices": ["7,226", "7,234", "7,225", "7,236"], "correctIndex": 0, "explanations": ["Correct subtraction with regrouping where needed.", "This subtracts each column separately without regrouping.", "Digits got swapped when writing the final answer.", "Off by a small regrouping slip."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0535", "stem": "4,126 × 211 = ?", "choices": ["870,586", "866,460", "16,504", "870,486"], "correctIndex": 0, "explanations": ["Correct — t first, as if they were all in the ones place.", "Close, but a small slip in one of the partial products."], "unit": "nbt", "sub": "nbt2", "iowaCat": "Computation", "standard": "5.NBT.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "nbt3", "name": "Multi-Digit Division & Decimal Operations", "notes": {"title": "Multi-Digit Division & Decimal Operations", "hook": "Judy lines up decimal points like carrots in a perfectly straight garden row: \"Two rules save you here: never skip a zero in the middle of a division answer, and always, ALWAYS line up the decimal points before you add or subtract.\"", "bullets": ["In long division, if a step has {b}nothing to bring down into{b/} a place, you must still write a 0 in the quotient for that place before continuing — skipping it is the #1 division mistake at this grade (756 ÷ 7 = 108, not 18!).", "Multiplying decimals: multiply as if there were no decimal points, then count the total decimal places in both factors and place the decimal point that many spots from the right in the answer.", "{w}Adding or subtracting decimals requires lining up the decimal points{w/} first (stack them vertically), not lining up the digits from the left — this is different from whole-number addition.", "You can add zeros after the last decimal digit without changing the value (4.5 = 4.50) — this helps line up columns when the decimals have different lengths."], "glossary": {"quotient": {"def": "The answer to a division problem.", "mnemonic": null}, "dividend": {"def": "The number being divided (the one going 'into the house' in long division).", "mnemonic": null}, "decimal point": {"def": "The dot that separates the whole-number part of a number from its fractional part.", "mnemonic": null}}, "watchOut": "Before subtracting decimals, rewrite both numbers stacked with decimal points directly above each other — never estimate the alignment by eye.", "stepByStep": {"title": "Step-by-Step: Long Division and Decimal Operations", "steps": ["LONG DIVISION — divide, multiply, subtract, bring down — one digit of the dividend at a time.", "If a step has nothing new to bring down into, write a 0 in the quotient for that spot and keep going (don't skip it!).", "DECIMALS (add/subtract) — stack the numbers so the decimal points line up in a column, adding zeros as needed, then add/subtract as usual.", "DECIMALS (divide by a whole number) — divide like normal, then bring the decimal point straight up into the same spot in the quotient."], "example": {"problem": "756 ÷ 7 = ?", "workSteps": ["Step 1 — 7 goes into 7 exactly 1 time → quotient so far: 1", "Step 2 — bring down the 5. 7 doesn't go into 5, so write 0 in the quotient → quotient so far: 10", "Step 3 — bring down the 6, making 56. 7 goes into 56 exactly 8 times → quotient: 108"], "answer": "108"}, "example2": {"problem": "10.5 − 4.72 = ? (decimal subtraction)", "workSteps": ["Step 1 — line up decimal points: 10.50 above 4.72 (add a zero to 10.5 so both have 2 decimal places)", "Step 2 — subtract the hundredths: 0 − 2 needs borrowing → 10 − 2 = 8, borrow from the tenths", "Step 3 — subtract the tenths: 4 (after borrowing) − 7 needs borrowing again → 14 − 7 = 7, borrow from the ones", "Step 4 — finish subtracting the whole numbers: 9 − 4 = 5"], "answer": "5.78"}}, "moreExplanations": {"text": "LONG DIVISION, another way to see it: division is really just 'how many groups can I make?' repeated over and over, one digit at a time, from left to right. Every time you 'bring down' a digit, you're asking the same question again with a slightly bigger number. If the answer to 'how many groups' is zero for a step, you still have to WRITE that zero — skipping it is like skipping a step count entirely, which shifts every digit after it into the wrong place.\n\nDECIMAL SUBTRACTION, another way to see it: decimal points MUST line up vertically because they mark where the 'ones' place is. If you don't line them up, you're accidentally adding or subtracting a tenths digit from a ones digit — like mixing up dimes and dollars. Writing extra zeros (10.5 becomes 10.50) never changes the value, and it makes lining up the columns much easier.", "example3": {"problem": "312 ÷ 3 (a cleaner walk-through of the 4-step division cycle)", "workSteps": ["Divide: how many 3's in 3? → 1. Multiply: 1×3=3. Subtract: 3−3=0.", "Bring down the 1. Divide: how many 3's in 1? → 0 (write the 0!). Multiply: 0×3=0. Subtract: 1−0=1.", "Bring down the 2, making 12. Divide: how many 3's in 12? → 4. Multiply: 4×3=12. Subtract: 12−12=0."], "answer": "104"}}}, "practicePool": [{"id": "R0575", "stem": "61.63 + 57.3 = ?", "choices": ["118.93", "117.93", "119.03", "118.94"], "correctIndex": 0, "explanations": ["Correct — line up the decimal points, then add.", "This lines up digits from the left instead of the decimal point.", "This is 1 too low — check for a missed carry.", "Off by a small amount — recheck the hundredths column."], "unit": "nbt", "sub": "nbt3", "iowaCat": "Computation", "standard": "5.NBT.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0576", "stem": "18 ÷ 3 = ?", "choices": ["6.0", "60.0", "0.60", "7.0"], "correctIndex": 0, "explanations": ["Correct — bring the decimal point straight up into the quotient, then divide as usual.", "This divides the digits correctly but places the decimal point one spot too far right.", "This divides the digits correctly but places the decimal point one spot too far left.", "Close, but off by 1 in the final digit."], "unit": "nbt", "sub": "nbt3", "iowaCat": "Computation", "standard": "5.NBT.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0577", "stem": "2.8 ÷ 2 = ?", "choices": ["1.4", "14.0", "0.14", "2.4"], "correctIndex": 0, "explanations": ["Correct — bring the decimal point straight up into the quotient, then divide as usual.", "This divides the digits correctly but places the decimal point one spot too far right.", "This divid  many equal parts the whole is split into.", "mnemonic": "Denominator starts with 'D' for 'Down' — it's the number on the bottom."}, "numerator": {"def": "The top number of a fraction, showing how many of the equal parts you have.", "mnemonic": null}, "common denominator": {"def": "A shared denominator that two or more fractions can be rewritten with so they can be added or subtracted.", "mnemonic": null}}, "watchOut": "Adding straight across (numerator + numerator over denominator + denominator) is the single most common fraction mistake — it looks tempting but it's never correct.", "stepByStep": {"title": "Step-by-Step: Adding or Subtracting Fractions", "steps": ["Check the denominators (bottom numbers). If they're already the same, skip to Step 3.", "If they're different, find a common denominator — the easiest one is just multiplying the two denominators together.", "Convert each fraction to the new denominator: whatever you multiply the bottom by, multiply the top by the same amount.", "Now that the denominators match, add or subtract ONLY the numerators (top numbers). The denominator stays the same.", "Simplify the answer if possible (see if the top and bottom share a common factor)."], "example": {"problem": "1/4 + 1/3 = ?", "workSteps": ["Step 1 — denominators (4 and 3) are different", "Step 2 — common denominator = 4 × 3 = 12", "Step 3 — convert: 1/4 = 3/12 (multiplied top and bottom by 3); 1/3 = 4/12 (multiplied top and bottom by 4)", "Step 4 — add numerators: 3/12 + 4/12 = 7/12"], "answer": "7/12"}, "example2": {"problem": "3/4 − 1/2 = ? (subtraction version)", "workSteps": ["Step 1 — common denominator = 4 × 2 = 8 (or notice 4 is already a multiple of 2, so 4 works too — we'll use 4 since it's simpler)", "Step 2 — convert 1/2 to fourths: 1/2 = 2/4 (multiplied top and bottom by 2); 3/4 stays the same", "Step 3 — subtract numerators: 3/4 − 2/4 = 1/4"], "answer": "1/4"}}, "moreExplanations": {"text": "Picture two pizzas cut differently — one cut into 4 slices, one cut into 3 slices. You can't compare '1 slice' from each pizza fairly, because the slices are different sizes! A common denominator re-cuts BOTH pizzas into the same size slices (in this case, 12ths) so that comparing (or combining) them is fair. Multiplying the two denominators together (4 × 3 = 12) always gives you a size that works for both pizzas, even if it's not the smallest possible size.", "example3": {"problem": "2/6 + 1/6 = ? (same denominator already — the easy case)", "workSteps": ["The denominators already match (both are 6ths), so skip straight to adding numerators", "2 + 1 = 3, so the answer is 3/6", "Simplify: 3/6 = 1/2"], "answer": "1/2"}}}, "practicePool": [{"id": "R0619", "stem": "1/5 + 4/6 = ?", "choices": ["13/15", "5/11", "1/6", "14/15"], "correctIndex": 0, "explanations": ["Correct — find a common denominator, convert both fractions, then add the numerators.", "This adds the numerators and denominators straight across instead of finding a common denominator.", "This finds a common denominator but forgets to convert the numerators to match.", "Close, but a small slip in the numerator."], "unit": "nf", "sub": "nf1", "iowaCat": "Computation", "standard": "5.NF.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0620", "stem": "3/4 − 1/2 = ?", "choices": ["1/4", "1", "1/2", "0"], "correctIndex": 0, "explanations": ["Correct — find a common denominator, convert both fractions, then subtract the numerators.", "This subtracts the numerators and denominators straight across instead of finding a common denominator.", "This finds a common denominator but forgets to convert the numerators to match.", "Close, but a small slip in the numerator."], "unit": "nf", "sub": "nf1", "iowaCat": "Computation", "standard": "5.NF.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0621", "stem": "1/4 + 1/2 = ?", "choices": ["3/4", "1/3", "1/4", "1"], "correctIndex": 0, "explanations": ["Correct — find a mall amount in the numerator."], "unit": "nf", "sub": "nf1", "iowaCat": "NumberSense", "standard": "5.NF.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0646", "stem": "Maryam has a whole board. Maryam uses 3/5 of it. What fraction of the board is left?", "choices": ["2/5", "3/5", "1/5", "4/5"], "correctIndex": 0, "explanations": ["Correct — subtract the used fraction from the whole (which is d/d).", "This states the fraction that was used, not what's left.", "This miscounts how much remains.", "Off by a small amount in the numerator."], "unit": "nf", "sub": "nf1", "iowaCat": "NumberSense", "standard": "5.NF.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "nf2", "name": "Multiplying Fractions", "notes": {"title": "Multiplying Fractions", "hook": "Judy says, \"Here's the fun surprise — multiplying fractions is actually EASIER than adding them. No common denominator needed at all. Straight across, every time.\"", "bullets": ["To multiply two fractions, multiply the {b}numerators together{b/} and the denominators together — no common denominator needed.", "To multiply a whole number by a fraction, multiply the whole number by the numerator only; the denominator stays the same.", "{w}\"Times as much/many\" in a word problem means multiply{w/}, even when the multiplier is a fraction less than 1 (which will make the result smaller, not bigger).", "Multiplying by a fraction less than 1 always makes the result smaller than the original number — a good way to sanity-check your answer."], "glossary": {"product": {"def": "The answer to a multiplication problem.", "mnemonic": null}, "factor": {"def": "A number being multiplied.", "mnemonic": null}}, "watchOut": "Don't cross-multiply when the problem asks you to MULTIPLY two fractions — cross-multiplying is for comparing or solving proportions, not for finding a product.", "stepByStep": {"title": "Step-by-Step: Multiplying Fractions", "steps": ["Good news — multiplying fractions is more direct than adding them: no common denominator needed at all.", "Multiply the two numerators (top numbers) together to get the new numerator.", "Multiply the two denominators (bottom numbers) together to get the new denominator.", "Simplify the answer if possible.", "If one number is a whole number, just multiply it by the numerator — the denominator stays exactly the same."], "example": {"problem": "2/3 × 3/5 = ?", "workSteps": ["Step 1 — multiply numerators: 2 × 3 = 6", "Step 2 — multiply denominators: 3 × 5 = 15", "Step 3 — simplify 6/15: both share a factor of 3 → 6÷3=2, 15÷3=5"], "answer": "2/5"}, "example2": {"problem": "4 × 2/5 = ? (whole number × fraction)", "workSteps": ["Step 1 — multiply the whole number by the numerator only: 4 × 2 = 8", "Step 2 — the denominator stays the same: 5"], "answer": "8/5, which is the same as 1 3/5"}}, "moreExplanations": {"text": "Here's why multiplying fractions doesn't need a common denominator: multiplication is about finding 'a part of a part.' 2/3 × 3/5 is really asking 'what is 2/3 of 3/5?' If you draw a rectangle, shade 3/5 of it one way and 2/3 of that shaded part the other way, the double-shaded overlap is exactly 2/3 × 3/5 of the whole rectangle — and that overlap naturally comes out to (2×3) over (3×5), which is exactly the 'multiply straight across' rule.", "example3": {"problem": "1/2 × 1/2 = ? (the simplest possible case)", "workSteps": ["Multiply numerators: 1 × 1 = 1", "Multiply denominators: 2 × 2 = 4"], "answer": "1/4 (makes sense — half of a half is a quarter!)"}}}, "practicePool": [{"id": "R0659", "stem": "2/3 × 1/2 = ?", "choices": ["1/3", "4/3", "3/5", "2/3"], "correctIndex": 0, "explanations": ["Correct — multiply numerator × numerator and denominator × denominator.", "This cross-multiplies instead of multiplying straight across.", "This adds the fractions instead of multiplying.", "Off by a small slip in the numerator."], "unit": "nf", "sub": "nf2", "iowaCat": "Computation", "st enominator, multiply by the numerator).", "This multiplies the total by the numerator without dividing by the denominator.", "This only divides by the denominator without multiplying by the numerator.", "Off by one group."], "unit": "nf", "sub": "nf2", "iowaCat": "NumberSense", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0687", "stem": "Zainab has 15 marbles. 2/5 of them are blue. How many blue marbles does Zainab have?", "choices": ["6", "30", "3", "11"], "correctIndex": 0, "explanations": ["Correct — multiply the total by the fraction (divide by the denominator, multiply by the numerator).", "This multiplies the total by the numerator without dividing by the denominator.", "This only divides by the denominator without multiplying by the numerator.", "Off by one group."], "unit": "nf", "sub": "nf2", "iowaCat": "NumberSense", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0688", "stem": "Hamza has 20 marbles. 3/5 of them are blue. How many blue marbles does Hamza have?", "choices": ["12", "60", "4", "17"], "correctIndex": 0, "explanations": ["Correct — multiply the total by the fraction (divide by the denominator, multiply by the numerator).", "This multiplies the total by the numerator without dividing by the denominator.", "This only divides by the denominator without multiplying by the numerator.", "Off by one group."], "unit": "nf", "sub": "nf2", "iowaCat": "NumberSense", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0689", "stem": "Amina has 18 marbles. 1/3 of them are blue. How many blue marbles does Amina have?", "choices": ["6", "18", "9", "7"], "correctIndex": 0, "explanations": ["Correct — multiply the total by the fraction (divide by the denominator, multiply by the numerator).", "This multiplies the total by the numerator without dividing by the denominator.", "This only divides by the denominator without multiplying by the numerator.", "Off by one group."], "unit": "nf", "sub": "nf2", "iowaCat": "NumberSense", "standard": "5.NF.4", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "nf3", "name": "Dividing Fractions", "notes": {"title": "Dividing Fractions", "hook": "Judy flips a carrot slice upside down with a grin: \"Dividing by a fraction has a secret shortcut — flip the second number over and multiply instead. It feels like magic, but it always works!\"", "bullets": ["Dividing by a whole number is the same as {b}multiplying by its reciprocal{b/} (1 over that number) — 1/3 ÷ 4 = 1/3 × 1/4.", "Dividing a whole number by a unit fraction means multiplying the whole number by the denominator — 6 ÷ 1/4 = 6 × 4.", "{w}Only the SECOND number in the division gets flipped{w/} (the one you're dividing by) — never flip the first number.", "Dividing by a fraction smaller than 1 always makes the answer bigger than the original number — the opposite of what many students expect."], "glossary": {"reciprocal": {"def": "A fraction flipped upside down (numerator and denominator swapped); a number times its reciprocal always equals 1.", "mnemonic": "Reciprocal = 'flip and multiply.'"}, "unit fraction": {"def": "A fraction with 1 as the numerator, like 1/4 or 1/8.", "mnemonic": null}}, "watchOut": "\"Keep, change, flip\" only flips the SECOND fraction — a common slip is flipping the first one by mistake, which gives the reciprocal of the correct answer.", "stepByStep": {"title": "Step-by-Step: Dividing Fractions ('Keep, Change, Flip')", "steps": ["KEEP the first fraction (or whole number) exactly as it is.", "CHANGE the division sign (÷) to a multiplication sign (×).", "FLIP the second number — swap its numerator and denominator (this is called its reciprocal). If it's a whole number, think of it as that number over 1, then flip it.", "Now multiply straight across, just like regular fraction multiplication.", "Simplify if possible."], "example": {"problem": "1/3 ÷ 4 = ?", "workSteps": ["Step 1 — keep 1/3 as it is", "Step 2 — change ÷ to ×", "Step 3 — flip 4 (which is 4/1) to get 1/4", "Step 4 — multiply: 1/3 × 1/4 = 1/12"], "answer": "1/12"}, "example2": {"problem": "6 ÷ 1/2 = ? (whole number divided by a fraction)", "workSteps": ["Step 1 — keep 6 (think of it as 6/1)", "Step 2 — change ÷ to ×", "Step 3 — flip 1/2 to get 2/1 (which is just 2)", "Step 4 — multiply: 6 × 2 = 12"], "answer": "12 (makes sense — there are 12 halves in 6 wholes!)"}}, "moreExplanations": {"text": "Here's WHY 'keep, change, flip' actually works, not just how: dividing by 4 is the exact same thing as multiplying by 1/4 (its reciprocal) — try it with regular numbers: 12 ÷ 4 = 3, and 12 × 1/4 = 3 too! The same rule applies to fractions dividing by fractions. So 'flipping and multiplying' isn't a random trick — it's just switching division into an equivalent multiplication problem, which you already know how to do.", "example3": {"problem": "1/2 ÷ 1/4 = ? (fraction divided by fraction)", "workSteps": ["Keep 1/2, change ÷ to ×, flip 1/4 to 4/1", "Multiply: 1/2 × 4/1 = 4/2", "Simplify: 4/2 = 2"], "answer": "2 (makes sense — there are 2 fourths in a half!)"}}}, "practicePool": [{"id": "R0699", "stem": "4 ÷ 1/4 = ?", "choices": ["16", "1", "8", "12"], "correctIndex": 0, "explanations": ["Correct — dividing by a unit fraction is the same as multiplying by its reciprocal: whole × d.", "This divides the whole number by d instead of multiplying.", "This adds d instead of multiplying by it.", "Off by one group of the unit fraction."], "unit": "nf", "sub": "nf3", "iowaCat": "Computation", "standard": "5.NF.7", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0701", "stem": "4 ÷ 1/2 = ?", "choices": ["8", "2", "6", "9"], "correctIndex": 0, "explanations": ["Correct — dividing by a unit fraction is the same as multiplying by its reciprocal: whole × d.", "This divides the whole number by d instead of multiplying.", "This ad stead of adding the two volumes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0779", "stem": "A figure is made of two rectangular prisms stacked together. The first prism is 5 by 2 by 4 inches. The second prism is 4 by 4 by 3 inches. What is the total volume of the figure, in cubic inches?", "choices": ["88", "40", "48", "8"], "correctIndex": 0, "explanations": ["Correct — find each prism's volume separately, then add them together.", "This only counts the first prism.", "This only counts the second prism.", "This subtracts instead of adding the two volumes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0780", "stem": "A student builds a rectangular box out of 1-inch unit cubes: 3 cubes long, 2 cubes wide, and 4 cubes tall. What is the volume of the box, in cubic inches?", "choices": ["24", "10", "9", "27"], "correctIndex": 0, "explanations": ["Correct — count the total unit cubes: length × width × height.", "This only accounts for one layer, not the full height.", "This adds the dimensions instead of multiplying them.", "This overcounts by one row of cubes."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0781", "stem": "A right rectangular prism has a length of 2 feet, a width of 3 feet, and a height of 6 feet. What is its volume, in cubic feet?", "choices": ["36", "12", "11", "72"], "correctIndex": 0, "explanations": ["Correct — Volume = length × width × height.", "This multiplies only two dimensions and adds the third.", "This adds all three dimensions instead of multiplying.", "This calculates surface area instead of volume."], "unit": "md", "sub": "md2", "iowaCat": "Measurement", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}]}, {"id": "md3", "name": "Line Plots & Data with Fractions", "notes": {"title": "Line Plots & Data with Fractions", "hook": "Judy points at a row of X's stacked above a number line: \"Each X on a line plot is one real measurement — like one bag of trail mix. Taller stacks mean more bags weighed that exact amount.\"", "bullets": ["A line plot shows data above a number line — the {b}number of X's{b/} stacked above a value tells how many data points had that exact value.", "To find a total from a line plot, add up every individual data point shown (not just the labels) — a value with 3 X's above it gets counted 3 times.", "The tallest stack of X's shows the {w}most common{w/} value — but don't confuse 'most common value' with 'largest value' on the number line.", "Fractional line plots (in halves, fourths, or eighths) work exactly the same way as whole-number line plots — just add the fractions using a common denominator."], "glossary": {"line plot": {"def": "A graph that shows data as marks (usually X's) above a number line.", "mnemonic": null}, "data point": {"def": "One single piece of collected information, like the weight of one bag.", "mnemonic": null}}, "watchOut": "When a value has more than one X above it, you must count it that many times when adding — it's easy to accidentally add it only once.", "stepByStep": {"title": "Step-by-Step: Reading a Line Plot", "steps": ["Look at the number line along the bottom — those are the possible values.", "Count how many X's are stacked above each value.", "To find a total, add up every individual value — if a value has 3 X's above it, count that value 3 times.", "To find the most common value, look for the tallest stack of X's."], "example": {"problem": "A line plot shows: 2 X's above 1/4, and 1 X above 1/2. What's the total?", "workSteps": ["Step 1 — count the 1/4's twice: 1/4 + 1/4 = 2/4", "Step 2 — add the 1/2: 2/4 + 1/2 = 2/4 + 2/4 = 4/4"], "answer": "4/4, which equals 1 whole"}}, "moreExplanations": {"text": "A line plot is just a tally chart turned sideways along a number line. Every single X represents one real measurement someone actually took — nothing is 'averaged' or 'combined' on the plot itself. So when you add up a line plot's data, you're literally re-adding every individual measurement, one X at a time, exactly as if you had the original list of numbers in front of you."}}, "practicePool": [{"id": "R0789", "stem": "A line plot shows how long students read: 1 student read for 1/4 hour(s), 2 students read for 1/2 hour(s), 1 student read for 3/4 hour(s), 3 students read for 1 hour(s). Which reading time occurs most often?", "choices": ["1", "1/4", "1/2", "3/4"], "correctIndex": 0, "explanations": ["Correct — this reading time has the tallest stack of X's on the line plot.", "This reading time occurs, but not the most often.", "This reading time occurs, but not the most often.", "This reading time occurs, but not the most often."], "unit": "md", "sub": "md3", "iowaCat": "DataAnalysis", "standard": "5.MD.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0790", "stem": "A line plot shows the weights of several bags of trail mix: 1 bag(s) weighing 1/8 lb, 1 bag(s) weighing 3/8 lb, 2 bag(s) weighing 4/8 lb, 1 bag(s) weighing 5/8 lb, 1 bag(s) weighing 6/8 lb. What is the total weight, in pounds, of all the bags?", "choices": ["23/8", "3", "11/4", "3/4"], "correctIndex": 0, "explanations": ["Correct — add every bag's weight shown on the line plot.", "This is off by one bag's weight.", "This is off in the other direction by one bag's weight.", "This just counts the number of bags instead of adding their weights."], "unit": "md", "sub": "md3", "iowaCat": "DataAnalysis", "standard": "5.MD.2", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0791", "stem": "The table below shows the amount of snow that fell each month: April: 29 inches; May: 36 inches; March: 16 inches. What is the total amou ep: Plotting a Point", "steps": ["Start at the origin (0, 0).", "Move RIGHT along the x-axis the number of spaces the first number (x) tells you.", "From there, move UP the number of spaces the second number (y) tells you.", "Mark the point — that's your ordered pair (x, y)."], "example": {"problem": "Plot the point (3, 5).", "workSteps": ["Step 1 — start at (0, 0)", "Step 2 — move right 3 spaces", "Step 3 — move up 5 spaces"], "answer": "The point lands at (3, 5)"}}, "moreExplanations": {"text": "A good memory trick: 'you run before you climb.' On the coordinate plane, you always move sideways (run, along the x-axis) before you move up or down (climb, along the y-axis) — matching the order the numbers are written in (x, y). If you ever mix up which number to use first, just remember: x comes before y in the alphabet, and 'along the hall before up the stairs' in real life."}}, "practicePool": [{"id": "R0869", "stem": "Which ordered pair represents a point located 6 units right and 6 units up from the origin?", "choices": ["(6, 6)", "(7, 6)", "(6, 7)", "(7, 5)"], "correctIndex": 0, "explanations": ["Correct — the first number is how far right (x), the second is how far up (y).", "This swaps the x- and y-coordinates.", "This is off by one in the x-coordinate.", "This is off by one in the y-coordinate."], "unit": "g", "sub": "g2", "iowaCat": "Geometry", "standard": "5.G.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0870", "stem": "Point A is at (1, 2) and Point B is at (9, 2). What is the distance between Point A and Point B?", "choices": ["8", "10", "9", "1"], "correctIndex": 0, "explanations": ["Correct — since both points share the same y-coordinate, subtract the x-coordinates to find the distance.", "This adds the coordinates instead of subtracting.", "This just restates one point's x-coordinate.", "This just restates the other point's x-coordinate."], "unit": "g", "sub": "g2", "iowaCat": "Geometry", "standard": "5.G.1", "tier": 2 et, meters). Area is like counting how many 1-foot square tiles it would take to completely cover the GROUND INSIDE the garden — you get a number in square units, because you're covering a flat surface, not walking a path."}}, "practicePool": [{"id": "R0889", "stem": "On a map, Anas's house is at (0, 1) and the library is at (5, 1), where each grid unit is 1 block. How many blocks does Anas walk going straight from home to the library?", "choices": ["5", "6", "4", "7"], "correctIndex": 0, "explanations": ["Correct — subtract the x-coordinates since both points share the same y-coordinate.", "This adds the coordinates instead of subtracting.", "This restates the library's coordinate instead of finding the distance.", "This restates home's coordinate instead of finding the distance."], "unit": "g", "sub": "g3", "iowaCat": "Geometry", "standard": "5.G.1", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0890", "stem": "Zainab's rectangular yard is 9 meters long and 6 meters wide. Zainab wants to put a fence around the entire yard. How many meters of fencing are needed?", "choices": ["30", "54", "15", "18"], "correctIndex": 0, "explanations": ["Correct — Perimeter = 2 × (length + width), the distance all the way around.", "This calculates area instead of perimeter.", "This only adds one length and one width instead of two of each.", "This only accounts for two of the four sides."], "unit": "g", "sub": "g3", "iowaCat": "Geometry", "standard": "5.MD.5", "tier": 2, "source": null, "diagram": null, "sentenceStem": false}, {"id": "R0891", "stem": "Idris's rectangular yard is 21 meters long and 5 meters wide. Idris wants to put a fence around the entire yard. How many meters of fencing are needed?", "choices": ["52", "105", "26", "42"], "correctIndex": 0, "explanations": ["Correct — Perimeter = 2 × (length + width), the distance all the way around.", "This calculates area instead of perimeter.", "This only adds one length and one width instead of t /* ============================================================
   STORAGE & STATE
   Namespaced under shareefah:math:* (personal, not shared).
   ============================================================ */
const STORE_KEY = "shareefah:math:state";

function defaultState() {
  const perQuestion = {};
  return {
    version: 3,
    settings: { theme: "light", muted: false },
    perQuestion: perQuestion,     // id -> {streak, durable, lastCorrectDay, history:[{ts,correct,confident,day}], wrongChoiceCounts:{idx:count}}
    learned: {},                  // subId -> true (notes screen viewed)
    dayStreak: { current: 0, best: 0, lastActiveDay: null },
    heatmap: {},                  // "YYYY-MM-DD" -> count of attempts that day
    examAttempts: { exam1: null, exam2: null, exam3: null }, // each: {date, scorePart1, scorePart2, total, missedIds:[], predicted, subScores:{subId:{correct,total}}}
    manualFlags: {},              // id -> true (student manually flagged "review this")
    knownWeakSpotsSeeded: false,
    lastRoute: null,
    badges: {},              // badgeId -> earnedAt timestamp
    gameHighScores: { termMatch: 0, speedRound: 0 },
  };
}

let STATE = null;

async function loadState() {
  try {
    const res = await window.storage.get(STORE_KEY, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      STATE = Object.assign(defaultState(), parsed);
      STATE.perQuestion = Object.assign({}, parsed.perQuestion || {});
    } else {
      STATE = defaultState();
    }
  } catch (e) {
    STATE = defaultState();
  }
  seedKnownWeakSpots();
  return STATE;
}

let _saveTimer = null;
function saveState() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      await window.storage.set(STORE_KEY, JSON.stringify(STATE), false);
    } catch (e) {
      console.error("Save failed", e);
    }
  }, 300);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// ---- Explicit "Save to file" / "Open from file" (in addition to the
// automatic browser-local save above) ----------------------------------
function saveProgressToFile() {
  const payload = {
    app: "judys-math-trail",
    savedAt: new Date().toISOString(),
    buildVersion: (STUDY_DATA.meta && STUDY_DATA.meta.buildVersion) || 1,
    state: STATE,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = todayStr();
  a.href = url;
  a.download = `shareefah-math-progress-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function openProgressFromFile(file, onDone) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      const incoming = payload.state || payload; // tolerate a raw state dump too
      if (!incoming || typeof incoming !== "object" || !incoming.perQuestion) {
        throw new Error("This doesn't look like a Judy's Math Trail progress file.");
      }
      STATE = Object.assign(defaultState(), incoming);
      STATE.perQuestion = Object.assign({}, incoming.perQuestion || {});
      seedKnownWeakSpots();
      saveState();
      onDone(null);
    } catch (e) {
      onDone(e);
    }
  };
  reader.onerror = () => onDone(new Error("Couldn't read that file."));
  reader.readAsText(file);
}

function seedKnownWeakSpots() {
  if (STATE.knownWeakSpotsSeeded) return;
  // Pre-seed her real diagnostic weak spots as manual flags so the Review
  // List / Misconception Clinic surface them from the very first session.
  (STUDY_DATA.knownWeakSpots || []).forEach(spot => {
    STATE.manualFlags["__weakspot__" + spot.tag] = { label: spot.label, sub: spot.sub, seeded: true };
  });
  STATE.knownWeakSpotsSeeded = true;
  saveState();
}

function touchDayStreak() {
  const today = todayStr();
  STATE.heatmap[today] = (STATE.heatmap[today] || 0) + 1;
  if (STATE.dayStreak.lastActiveDay === today) { saveState(); return; }
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
  if (STATE.dayStreak.lastActiveDay === yesterday) {
    STATE.dayStreak.current += 1;
  } else {
    STATE.dayStreak.current = 1;
  }
  STATE.dayStreak.best = Math.max(STATE.dayStreak.best, STATE.dayStreak.current);
  STATE.dayStreak.lastActiveDay = today;
  saveState();
}
/* ============================================================
   MASTERY ENGINE
   Clearing rule: 2 confident-correct in a row (any wrong, or any
   unsure-correct, resets the streak). Durable mastery additionally
   requires the two clearing answers to land on different calendar days.
   Mistake tiers checked in priority order: recurring -> slipped ->
   confident-miss -> new-gap (checking "previously solid" BEFORE
   confidence is the fix for the classic misclassification bug).
   ============================================================ */

function getRecord(id) {
  if (!STATE.perQuestion[id]) {
    STATE.perQuestion[id] = {
      history: [], streak: 0, clearDaysLog: [], cleared: false, durable: false,
      everCleared: false, everUnsure: false, wrongChoiceCounts: {}
    };
  }
  return STATE.perQuestion[id];
}

// Returns { tier, correct } where tier is one of
// 'recurring' | 'slipped' | 'confident-miss' | 'new-gap' | null (null if correct)
function recordAttempt(id, { correct, confident, chosenIndex }) {
  const rec = getRecord(id);
  const day = todayStr();
  const wasEverCleared = rec.everCleared;

  let tier = null;
  if (!correct) {
    rec.wrongChoiceCounts[chosenIndex] = (rec.wrongChoiceCounts[chosenIndex] || 0) + 1;
    if (rec.wrongChoiceCounts[chosenIndex] >= 2) tier = "recurring";
    else if (wasEverCleared) tier = "slipped";
    else if (confident) tier = "confident-miss";
    else tier = "new-gap";
  }

  if (!confident) rec.everUnsure = true;

  if (correct && confident) {
    rec.streak += 1;
    rec.clearDaysLog.push(day);
  } else {
    rec.streak = 0;
    rec.clearDaysLog = [];
  }

  rec.cleared = rec.streak >= 2;
  if (rec.cleared) {
    rec.everCleared = true;
    const lastTwo = rec.clearDaysLog.slice(-2);
    rec.durable = lastTwo.length === 2 && lastTwo[0] !== lastTwo[1];
  } else {
    rec.durable = false;
  }

  rec.history.push({ ts: Date.now(), day, correct, confident, chosenIndex });
  if (rec.history.length > 30) rec.history = rec.history.slice(-30); // cap growth

  touchDayStreak();
  saveState();
  return { tier, correct };
}

// Most-recent-attempt-only weight: confident-correct=1.0, unsure-correct=0.5, else 0
function questionWeight(id) {
  const rec = STATE.perQuestion[id];
  if (!rec || rec.history.length === 0) return 0;
  const last = rec.history[rec.history.length - 1];
  if (!last.correct) return 0;
  return last.confident ? 1.0 : 0.5;
}

function isAttempted(id) {
  const rec = STATE.perQuestion[id];
  return !!(rec && rec.history.length > 0);
}

// Weighted combined mastery across a set of item ids: sum(weights)/count
function masteryForIds(ids) {
  if (!ids.length) return 0;
  const sum = ids.reduce((s, id) => s + questionWeight(id), 0);
  return sum / ids.length;
}

function inReviewList(id) {
  const rec = STATE.perQuestion[id];
  if (!rec || rec.history.length === 0) return false; // unattempted items aren't "review" yet, they're just new
  if (!rec.cleared) return true;
  if (rec.everUnsure) return true;
  if (STATE.manualFlags[id]) return true;
  return false;
}

function dueScore(id) {
  const rec = STATE.perQuestion[id];
  if (!rec) return 0;
  const last = rec.history[rec.history.length - 1];
  const daysSince = last ? Math.floor((Date.now() - last.ts) / 86400000) : 99;
  let score = (2 - rec.streak) * 10 + Math.min(daysSince, 14);
  if (rec.everUnsure) score += 5;
  if (STATE.manualFlags[id]) score += 8;
  return score;
}

// All items in the whole bank, flattened, with sub-unit context attached.
function allBankItems() {
  const out = [];
  STUDY_DATA.units.forEach(u => {
    u.subunits.forEach(su => {
      su.practicePool.forEach(it => out.push(it));
    });
  });
  Object.values(STUDY_DATA.exams).forEach(exam => {
    exam.part1.concat(exam.part2).forEach(it => out.push(it));
  });
  return out;
}

let _itemIndex = null;
function itemById(id) {
  if (!_itemIndex) {
    _itemIndex = {};
    allBankItems().forEach(it => { _itemIndex[it.id] = it; });
  }
  return _itemIndex[id];
}

function subUnitMeta(subId) {
  for (const u of STUDY_DATA.units) {
    for (const su of u.subunits) {
      if (su.id === subId) return { unit: u, sub: su };
    }
  }
  return null;
}

// Misconception Clinic: questions with a recurring (2+) wrong choice,
// most-repeated first, capped to top 3.
function misconceptionClinicData() {
  const out = [];
  Object.keys(STATE.perQuestion).forEach(id => {
    const rec = STATE.perQuestion[id];
    const entries = Object.entries(rec.wrongChoiceCounts || {}).filter(([idx, c]) => c >= 2);
    if (entries.length === 0) return;
    entries.sort((a, b) => b[1] - a[1]);
    const [idxStr, count] = entries[0];
    const item = itemById(id);
    if (!item) return;
    out.push({ item, chosenIndex: parseInt(idxStr, 10), count });
  });
  out.sort((a, b) => b.count - a.count);
  return out.slice(0, 3);
}

function reviewListGrouped() {
  const groups = {};
  allBankItems().forEach(it => {
    if (inReviewList(it.id)) {
      groups[it.sub] = groups[it.sub] || [];
      groups[it.sub].push(it);
    }
  });
  return groups;
}

function subUnitMasteryPct(subId) {
  const su = subUnitMeta(subId).sub;
  const ids = su.practicePool.map(it => it.id);
  return masteryForIds(ids);
}

function unitMasteryPct(unitId) {
  const u = STUDY_DATA.units.find(x => x.id === unitId);
  let ids = [];
  u.subunits.forEach(su => { ids = ids.concat(su.practicePool.map(it => it.id)); });
  return masteryForIds(ids);
}

function weakestSubunit() {
  let weakest = null, weakestPct = 2;
  STUDY_DATA.units.forEach(u => u.subunits.forEach(su => {
    const pct = subUnitMasteryPct(su.id);
    if (pct < weakestPct) { weakestPct = pct; weakest = su.id; }
  }));
  return weakest;
}

/* ============================================================
   DIAGRAMS -- hand-authored inline SVG, parameterized, theme-aware
   ============================================================ */
function svgNumberLine(min, max, points) {
  // points: [{value, label, color}]
  const W = 320, H = 90, pad = 24;
  const scale = v => pad + ((v - min) / (max - min)) * (W - pad*2);
  let marks = "";
  for (let v = min; v <= max; v++) {
    const x = scale(v);
    marks += `<line x1="${x}" y1="40" x2="${x}" y2="48" stroke="var(--text-soft)" stroke-width="1.5"/>`;
    marks += `<text x="${x}" y="62" font-size="10" text-anchor="middle" fill="var(--text-soft)">${v}</text>`;
  }
  let dots = "";
  (points||[]).forEach(p => {
    const x = scale(p.value);
    dots += `<circle cx="${x}" cy="40" r="6" fill="${p.color||'var(--coral)'}" stroke="var(--card)" stroke-width="2"/>`;
    if (p.label) dots += `<text x="${x}" y="26" font-size="11" text-anchor="middle" fill="var(--text)" font-weight="700">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram"><line x1="${pad}" y1="40" x2="${W-pad}" y2="40" stroke="var(--text-soft)" stroke-width="2"/>${marks}${dots}</svg>`;
}

function svgFractionBar(numerator, denominator, colorFilled) {
  const W = 280, H = 60, x0 = 10, w = W - 20;
  const seg = w / denominator;
  let rects = "";
  for (let i = 0; i < denominator; i++) {
    const filled = i < numerator;
    rects += `<rect x="${x0 + i*seg}" y="10" width="${seg}" height="40" fill="${filled ? (colorFilled||'var(--coral)') : 'var(--cream-card)'}" stroke="var(--border)" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">${rects}</svg>`;
}

function svgRectangularPrism(l, w, h) {
  // simple isometric-style box, labeled -- schematic, not to scale
  const W = 260, H = 180;
  const ox = 60, oy = 130, sx = 10 + Math.min(l*6, 90), sy = 10 + Math.min(w*4, 50), sz = 10 + Math.min(h*7, 90);
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">
    <polygon points="${ox},${oy} ${ox+sx},${oy} ${ox+sx},${oy-sz} ${ox},${oy-sz}" fill="var(--cream-card)" stroke="var(--text)" stroke-width="2"/>
    <polygon points="${ox},${oy} ${ox+sy*0.6},${oy-sy*0.5} ${ox+sy*0.6},${oy-sy*0.5-sz} ${ox},${oy-sz}" fill="var(--sage)" stroke="var(--text)" stroke-width="2"/>
    <polygon points="${ox},${oy-sz} ${ox+sy*0.6},${oy-sy*0.5-sz} ${ox+sx+sy*0.6},${oy-sy*0.5-sz} ${ox+sx},${oy-sz}" fill="var(--border)" stroke="var(--text)" stroke-width="2"/>
    <text x="${ox+sx/2}" y="${oy+16}" font-size="11" text-anchor="middle" fill="var(--text-soft)">length ${l}</text>
    <text x="${ox-30}" y="${oy-sz/2}" font-size="11" text-anchor="middle" fill="var(--text-soft)">height ${h}</text>
    <text x="${ox+sx+sy*0.3}" y="${oy-sy*0.5-sz-8}" font-size="11" text-anchor="middle" fill="var(--text-soft)">width ${w}</text>
    <text x="${W/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--text-soft)" font-style="italic">schematic, not to scale</text>
  </svg>`;
}

function svgCoordinateGrid(points, maxAxis) {
  const W = 260, H = 260, pad = 20, n = maxAxis || 10;
  const step = (W - pad*2) / n;
  const toX = x => pad + x*step;
  const toY = y => H - pad - y*step;
  let grid = "";
  for (let i = 0; i <= n; i++) {
    grid += `<line x1="${toX(i)}" y1="${pad}" x2="${toX(i)}" y2="${H-pad}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<line x1="${pad}" y1="${toY(i)}" x2="${W-pad}" y2="${toY(i)}" stroke="var(--border)" stroke-width="1"/>`;
  }
  let dots = "";
  (points||[]).forEach(p => {
    dots += `<circle cx="${toX(p.x)}" cy="${toY(p.y)}" r="6" fill="var(--coral)" stroke="var(--card)" stroke-width="2"/>`;
    dots += `<text x="${toX(p.x)+9}" y="${toY(p.y)-6}" font-size="11" fill="var(--text)" font-weight="700">(${p.x}, ${p.y})</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--text)" stroke-width="2"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--text)" stroke-width="2"/>
    ${grid}${dots}
  </svg>`;
}

function svgBarChart(dataObj, unitLabel) {
  const entries = Object.entries(dataObj);
  const W = 300, H = 160, pad = 30;
  const maxV = Math.max(...entries.map(e => e[1]), 1);
  const barW = (W - pad*2) / entries.length - 8;
  let bars = "";
  entries.forEach(([label, val], i) => {
    const h = (val / maxV) * (H - pad*2);
    const x = pad + i*((W-pad*2)/entries.length) + 4;
    const y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="var(--coral)" rx="3"/>`;
    bars += `<text x="${x+barW/2}" y="${H-pad+14}" font-size="9" text-anchor="middle" fill="var(--text-soft)">${label}</text>`;
    bars += `<text x="${x+barW/2}" y="${y-4}" font-size="10" text-anchor="middle" fill="var(--text)" font-weight="700">${val}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="jt-diagram">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--text)" stroke-width="2"/>
    ${bars}
  </svg>`;
}
/* ============================================================
   RENDER UTILITIES
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Parses {b}...{b/} / {b}...{/b} as bold-accent, {w}...{w/} / {w}...{/w} as
// highlighted trap/exception. Tolerant of either closing-tag spelling since
// the authored notes used both conventions.
function parseNoteMarkup(raw) {
  let s = escapeHtml(raw);
  s = s.replace(/\{b\}(.*?)\{\/?b\/?\}/gs, '<span class="note-bold">$1</span>');
  s = s.replace(/\{w\}(.*?)\{\/?w\/?\}/gs, '<span class="note-highlight">$1</span>');
  return s;
}

// Auto-link glossary terms (longest-first so multi-word terms match before
// their substrings) wherever they appear in bullet/hook text. Embeds the
// definition/mnemonic directly as data attributes so the popup needs no
// separate lookup step.
function autoLinkGlossary(html, glossary) {
  const terms = Object.keys(glossary || {}).sort((a,b) => b.length - a.length);
  terms.forEach(term => {
    const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?<![\\w-])(' + safe + ')(?![\\w-])', 'gi');
    const g = glossary[term];
    const defAttr = escapeHtml(g.def);
    const mnemonicAttr = escapeHtml(g.mnemonic || "");
    html = html.replace(re, (m) => `<span class="glossary-term" data-action="glossary" data-term="${escapeHtml(term)}" data-def="${defAttr}" data-mnemonic="${mnemonicAttr}">${m}</span>`);
  });
  return html;
}

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Renders a shuffled 4-choice list. `revealState` (optional): when set,
// shows correct/incorrect coloring for the given authoredSelectedIndex.
function renderChoices(item, opts) {
  opts = opts || {};
  const order = opts.displayOrder || fisherYates([0,1,2,3]);
  const letters = ["A","B","C","D"];
  let html = `<div class="choice-list" data-display-order="${order.join(',')}">`;
  order.forEach((authoredIdx, pos) => {
    let cls = "choice-btn";
    if (opts.revealed) {
      if (authoredIdx === item.correctIndex) cls += " correct";
      else if (authoredIdx === opts.selectedAuthoredIndex) cls += " incorrect";
    } else if (authoredIdx === opts.selectedAuthoredIndex) {
      cls += " selected";
    }
    const disabled = opts.revealed ? "disabled" : "";
    html += `<button class="${cls}" ${disabled} data-action="${opts.action||'choose'}" data-authored-index="${authoredIdx}">
      <span class="choice-letter">${letters[pos]}</span><span>${escapeHtml(item.choices[authoredIdx])}</span>
    </button>`;
  });
  html += `</div>`;
  return html;
}

function iowaCatPillClass(cat) {
  return { NumberSense: "pill-sense", Computation: "pill-comp", AlgebraicPatterns: "pill-alg",
            Geometry: "pill-geo", Measurement: "pill-meas", DataAnalysis: "pill-data" }[cat] || "pill-sense";
}
function iowaCatLabel(cat) {
  return { NumberSense: "Number Sense", Computation: "Computation", AlgebraicPatterns: "Algebraic Patterns",
            Geometry: "Geometry", Measurement: "Measurement", DataAnalysis: "Data Analysis" }[cat] || cat;
}

// A "Show a clue" nudge -- reuses the sub-unit's own step-by-step method
// (never the specific answer). For sub-units that cover more than one
// operation (nbt2, nbt3), picks the more relevant step based on the
// operator actually appearing in the stem.
function fmtPct(x) { return Math.round(x * 100) + "%"; }

function clueForItem(item) {
  const su = subUnitMeta(item.sub).sub;
  const steps = (su.notes.stepByStep && su.notes.stepByStep.steps) || [];
  if (!steps.length) return "Try re-reading the question slowly, one part at a time.";
  if (item.sub === "nbt2") {
    return /×/.test(item.stem) ? steps[3] : steps[0];
  }
  if (item.sub === "nbt3") {
    if (/÷/.test(item.stem)) return steps[0];
    return steps[2]; // decimal add/sub/mult step
  }
  return steps[0];
}

function fmtTime(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return m + ":" + String(s).padStart(2, "0");
}

// A light-touch diagram picker for items that clearly benefit from one,
// based on the sub-unit and a couple of stem keywords. Kept conservative --
// most items show no diagram at all.
function diagramForItem(item) {
  if (item.sub === "g2") {
    const m = item.stem.match(/\((\d+),\s*(\d+)\)/);
    if (m) return svgCoordinateGrid([{x: parseInt(m[1]), y: parseInt(m[2])}], 10);
  }
  if (item.sub === "md2" && /prism/i.test(item.stem)) {
    const m = item.stem.match(/length of (\d+).*width of (\d+).*height of (\d+)/is);
    if (m) return svgRectangularPrism(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
  }
  if (item.sub === "nf1" || item.sub === "nf2") {
    const m = item.stem.match(/^(\d+)\/(\d+)/);
    if (m && parseInt(m[2]) <= 12) return svgFractionBar(parseInt(m[1]), parseInt(m[2]));
  }
  return null;
}

/* ============================================================
   LEARN MODE
   Sequential walk (resume from first not-learned) OR a single-sub-unit
   detour (from a missed quiz/exam question), which skips straight to
   notes with a prominent "back to where you were" button.
   ============================================================ */

function startSequentialLearn(unitId) {
  const u = STUDY_DATA.units.find(x => x.id === unitId);
  const remaining = u.subunits.filter(su => !STATE.learned[su.id]).map(su => su.id);
  const queue = remaining.length ? remaining : u.subunits.map(su => su.id); // all learned -> allow re-walk
  UI.session.learn = { queue, mode: "sequential", step: "blindguess", returnUnit: unitId };
  UI.session.learnShowMore = false;
  UI.view = "learn";
  render();
}

function startDetourLearn(subId, returnTo) {
  UI.session.learn = { queue: [subId], mode: "detour", step: "notes", returnTo };
  UI.session.learnShowMore = false;
  UI.view = "learn";
  render();
}

function currentLearnSub() {
  const L = UI.session.learn;
  return subUnitMeta(L.queue[0]).sub;
}

function viewLearn() {
  const L = UI.session.learn;
  if (!L || L.queue.length === 0) {
    return `<div class="card center-text">${judyPanel("cheer","All caught up here! Great work.")}
      <button class="btn btn-primary mt16" data-action="learn-finish">Continue</button></div>`;
  }
  const su = currentLearnSub();

  if (L.step === "blindguess") {

    UI.session.learnBlindOrder = fisherYates([0,1,2,3]);
    return `
      <div class="small-text">Learn: ${su.name} — quick warm-up (this one's just for fun, no pressure!)</div>

        <button class="btn btn-ghost btn-block mt16" data-action="learn-skip-to-notes">Not sure yet — skip to notes</button>
      </div>`;
  }

  if (L.step === "reveal") {
    const q = UI.session.learnBlindItem;
    const chosen = UI.session.learnBlindChosen;
    return `
      <div class="small-text">Learn: ${su.name} — warm-up result</div>
      ${judyPanel(chosen === q.correctIndex ? "cheer" : "encourage",
        chosen === q.correctIndex ? "You got it! Let's see why, then dig into the full topic." : "Good try — let's learn exactly how this works.")}
      <div class="card">

        <div class="explanation-box">${escapeHtml(q.explanations[q.correctIndex])}</div>
        <button class="btn btn-primary btn-block mt16" data-action="learn-goto-notes">See the full topic →</button>
      </div>`;
  }

  // step === "notes"
  const bulletsHtml = notes.bullets.map(b => {
    let html = parseNoteMarkup(b);
    html = autoLinkGlossary(html, notes.glossary);
    return `<div class="note-bullet">${html}</div>`;

  const backBtn = L.mode === "detour"
    ? `<button class="btn btn-ghost btn-sm mt8" data-action="learn-detour-back">← Back to ${L.returnTo.type === "exam" ? "Results" : "Quiz"}</button>`
    : "";
  const isLast = L.queue.length === 1;
  const showMore = !!UI.session.learnShowMore;
  return `
    ${backBtn}
    <div class="small-text mt8">${L.mode === "sequential" ? "Learn: " : "Quick refresher: "}${su.name}</div>

      ${bulletsHtml}

        <button class="btn btn-secondary mt8" data-action="learn-more-explanations">Still not clicking? More explanations</button>

      <h3>Glossary</h3>

    </div>
    ${backBtn ? "" : `<button class="btn btn-primary btn-block mt16" data-action="learn-next-subunit">${isLast ? "Finish" : "Next topic →"}</button>`}
  `;
}
