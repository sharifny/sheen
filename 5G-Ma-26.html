/* ============================================================
   LEARN MODE
   Sequential walk (resume from first not-learned) OR a single-sub-unit
   detour (from a missed quiz/exam question), which skips straight to
   notes with a prominent "back to where you were" button.
   ============================================================ */

function startSequentialLearn(unitId) {
  const u = STUDY_DATA.units.find(x => x.id === unitId);
  const remaining = u.subunits.filter(su => !STATE.learned[su.id]).map(su => su.id);
  const queue = remaining.length ? remaining : u.subunits.map(su => su.id); // all learned -> allow re-walk
  UI.session.learn = { queue, mode: "sequential", step: "blindguess", returnUnit: unitId };
  UI.view = "learn";
  render();
}

function startDetourLearn(subId, returnTo) {
  UI.session.learn = { queue: [subId], mode: "detour", step: "notes", returnTo };
  UI.view = "learn";
  render();
}

function currentLearnSub() {
  const L = UI.session.learn;
  return subUnitMeta(L.queue[0]).sub;
}

function viewLearn() {
  const L = UI.session.learn;
  if (!L || L.queue.length === 0) {
    return `<div class="card center-text">${judyPanel("cheer","All caught up here! Great work.")}
      <button class="btn btn-primary mt16" data-action="learn-finish">Continue</button></div>`;
  }
  const su = currentLearnSub();
  const notes = su.notes;

  if (L.step === "blindguess") {
    const q = su.practicePool[0];
    UI.session.learnBlindItem = q;
    UI.session.learnBlindOrder = fisherYates([0,1,2,3]);
    return `
      <div class="small-text">Learn: ${su.name} — quick warm-up (this one's just for fun, no pressure!)</div>
      ${judyPanel("think", "Before I show you how this works — take a guess. It's totally fine not to know yet!")}
      <div class="card">
        <div class="q-stem">${escapeHtml(q.stem)}</div>
        ${renderChoices(q, {displayOrder: UI.session.learnBlindOrder, action:"learn-blind-choose"})}
        <button class="btn btn-ghost btn-block mt16" data-action="learn-skip-to-notes">Not sure yet — skip to notes</button>
      </div>`;
  }

  if (L.step === "reveal") {
    const q = UI.session.learnBlindItem;
    const chosen = UI.session.learnBlindChosen;
    return `
      <div class="small-text">Learn: ${su.name} — warm-up result</div>
      ${judyPanel(chosen === q.correctIndex ? "cheer" : "encourage",
        chosen === q.correctIndex ? "You got it! Let's see why, then dig into the full topic." : "Good try — let's learn exactly how this works.")}
      <div class="card">
        <div class="q-stem">${escapeHtml(q.stem)}</div>
        ${renderChoices(q, {displayOrder: UI.session.learnBlindOrder, revealed:true, selectedAuthoredIndex: chosen})}
        <div class="explanation-box">${escapeHtml(q.explanations[q.correctIndex])}</div>
        <button class="btn btn-primary btn-block mt16" data-action="learn-goto-notes">See the full topic →</button>
      </div>`;
  }

  // step === "notes"
  const bulletsHtml = notes.bullets.map(b => {
    let html = parseNoteMarkup(b);
    html = autoLinkGlossary(html, notes.glossary);
    return `<div class="note-bullet">${html}</div>`;
  }).join("");
  const backBtn = L.mode === "detour"
    ? `<button class="btn btn-ghost btn-sm mt8" data-action="learn-detour-back">← Back to ${L.returnTo.type === "exam" ? "Results" : "Quiz"}</button>`
    : "";
  const isLast = L.queue.length === 1;
  return `
    ${backBtn}
    <div class="small-text mt8">${L.mode === "sequential" ? "Learn: " : "Quick refresher: "}${su.name}</div>
    ${judyPanel("cheer", notes.hook)}
    <div class="card">
      <h3>What to Know</h3>
      ${bulletsHtml}
      <div class="watch-out"><strong>⚠️ Watch out:</strong> ${parseNoteMarkup(notes.watchOut)}</div>
    </div>
    <div class="card">
      <h3>Glossary</h3>
      <div class="tag-row">${Object.entries(notes.glossary).map(([t,g]) => `<span class="glossary-term" data-action="glossary" data-term="${escapeHtml(t)}" data-def="${escapeHtml(g.def)}" data-mnemonic="${escapeHtml(g.mnemonic||'')}">${escapeHtml(t)}</span>`).join(" · ")}</div>
    </div>
    ${backBtn ? "" : `<button class="btn btn-primary btn-block mt16" data-action="learn-next-subunit">${isLast ? "Finish" : "Next topic →"}</button>`}
  `;
}

/* ============================================================

function startQuizSession(items, sessionType, subId) {
  UI.session.quiz = {
    subId, sessionType, queue: items.slice(), pos: 0,
    selectedIndex: null, confidence: null, revealed: false,
    displayOrder: fisherYates([0,1,2,3]), flagged: false,
    stats: { correct: 0, total: 0 },
  };
  UI.view = "quiz";
  render();
}

function startSubUnitQuiz(subId) {
  const su = subUnitMeta(subId).sub;
  startQuizSession(fisherYates(su.practicePool), "subunit", subId);
}

function startReviewListSession() {
  const groups = reviewListGrouped();
  let items = [];
  Object.values(groups).forEach(arr => { items = items.concat(arr); });
  items.sort((a,b) => dueScore(b.id) - dueScore(a.id));
  if (items.length === 0) { UI.view = "review"; render(); return; }
  startQuizSession(items, "reviewList", null);
}

function startSingleItemSession(itemId) {
  const item = itemById(itemId);
  startQuizSession([item], "single", item.sub);
}

function startComputationTuneup() {
  const nbt2 = subUnitMeta("nbt2").sub.practicePool.filter(i => i.iowaCat === "Computation");
  const nbt3 = subUnitMeta("nbt3").sub.practicePool.filter(i => i.iowaCat === "Computation");
  const items = fisherYates(nbt2.concat(nbt3)).slice(0, 8);
  startQuizSession(items, "tuneup", null);
}

function viewQuiz() {
  const Q = UI.session.quiz;
  if (Q.detourReturn) {
    Q.detourReturn = false;
    Q.pos += 1;
    Q.selectedIndex = null; Q.confidence = null; Q.revealed = false;
    Q.displayOrder = fisherYates([0,1,2,3]);
  }
  if (Q.pos >= Q.queue.length) {
    return `<div class="card center-text">
      ${judyPanel("cheer", `Session complete! You got ${Q.stats.correct} of ${Q.stats.total} correct. Every attempt makes the real test easier.`)}
      <div class="mt16" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" data-action="quiz-done-dashboard">Back to Trail Map</button>
        <button class="btn btn-secondary" data-action="goto-review">Open Review List</button>
      </div>
    </div>`;
  }
  const item = Q.queue[Q.pos];
  const diagram = diagramForItem(item);
  let html = `<button class="btn btn-ghost btn-sm" data-action="quiz-exit">← Exit session</button>
    <div class="small-text mt8">Question ${Q.pos+1} of ${Q.queue.length} <span class="pill ${iowaCatPillClass(item.iowaCat)}">${iowaCatLabel(item.iowaCat)}</span></div>
    <div class="card">
      <div class="q-stem">${escapeHtml(item.stem)}</div>
      ${diagram ? `<div class="mt8 mb0">${diagram}</div>` : ""}
      ${renderChoices(item, {displayOrder: Q.displayOrder, revealed: Q.revealed, selectedAuthoredIndex: Q.selectedIndex})}`;

  if (Q.selectedIndex !== null && !Q.revealed) {
    html += `<div class="mt16">
      <div class="small-text">How confident are you?</div>
      <div class="confidence-row">
        <button class="btn btn-secondary btn-sm" data-action="quiz-confidence" data-level="confident">😊 Confident</button>
        <button class="btn btn-secondary btn-sm" data-action="quiz-confidence" data-level="unsure">🤔 Not sure</button>
      </div>
    </div>`;
  }

  if (Q.revealed) {
    const correct = Q.selectedIndex === item.correctIndex;
    const tierMsg = {
      "recurring": "This exact mix-up has come up before — let's make sure it clicks this time.",
      "slipped": "You had this one solid before — just a little rust. A quick refresher will bring it right back.",
      "confident-miss": "You were sure about this one — those are worth a closer look since they teach the most.",
      "new-gap": "First time seeing this — totally normal, that's what practice is for.",
    }[Q.lastTier] || "";
    html += `<div class="explanation-box">${escapeHtml(item.explanations[Q.selectedIndex])}
      ${!correct ? `<div class="mt8"><strong>Correct answer:</strong> ${escapeHtml(item.choices[item.correctIndex])} — ${escapeHtml(item.explanations[item.correctIndex])}</div>` : ""}
      ${tierMsg ? `<div class="mt8 small-text">${tierMsg}</div>` : ""}
    </div>
    <div class="mt16" style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" data-action="quiz-next">${Q.pos+1 >= Q.queue.length ? "Finish" : "Next question →"}</button>
      ${!correct ? `<button class="btn btn-secondary" data-action="quiz-study-retry">Study this, then retry</button>` : ""}
      <button class="btn btn-ghost btn-sm" data-action="quiz-flag" data-id="${item.id}">${STATE.manualFlags[item.id] ? "🚩 Flagged" : "🏳️ Flag for review"}</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

const QuizActions = {
  "choose": (el) => {
    const Q = UI.session.quiz;
    if (Q.revealed) return;
    Q.selectedIndex = parseInt(el.dataset.authoredIndex, 10);
    render();
  },
  "quiz-confidence": (el) => {
    const Q = UI.session.quiz;
    const item = Q.queue[Q.pos];
    const confident = el.dataset.level === "confident";
    const correct = Q.selectedIndex === item.correctIndex;
    const result = recordAttempt(item.id, { correct, confident, chosenIndex: Q.selectedIndex });
    Q.lastTier = result.tier;
    Q.revealed = true;
    Q.stats.total += 1;
    if (correct) Q.stats.correct += 1;
    render();
  },
  "quiz-next": () => {
    const Q = UI.session.quiz;
    Q.pos += 1;
    Q.selectedIndex = null; Q.confidence = null; Q.revealed = false;
    Q.displayOrder = fisherYates([0,1,2,3]);
    render();
  },
  "quiz-study-retry": () => {
    const Q = UI.session.quiz;
    const item = Q.queue[Q.pos];

/* ============================================================
   EXAM SIMULATION -- true Iowa Level 11 Math format:
   Part 1&2 (Concepts/Problem Solving/Data): 60 min, 60 items
   Computation: 20 min, 29 items
   Completion (not score) unlocks the next exam.
   ============================================================ */
const EXAM_TIPS = [
  "Pacing for Part 1: about 1 minute per question — if one's taking too long, mark your best guess and keep moving.",
  "Pacing for Part 2 (Computation): under 45 seconds per question — these are meant to move fast.",
  "Read the whole question before looking at the answer choices — they're designed to tempt a fast skim.",
  "You can move forward and back within a part to double-check answers before time runs out.",
  "If a computation problem has a zero in the middle of your answer, double-check you didn't drop it.",
  "Estimate first on word problems so you can sanity-check whether your exact answer is in the right ballpark.",
];

let examTimerInterval = null;
function clearExamTimer() { if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; } }

function startExamPretest(examKey) {
  UI.session.exam = { examKey, phase: "pretest", predicted: 70, tips: fisherYates(EXAM_TIPS).slice(0,4) };
  UI.view = "examPretest";
  render();
}

function viewExamPretest() {
  const E = UI.session.exam;
  const spec = STUDY_DATA.meta.examSpec;
  return `
    ${judyPanel("encourage", "Here's the format, exactly like the real thing. Take a breath — you've prepared for this.")}
    <div class="card">
      <h3>Format</h3>
      <ul>
        <li><strong>Part 1 — ${spec.part1.label}:</strong> ${spec.part1.items} items, ${spec.part1.minutes} minutes</li>
        <li><strong>Part 2 — ${spec.part2.label}:</strong> ${spec.part2.items} items, ${spec.part2.minutes} minutes</li>
      </ul>
      <div class="small-text">Answers aren't shown as right/wrong during the exam — just like the real test. You'll see everything on the results screen.</div>
    </div>
    <div class="card">
      <h3>Quick tips</h3>
      <ul>${E.tips.map(t => `<li>${t}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>Before you start: guess your score</h3>
      <div class="small-text">No wrong answers here — just your gut feeling. It's interesting to compare afterward.</div>
      <input type="range" min="0" max="100" value="${E.predicted}" data-action="predict-slider" class="mt16" style="width:100%;">
      <div class="center-text display" id="predict-display" style="font-size:1.5rem;">${E.predicted}%</div>
    </div>

      <strong>Once you start:</strong> exiting early won't count as a completed attempt. Make sure you've got enough time.
    </div>
    <button class="btn btn-primary btn-block" data-action="exam-start-part1">Start Part 1</button>
    <button class="btn btn-ghost btn-block mt8" data-action="goto-dashboard">Not now</button>
  `;
}

function beginExamPart(partNum) {
  const E = UI.session.exam;
  const exam = STUDY_DATA.exams[E.examKey];
  const items = partNum === 1 ? exam.part1 : exam.part2;
  const spec = partNum === 1 ? STUDY_DATA.meta.examSpec.part1 : STUDY_DATA.meta.examSpec.part2;
  E.phase = "part" + partNum;
  UI.view = "examPart";
  E.pos = 0;
  E.answers = new Array(items.length).fill(null);
  E.displayOrders = items.map(() => fisherYates([0,1,2,3]));
  E.timeLeftSec = spec.minutes * 60;
  E.items = items;
  render();
  clearExamTimer();
  examTimerInterval = setInterval(() => {
    E.timeLeftSec -= 1;
    const el = document.getElementById("exam-timer-display");
    if (el) {
      el.textContent = fmtTime(Math.max(0, E.timeLeftSec));
      el.className = "exam-timer" + (E.timeLeftSec <= 60 ? " low" : "");
    }
    if (E.timeLeftSec <= 0) {
      clearExamTimer();
      submitExamPart();
    }
  }, 1000);
}

function submitExamPart() {
  clearExamTimer();
  const E = UI.session.exam;
  if (E.phase === "part1") {
    E.part1Answers = E.answers; E.part1Items = E.items;
    beginExamPart(2);
  } else if (E.phase === "part2") {
    E.part2Answers = E.answers; E.part2Items = E.items;
    finishExam();
  }
}

function finishExam() {
  const E = UI.session.exam;
  const subScores = {};
  function tally(items, answers) {
    items.forEach((item, i) => {
      subScores[item.sub] = subScores[item.sub] || { correct: 0, total: 0, missed: [] };
      subScores[item.sub].total += 1;
      const ans = answers[i];
      const correct = ans && ans.chosenIndex === item.correctIndex;
      if (correct) subScores[item.sub].correct += 1;
      else subScores[item.sub].missed.push({ item, chosenIndex: ans ? ans.chosenIndex : null });
    });
  }
  tally(E.part1Items, E.part1Answers);
  tally(E.part2Items, E.part2Answers);
  const part1Correct = E.part1Answers.filter((a,i) => a && a.chosenIndex === E.part1Items[i].correctIndex).length;
  const part2Correct = E.part2Answers.filter((a,i) => a && a.chosenIndex === E.part2Items[i].correctIndex).length;
  const ranked = Object.entries(subScores).map(([sub, s]) => ({ sub, pct: s.correct / s.total, ...s }))
    .sort((a,b) => a.pct - b.pct);
  const attempt = {
    date: Date.now(),
    part1: { correctCount: part1Correct, total: E.part1Items.length },
    part2: { correctCount: part2Correct, total: E.part2Items.length },
    predicted: E.predicted,
    subScores,
    weakestSubs: ranked.slice(0,3).map(r => r.sub),
  };
  STATE.examAttempts[E.examKey] = attempt;
  saveState();
  UI.view = "examResults";
  UI.params = { examKey: E.examKey };
  render();
}

  if (E.exitConfirmOpen) {

  }
  return html;
}

function viewExamResults() {
  const attempt = STATE.examAttempts[UI.params.examKey];
  if (!attempt) return `<div class="card">No attempt found. <button class="btn btn-primary" data-action="goto-dashboard">Back</button></div>`;
  const totalCorrect = attempt.part1.correctCount + attempt.part2.correctCount;

  let html = `

    <div class="card center-text">

  attempt.weakestSubs.forEach(subId => {

  } else {

  html += `</div></div>`;

}

    try {
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => /Google US English|Natural|Aria|Jenny|Samantha/i.test(v.name) && /en-US|en_US/i.test(v.lang))
                     || voices.find(v => /en-US/i.test(v.lang)) || voices[0];
      const utter = new SpeechSynthesisUtterance(el.dataset.term);
      if (preferred) utter.voice = preferred;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* speech synthesis unavailable -- silently ignore */ }
  },
  "print-guide": () => window.print(),
};
/* ============================================================
   OPTIONAL GAMES -- pure reinforcement, reuse existing content,
   NEVER write to mastery/streak/review-list state.
   ============================================================ */
function allGlossaryTerms() {
  const out = [];
  STUDY_DATA.units.forEach(u => u.subunits.forEach(su => {
    Object.entries(su.notes.glossary).forEach(([term, g]) => out.push({ term, def: g.def }));
  }));
  return out;
}

function buildTermMatchRound() {
  const all = allGlossaryTerms();
  const shuffled = fisherYates(all);
  const rounds = shuffled.slice(0, 8).map(target => {
    const distractors = fisherYates(all.filter(t => t.term !== target.term)).slice(0,3);
    const options = fisherYates([target, ...distractors]);
    return { term: target.term, correctDef: target.def, options };
  });
  return rounds;
}

function speedRoundEligibleItems() {
  return allBankItems().filter(it => /=\s*\?\s*$/.test(it.stem.trim()));
}

function buildSpeedRound() {
  const pool = fisherYates(speedRoundEligibleItems()).slice(0, 10);
  return pool.map(item => {
    const makeTrue = Math.random() < 0.5;
    const chosenIdx = makeTrue ? item.correctIndex : fisherYates(item.choices.map((_,i)=>i).filter(i=>i!==item.correctIndex))[0];
    const statement = item.stem.replace(/\?\s*$/, item.choices[chosenIdx]);
    return { statement, isTrue: makeTrue };
  });
}

function startGame(gameId) {
  if (gameId === "termMatch") {
    UI.session.game = { id: "termMatch", rounds: buildTermMatchRound(), pos: 0, score: 0 };
  } else {
    UI.session.game = { id: "speedRound", rounds: buildSpeedRound(), pos: 0, score: 0 };
  }
  UI.view = "game";
  render();
}

function viewGame() {
  const G = UI.session.game;
  if (G.pos >= G.rounds.length) {
    return `<div class="card center-text">
      ${judyPanel("cheer", `Score: ${G.score}/${G.rounds.length}! ${G.score === G.rounds.length ? "Perfect round!" : "Nice reps — that's just for fun, no pressure."}`)}
      <div class="mt16" style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-primary" data-action="goto-game" data-game="${G.id}">Play again</button>
        <button class="btn btn-secondary" data-action="goto-dashboard">Back to Trail Map</button>
      </div>
    </div>`;
  }
  const r = G.rounds[G.pos];
  let html = `<div class="small-text">🎮 ${G.id === "termMatch" ? "Term Match" : "Speed Round True/False"} — ${G.pos+1}/${G.rounds.length} · Score: ${G.score}</div>`;
  if (G.id === "termMatch") {
    html += `<div class="card"><h3>Which definition matches: "${escapeHtml(r.term)}"?</h3>
      <div class="choice-list mt16">${r.options.map(o => `<button class="choice-btn" data-action="game-term-choose" data-correct="${o.def === r.correctDef}">${escapeHtml(o.def)}</button>`).join("")}</div>
    </div>`;
  } else {
    html += `<div class="card center-text">
      <div class="q-stem">${escapeHtml(r.statement)}</div>
      <div class="mt16" style="display:flex; gap:14px; justify-content:center;">
        <button class="btn btn-primary" data-action="game-tf-choose" data-answer="true">✅ True</button>
        <button class="btn btn-secondary" data-action="game-tf-choose" data-answer="false">❌ False</button>
      </div>
    </div>`;
  }
  return html;
}

const GameActions = {
  "goto-game": (el) => startGame(el.dataset.game),
  "game-term-choose": (el) => {
    const G = UI.session.game;
    if (el.dataset.correct === "true") G.score += 1;
    G.pos += 1;
    render();
  },
  "game-tf-choose": (el) => {
    const G = UI.session.game;
    const r = G.rounds[G.pos];
    const answeredTrue = el.dataset.answer === "true";
    if (answeredTrue === r.isTrue) G.score += 1;
    G.pos += 1;
    render();
  },
};
/* ============================================================
   APP BOOTSTRAP, ROUTER, GLOBAL ACTIONS
   ============================================================ */
const UI = { view: "dashboard", params: {}, session: {}, glossaryOpen: null };

function parentUnitId(subId) {
  return subUnitMeta(subId).unit.id;
}

function startSingleSubunitLearn(subId) {
  UI.session.learn = { queue: [subId], mode: "sequential", step: "blindguess", returnUnit: parentUnitId(subId) };
  UI.view = "learn";
  render();
}

function viewSettings() {
  return `
    <h2>Settings</h2>
    <div class="card">
      <h3>Appearance</h3>
      <div class="card-row" style="justify-content:space-between;">
        <span>Dark mode</span>
        <button class="btn btn-secondary btn-sm" data-action="toggle-theme">${STATE.settings.theme === "dark" ? "On" : "Off"}</button>
      </div>
    </div>
    <div class="card">
      <h3>📅 Iowa test date</h3>
      <input type="date" id="exam-date-input" value="${STATE.settings.examDate || ""}" style="padding:10px; border-radius:10px; border:2px solid var(--border); font-size:1rem;">
      <button class="btn btn-primary btn-sm mt8" data-action="save-exam-date">Save</button>
    </div>
    <div class="card">
      <h3>📘 Study Guide</h3>
      <div class="small-text">Printable notes for every topic — great for the night before.</div>
      <button class="btn btn-secondary btn-sm mt16" data-action="goto-studyguide">Open Study Guide</button>
    </div>
    <div class="card" style="border-left:5px solid var(--danger);">
      <h3>Reset progress</h3>
      <div class="small-text">Clears all mastery data, exam attempts, and the review list. Can't be undone.</div>
      <button class="btn btn-ghost btn-sm mt16" data-action="reset-progress" style="border-color:var(--danger); color:var(--danger);">Reset everything</button>
    </div>
    <button class="btn btn-ghost btn-block mt16" data-action="goto-dashboard">← Back</button>
  `;
}

function mainViewHtml() {
  switch (UI.view) {
    case "dashboard": return viewDashboard();
    case "unit": return viewUnit(UI.params.unitId);
    case "learn": return viewLearn();
    case "quiz": return viewQuiz();
    case "examPretest": return viewExamPretest();
    case "examPart": return viewExamRunning();
    case "examResults": return viewExamResults();
    case "review": return viewReview();
    case "studyGuide": return viewStudyGuide();
    case "game": return viewGame();
    case "settings": return viewSettings();
    default: return viewDashboard();
  }
}

function render() {
  const root = document.getElementById("judy-app");
  const isFocused = UI.view === "examPart"; // exam running: hide global nav, own header instead
  if (isFocused) {
    root.innerHTML = mainViewHtml() + glossaryOverlayHtml();
  } else {
    root.innerHTML = `
      <div class="jt-topbar">
        <div class="brand" data-action="goto-dashboard" style="cursor:pointer;">🐇 Judy's Math Trail</div>
        <div class="jt-topbar-actions">
          <button class="icon-btn" data-action="goto-studyguide" aria-label="Study Guide">📘</button>
          <button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙️</button>
        </div>
      </div>
      <div class="jt-container">${mainViewHtml()}</div>
      ${glossaryOverlayHtml()}
    `;
  }
  const predictDisplay = document.getElementById("predict-display");
  if (predictDisplay && UI.session.exam) predictDisplay.textContent = UI.session.exam.predicted + "%";
}

const NavActions = {
  "goto-dashboard": () => { UI.view = "dashboard"; render(); },
  "goto-unit": (el) => { UI.view = "unit"; UI.params = { unitId: el.dataset.unit }; render(); },
  "goto-learn": (el) => startSingleSubunitLearn(el.dataset.sub),
  "continue-learning-unit": (el) => startSequentialLearn(el.dataset.unit),
  "goto-quiz": (el) => startSubUnitQuiz(el.dataset.sub),
  "goto-review": () => { UI.view = "review"; render(); },
  "goto-studyguide": () => { UI.view = "studyGuide"; render(); },
  "goto-exam-pretest": (el) => startExamPretest(el.dataset.exam),
  "open-settings": () => { UI.view = "settings"; render(); },
  "toggle-theme": () => {
    STATE.settings.theme = STATE.settings.theme === "dark" ? "light" : "dark";
    document.getElementById("judy-app").setAttribute("data-theme", STATE.settings.theme);
    saveState();
    render();
  },
  "save-exam-date": () => {
    const val = document.getElementById("exam-date-input").value;
    if (val) { STATE.settings.examDate = val; saveState(); }
    UI.view = "dashboard"; render();
  },
  "reset-progress": () => {
    if (confirm("This clears all progress and can't be undone. Continue?")) {
      STATE = defaultState();
      seedKnownWeakSpots();
      saveState();
      UI.view = "dashboard"; render();
    }
  },
};

const ALL_ACTIONS = Object.assign({}, NavActions, LearnActions, QuizActions, ExamActions, ReviewActions, GameActions);

function handleGlobalClick(evt) {
  const el = evt.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const fn = ALL_ACTIONS[action];
  if (fn) fn(el, evt);
  else console.warn("No handler for action:", action);
}

function handleGlobalInput(evt) {
  const el = evt.target;
  if (el.dataset && el.dataset.action === "predict-slider") {
    UI.session.exam.predicted = parseInt(el.value, 10);
    const disp = document.getElementById("predict-display");
    if (disp) disp.textContent = el.value + "%";
  }
}

async function initApp() {
  await loadState();
  document.getElementById("judy-app").setAttribute("data-theme", STATE.settings.theme || "light");
  document.getElementById("judy-app").addEventListener("click", handleGlobalClick);
  document.getElementById("judy-app").addEventListener("input", handleGlobalInput);
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initApp);
} else {
  initApp();
}

</script>
</body>
</html>
